  const nameInp = el("input",{class:"inp",style:{fontFamily:"monospace",fontSize:"11px"},value:f.name,placeholder:"Auto-generated..."});
  nameInp.addEventListener("input", e => { state.draftForm.name=e.target.value; state.draftNameOverridden=true; });
  const autoBtn = renderBtn("Auto", false, () => { state.draftNameOverridden=false; updateDraftName(); render(); }, {flexShrink:0,fontSize:"11px"});
  nameRow.appendChild(nameInp);
  nameRow.appendChild(autoBtn);
  nameCard.appendChild(nameRow);
  formArea.appendChild(nameCard);

  // Account settings
  const accCard = div("card",{marginBottom:"12px"});
  const accGrid = div("grid2",{marginBottom:"10px"});

  const platWrap = div("",{});
  platWrap.appendChild(el("span",{class:"lbl"},"PLATFORM"));
  const platSel = renderSel(f.platform, state.platforms.map(p=>({value:p.name,label:p.name})), v => {
    state.draftForm.platform=v;
    state.draftForm.accountId = state.accounts.find(a=>a.platform===v&&a.status==="active")?.id||"";
    if (!state.draftNameOverridden) updateDraftName();
    render();
  });
  platWrap.appendChild(platSel);
  accGrid.appendChild(platWrap);

  const accWrap2 = div("",{});
  accWrap2.appendChild(el("span",{class:"lbl"},"ACCOUNT"));
  const platAccs = state.accounts.filter(a=>a.platform===f.platform&&a.status==="active");
  const accSel2 = renderSel(f.accountId, platAccs.map(a=>({value:a.id,label:a.sub+" - "+a.handle})), v => { state.draftForm.accountId=v; if(!state.draftNameOverridden) updateDraftName(); render(); });
  accWrap2.appendChild(accSel2);
  accGrid.appendChild(accWrap2);
  accCard.appendChild(accGrid);

  const typeGrid = div("grid3",{});
  const typeWrap = div("",{});
  typeWrap.appendChild(el("span",{class:"lbl"},"TYPE"));
  const typeSel = renderSel(f.type, state.postTypes.map(t=>({value:t.id,label:t.name})), v => { state.draftForm.type=v; if(!state.draftNameOverridden) updateDraftName(); render(); });
  typeWrap.appendChild(typeSel);
  typeGrid.appendChild(typeWrap);

  const statWrap = div("",{});
  statWrap.appendChild(el("span",{class:"lbl"},"STATUS"));
  const statSel = renderSel(f.status, ["draft","scheduled","posted"].map(s=>({value:s,label:s})), v=>{ state.draftForm.status=v; });
  statWrap.appendChild(statSel);
  typeGrid.appendChild(statWrap);

  const schedWrap = div("",{});
  schedWrap.appendChild(el("span",{class:"lbl"},"SCHEDULE"));
  const schedInp = el("input",{type:"datetime-local",class:"inp",value:f.scheduledAt});
  schedInp.addEventListener("change", e=>{ state.draftForm.scheduledAt=e.target.value; if(!state.draftNameOverridden) updateDraftName(); });
  schedWrap.appendChild(schedInp);
  typeGrid.appendChild(schedWrap);
  accCard.appendChild(typeGrid);
  formArea.appendChild(accCard);

  // Content selection
  const contentCard = div("card",{marginBottom:"12px"});
  contentCard.appendChild(el("span",{class:"lbl"},"SELECT CONTENT"));

  const modelContent = state.model==="all"?state.content:state.content.filter(c=>c.modelId===state.model);

  // Search and filter controls
  const pickerSearch = state.draftPickerSearch||"";
  const pickerFolder = state.draftPickerFolder||"all";
  const pickerSfw    = state.draftPickerSfw||"All";

  const pickerControls = div("",{display:"flex",gap:"6px",marginBottom:"10px",flexWrap:"wrap"});

  // Search input
  const pickerSearchInp = el("input",{class:"inp",placeholder:"Search filename...",style:{flex:1,minWidth:"140px"}});
  pickerSearchInp.value = pickerSearch;
  pickerSearchInp.addEventListener("input", e=>{ state.draftPickerSearch=e.target.value; render(); });
  pickerControls.appendChild(pickerSearchInp);

  // SFW/NSFW toggle
  ["All","SFW","NSFW"].forEach(opt=>{
    const active = pickerSfw===opt;
    const btn = el("button",{style:{padding:"5px 10px",borderRadius:"20px",border:"1px solid",borderColor:active?"#1c1c1e":"#e5e7eb",background:active?"#1c1c1e":"transparent",color:active?"#fff":"#6b7280",fontSize:"11px",cursor:"pointer",fontFamily:"monospace"}},opt);
    btn.addEventListener("click",()=>{ state.draftPickerSfw=opt; render(); });
    pickerControls.appendChild(btn);
  });

  // Folder filter dropdown
  const folderSel = el("select",{class:"sel",style:{width:"auto",fontSize:"11px",padding:"5px 8px"}});
  const allOpt = el("option",{value:"all"},"All Folders");
  folderSel.appendChild(allOpt);
  const sfwFilterId = pickerSfw==="SFW"?"sfw":pickerSfw==="NSFW"?"nsfw":null;

  // Build ordered folder list matching content library hierarchy
  function getOrderedFolders() {
    const result = [];
    function walk(parentId, depth) {
      const children = state.folders.filter(f=>f.parentId===parentId&&f.id!=="sfw"&&f.id!=="nsfw").sort((a,b)=>a.name.localeCompare(b.name));
      children.forEach(f=>{
        // Filter by SFW/NSFW if selected
        if (sfwFilterId) {
          // Check ancestry
          let cur = f;
          let underFilter = false;
          while (cur) {
            if (cur.parentId===sfwFilterId||cur.id===sfwFilterId) { underFilter=true; break; }
            cur = state.folders.find(x=>x.id===cur.parentId);
          }
          if (!underFilter) { walk(f.id, depth+1); return; }
        }
        result.push({folder:f, depth});
        walk(f.id, depth+1);
      });
    }
    // Walk SFW children first, then NSFW, then root folders
    if (!sfwFilterId || sfwFilterId==="sfw") walk("sfw", 0);
    if (!sfwFilterId || sfwFilterId==="nsfw") walk("nsfw", 0);
    // Root folders (no parent, not sfw/nsfw)
    if (!sfwFilterId) walk(null, 0);
    return result;
  }

  const folderOptionsFiltered = getOrderedFolders();
  folderOptionsFiltered.forEach(({folder, depth})=>{
    const folder_alias = folder;
    const label = "--".repeat(depth) + (depth>0?" ":"") + folder_alias.name;
    const opt = el("option",{value:folder_alias.id},label);
    if (folder_alias.id===pickerFolder) opt.selected=true;
    folderSel.appendChild(opt);
  });
  if (pickerFolder==="all") allOpt.selected=true;
  folderSel.addEventListener("change",e=>{ state.draftPickerFolder=e.target.value; render(); });
  pickerControls.appendChild(folderSel);

  contentCard.appendChild(pickerControls);

  // Filter content
  const getFolderIdsP = fid => { if(fid==="all") return null; const kids=state.folders.filter(x=>x.parentId===fid).map(x=>x.id); return [fid,...kids]; };
  const pickerFolderIds = getFolderIdsP(pickerFolder);
  const filteredContent = modelContent.filter(c=>{
    const searchOk = !pickerSearch || c.label.toLowerCase().includes(pickerSearch.toLowerCase());
    const sfwOk    = pickerSfw==="All" || c.sfwNsfw===pickerSfw;
    const folderOk = !pickerFolderIds || pickerFolderIds.includes(c.folderId);
    return searchOk&&sfwOk&&folderOk;
  });

  if (!modelContent.length) {
    contentCard.appendChild(renderEmptyState("No content","Upload content first.","",null));
  } else if (!filteredContent.length) {
    contentCard.appendChild(el("div",{style:{fontSize:"12px",color:"#9ca3af",padding:"12px 0",textAlign:"center"}},"No content matches your filters."));
  } else {
    // Scrollable list
    const pickerList = div("",{maxHeight:"320px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"5px"});
    filteredContent.forEach(c => {
      const isPicked = f.contentIds.includes(c.id);
      // Check if used in any draft on this platform (any status)
      const usedDrafts = state.drafts.filter(d =>
        d.platform===f.platform && (d.contentIds||[]).includes(c.id) && d.id!==(state.editingDraft?.id)
      );
      const isUsed = usedDrafts.length > 0;
      const usedStatus = isUsed ? getStatus(usedDrafts[0]) : null;
      const warnColors = {posted:{border:"#f59e0b",bg:"#fffbeb",text:"#b45309"},scheduled:{border:"#93c5fd",bg:"#eff6ff",text:"#1d4ed8"},missed:{border:"#fca5a5",bg:"#fef2f2",text:"#b91c1c"},draft:{border:"#d1d5db",bg:"#f9fafb",text:"#6b7280"}};
      const wc = isUsed ? (warnColors[usedStatus]||warnColors.draft) : null;
      const borderColor = isPicked ? "#1c1c1e" : isUsed ? wc.border : "#e5e7eb";
      const bgColor = isPicked ? "#f9f9f9" : isUsed ? wc.bg : "#fff";
      const row = div("",{display:"flex",alignItems:"center",gap:"8px",padding:"8px 10px",borderRadius:"8px",border:"1.5px solid "+borderColor,background:bgColor,cursor:"pointer",flexShrink:0});
      row.addEventListener("click", () => {
        state.draftFocusedContentId = c.id;
        if (isPicked) {
          state.draftForm.contentIds = f.contentIds.filter(x=>x!==c.id);
          render();
        } else if (isUsed) {
          const names = usedDrafts.map(d=>'"'+(d.name||d.scheduledAt?.slice(0,10))+'"').join(", ");
          const statusLabel = usedStatus || "draft";
          if (confirm("This content is already "+statusLabel+" as "+names+". Use it again?")) {
            state.draftForm.contentIds = [...f.contentIds, c.id];
            render();
          }
        } else {
          state.draftForm.contentIds = [...f.contentIds, c.id];
          render();
        }
      });
      const thumb = div("",{width:"36px",height:"36px",borderRadius:"6px",background:"#f3f4f6",flexShrink:0,overflow:"hidden",position:"relative",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:"#9ca3af"});
      if (c.driveId) {
        const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});
        img.onerror = ()=>{ img.style.display="none"; };
        setThumbSrc(img, c.driveId);
        thumb.appendChild(img);
      } else {
        thumb.appendChild(txt("img"));
      }
      row.appendChild(thumb);
      const info = div("",{flex:1,minWidth:0});
      info.appendChild(el("div",{style:{fontSize:"12px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},c.label));
      const pathLabel = folderPath(c.folderId);
      if (pathLabel) info.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace"}},pathLabel));
      if (isUsed) {
        const warnLabel = usedDrafts.map(d=>d.name||d.scheduledAt?.slice(0,10)).join(", ");
        info.appendChild(el("div",{style:{fontSize:"10px",color:wc.text,fontFamily:"monospace",marginTop:"1px"}},"⚠ "+usedStatus+" — "+warnLabel));
      }
      row.appendChild(info);
      if (isPicked) row.appendChild(el("span",{style:{fontSize:"14px",color:"#1c1c1e",flexShrink:0}},"✓"));
      pickerList.appendChild(row);
    });
    contentCard.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",marginBottom:"6px",fontFamily:"monospace"}},filteredContent.length+" shown - "+f.contentIds.length+" selected"));
    contentCard.appendChild(pickerList);
  }
  formArea.appendChild(contentCard);

  // Overlays
  if (f.contentIds.length) {
    const overlayCard = div("card",{marginBottom:"12px"});
    overlayCard.appendChild(el("span",{class:"lbl"},"ORDER & OVERLAYS - drag to reorder"));
    f.contentIds.forEach((id,idx) => {
      const c = state.content.find(x=>x.id===id);
      const row = div("",{display:"flex",alignItems:"flex-start",gap:"8px",padding:"8px 10px",borderRadius:"8px",background:"#f9f9f9",marginBottom:"6px",border:"1px solid #f0f0f0",cursor:"grab"});
      row.draggable = true;
      row.dataset.idx = idx;
      row.addEventListener("dragstart",e=>{ e.dataTransfer.setData("slideIdx",idx); e.dataTransfer.effectAllowed="move"; row.style.opacity="0.5"; });
      row.addEventListener("dragend",()=>{ row.style.opacity="1"; });
      row.addEventListener("dragover",e=>{ e.preventDefault(); row.style.background="#eff6ff"; });
      row.addEventListener("dragleave",()=>{ row.style.background="#f9f9f9"; });
      row.addEventListener("drop",e=>{
        e.preventDefault();
        row.style.background="#f9f9f9";
        const fromIdx = parseInt(e.dataTransfer.getData("slideIdx"));
        const toIdx = idx;
        if (fromIdx===toIdx) return;
        const newIds = [...f.contentIds];
        const [moved] = newIds.splice(fromIdx,1);
        newIds.splice(toIdx,0,moved);
        state.draftForm.contentIds = newIds;
        render();
      });
      row.addEventListener("click", e => {
        if (e.target.tagName==="BUTTON"||e.target.tagName==="INPUT") return;
        state.draftFocusedContentId = id;
        render();
      });
      row.appendChild(el("span",{style:{fontSize:"12px",color:"#9ca3af",marginTop:"4px",flexShrink:0,userSelect:"none"}},"⠿"));
      const thumb2 = div("",{width:"26px",height:"26px",borderRadius:"6px",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",color:"#9ca3af",flexShrink:0,border:"1px solid #f0f0f0"});
      thumb2.appendChild(txt(c?.type[0]||""));
      row.appendChild(thumb2);
      const infoWrap = div("",{flex:1,minWidth:0});
      infoWrap.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,marginBottom:"4px",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},"Slide "+(idx+1)+" - "+(c?.label||"")));
      const ovInp = el("input",{class:"inp",placeholder:"Text overlay...",style:{fontSize:"11px"},value:f.overlays[id]||""});
      ovInp.addEventListener("input", e=>{ state.draftForm.overlays[id]=e.target.value; });
      infoWrap.appendChild(ovInp);
      row.appendChild(infoWrap);
      const remBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",color:"#9ca3af",fontSize:"14px",marginTop:"2px"}},"x");
      remBtn.addEventListener("click", () => { state.draftForm.contentIds=f.contentIds.filter(x=>x!==id); render(); });
      row.appendChild(remBtn);
      overlayCard.appendChild(row);
    });
    formArea.appendChild(overlayCard);
  }

  // Caption/hashtags
  const captionCard = div("card",{marginBottom:"12px"});
  captionCard.appendChild(el("span",{class:"lbl"},"CAPTION"));
  const capTA = el("textarea",{class:"inp",rows:3,placeholder:"Write your caption..."});
  capTA.value = f.caption;
  capTA.addEventListener("input", e=>{ state.draftForm.caption=e.target.value; });
  captionCard.appendChild(capTA);
  captionCard.appendChild(el("span",{class:"lbl",style:{marginTop:"10px"}},"HASHTAGS"));
  const hashInp = el("input",{class:"inp",placeholder:"#fyp #pickleball",value:f.hashtags});
  hashInp.addEventListener("input", e=>{ state.draftForm.hashtags=e.target.value; });
  captionCard.appendChild(hashInp);
  formArea.appendChild(captionCard);

  // Save buttons
  const btnRow = div("",{display:"flex",gap:"8px",marginBottom:"20px"});
  const saveBtn = renderBtn(isEdit?"Save Changes":"Save Draft", true, () => {
    const draft = {
      id:state.editingDraft?.id||"d"+Date.now(), name:f.name||autoName(f.platform,f.accountId,f.type,f.scheduledAt,1),
      accountId:f.accountId, platform:f.platform, type:f.type,
      contentIds:[...f.contentIds], overlays:f.contentIds.map(id=>f.overlays[id]||""),
      caption:f.caption, hashtags:f.hashtags, scheduledAt:f.scheduledAt, status:f.status, postOrder:1,
      metrics: state.editingDraft?.metrics||{views:0,likes:0,comments:0},
      lastMetricsUpdated: f.status==="posted" ? (state.editingDraft?.lastMetricsUpdated||new Date().toISOString()) : (state.editingDraft?.lastMetricsUpdated||null)
    };
    const newDrafts = isEdit ? state.drafts.map(d=>d.id===draft.id?draft:d) : [...state.drafts,draft];
    // Update content.posts based on posted status
    let newContent = state.content;
    if (f.status==="posted") {
      newContent = state.content.map(c=>{
        if (!draft.contentIds.includes(c.id)) return c;
        const alreadyPosted = (c.posts||[]).some(p=>p.accountId===draft.accountId&&p.date===draft.scheduledAt?.slice(0,10));
        if (alreadyPosted) return c;
        return {...c, posts:[...(c.posts||[]),{accountId:draft.accountId,date:draft.scheduledAt?.slice(0,10)||"",postName:draft.name||"",views:0,likes:0,comments:0}]};
      });
    } else if (isEdit && state.editingDraft?.status==="posted") {
      // Was posted, now being changed — remove from content.posts
      newContent = state.content.map(c=>{
        if (!draft.contentIds.includes(c.id)) return c;
        return {...c, posts:(c.posts||[]).filter(p=>p.accountId!==draft.accountId||p.date!==state.editingDraft.scheduledAt?.slice(0,10))};
      });
    }
    setState({drafts:newDrafts, content:newContent, editingDraft:null, draftForm:{platform:"Instagram",accountId:"",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"}, draftNameOverridden:false});
    if (isAuthenticated()) saveToSheets();
  }, {flex:1,justifyContent:"center"});
  const clearBtn = renderBtn(isEdit?"Cancel":"Clear", false, () => {
    setState({editingDraft:null, draftForm:{platform:"Instagram",accountId:"ig-main",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"}, draftNameOverridden:false});
  }, {flex:1,justifyContent:"center"});
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(clearBtn);
  formArea.appendChild(btnRow);
  wrap.appendChild(formArea);

  // Preview
  const preview = div("",{width:"220px",background:"#fff",borderLeft:"1px solid #f0f0f0",overflowY:"auto",padding:"14px",flexShrink:0});
  preview.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,marginBottom:"12px",color:"#6b7280",fontFamily:"monospace",letterSpacing:"0.06em"}},"PREVIEW"));
  const prevCard = div("",{background:"#f9f9f9",borderRadius:"10px",padding:"12px",marginBottom:"10px"});
  const accInfo = state.accounts.find(a=>a.id===f.accountId);
  const accRow = div("",{display:"flex",alignItems:"center",gap:"7px",marginBottom:"10px"});
  accRow.appendChild(el("div",{style:{width:"24px",height:"24px",borderRadius:"50%",background:f.platform==="Instagram"?"#E1306C":"#444",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:"#fff"}},f.platform==="Instagram"?"IG":"TT"));
  const accInfoDiv = div("",{});
  accInfoDiv.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500}},accInfo?.handle||""));
  accInfoDiv.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace"}},accInfo?.sub||""));
  accRow.appendChild(accInfoDiv);
  prevCard.appendChild(accRow);
  if (f.contentIds.length) {
    f.contentIds.forEach((id,idx) => {
      const c = state.content.find(x=>x.id===id);
      const slide = div("",{background:"#fff",borderRadius:"8px",padding:"7px 9px",border:"1px solid #f0f0f0",marginBottom:"5px"});
      slide.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginBottom:f.overlays[id]?"4px":"0"}},"Slide "+(idx+1)));
      if (f.overlays[id]) slide.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,background:"rgba(0,0,0,0.06)",borderRadius:"4px",padding:"2px 6px"}},f.overlays[id]));
      prevCard.appendChild(slide);
    });
  } else {
    const empty = div("",{background:"#f0f0f0",borderRadius:"8px",height:"70px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",color:"#9ca3af",marginBottom:"10px"});
    empty.appendChild(txt("No content"));
    prevCard.appendChild(empty);
  }
  if (f.caption) prevCard.appendChild(el("div",{style:{fontSize:"11px",color:"#1a1a1a",marginBottom:"4px",lineHeight:1.4}},f.caption));
  if (f.hashtags) prevCard.appendChild(el("div",{style:{fontSize:"10px",color:"#3b82f6",fontFamily:"monospace"}},f.hashtags));
  preview.appendChild(prevCard);
  preview.appendChild(renderBadge(f.status));
  if (f.scheduledAt) preview.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginTop:"5px"}},f.scheduledAt.replace("T"," ")));
  if (f.name) {
    const nameTag = el("div",{style:{fontSize:"9px",color:"#c4b5fd",fontFamily:"monospace",marginTop:"4px",wordBreak:"break-all",background:"#1c1c1e",borderRadius:"6px",padding:"4px 7px"}},f.name);
    preview.appendChild(nameTag);
  }
  wrap.appendChild(preview);

  // Content detail panel — shown when a content item is focused
  const focusedC = state.draftFocusedContentId ? state.content.find(x=>x.id===state.draftFocusedContentId) : null;
  if (focusedC) {
    const detail = div("",{flex:1,borderLeft:"1px solid #f0f0f0",overflowY:"auto",padding:"16px",minWidth:0,background:"#fafafa"});
    const detHeader = div("",{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px"});
    detHeader.appendChild(el("span",{style:{fontSize:"10px",fontWeight:500,color:"#6b7280",fontFamily:"monospace",letterSpacing:"0.06em"}},"CONTENT DETAIL"));
    const closeDetBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",color:"#9ca3af",fontSize:"16px",lineHeight:1,padding:"0"}},"×");
    closeDetBtn.addEventListener("click",()=>{ state.draftFocusedContentId=null; render(); });
    detHeader.appendChild(closeDetBtn);
    detail.appendChild(detHeader);

    // Thumbnail
    const thumbBox = div("",{width:"100%",aspectRatio:"1",borderRadius:"10px",background:"#e5e7eb",overflow:"hidden",marginBottom:"12px",position:"relative",display:"flex",alignItems:"center",justifyContent:"center"});
    if (focusedC.driveId) {
      const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});
      img.onerror=()=>{img.style.display="none";};
      setThumbSrc(img,focusedC.driveId);
      thumbBox.appendChild(img);
    } else {
      thumbBox.appendChild(el("span",{style:{fontSize:"12px",color:"#9ca3af"}},"No preview"));
    }
    detail.appendChild(thumbBox);

    // Name
    detail.appendChild(el("div",{style:{fontSize:"13px",fontWeight:600,marginBottom:"4px",wordBreak:"break-all"}},focusedC.label));
    // Path
    const fp = folderPath(focusedC.folderId);
    if (fp) detail.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginBottom:"8px"}},fp));

    // SFW/NSFW badge
    const badge = el("span",{style:{fontSize:"10px",padding:"2px 8px",borderRadius:"20px",background:focusedC.sfwNsfw==="SFW"?"#d1fae5":"#fee2e2",color:focusedC.sfwNsfw==="SFW"?"#065f46":"#991b1b",fontFamily:"monospace",display:"inline-block",marginBottom:"10px"}},focusedC.sfwNsfw||"");
    detail.appendChild(badge);

    // Platform status pills
    if (state.platforms.length) {
      const pillsBox = div("",{display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"10px"});
      state.platforms.forEach(plat=>{
        const ps = getContentStatusForPlatform(focusedC.id, plat.name);
        const colors = {posted:{bg:"#d1fae5",text:"#065f46"},scheduled:{bg:"#dbeafe",text:"#1d4ed8"},missed:{bg:"#fee2e2",text:"#991b1b"},draft:{bg:"#f3f4f6",text:"#374151"}};
        const col = ps ? (colors[ps]||colors.draft) : {bg:"#f3f4f6",text:"#9ca3af"};
        const pill = el("span",{style:{fontSize:"10px",padding:"2px 8px",borderRadius:"20px",background:col.bg,color:col.text,fontFamily:"monospace",border:"1px solid transparent"}},plat.name+(ps?" · "+ps:" · avail"));
        pillsBox.appendChild(pill);
      });
      detail.appendChild(pillsBox);
    }

    wrap.appendChild(detail);
  }

  return wrap;
}

function updateDraftName() {
  if (state.draftNameOverridden) return;
  if (!state.accounts.length || !state.draftForm.accountId) return;
  const f = state.draftForm;
  const order = state.drafts.filter(d=>d.accountId===f.accountId&&d.scheduledAt?.slice(0,10)===f.scheduledAt?.slice(0,10)).length + (state.editingDraft?0:1);
  const newName = autoName(f.platform,f.accountId,f.type,f.scheduledAt,order);
  if (newName) state.draftForm.name = newName;
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function renderCalendar() {
  const wrap = div("",{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden"});

  const vDate = new Date(NOW.getFullYear(), NOW.getMonth()+state.calendarMonthOffset, 1);
  const mName = vDate.toLocaleString("default",{month:"long",year:"numeric"});
  const dim   = new Date(vDate.getFullYear(),vDate.getMonth()+1,0).getDate();
  const firstD= (new Date(vDate.getFullYear(),vDate.getMonth(),1).getDay()+6)%7;

  const cf = state.calendarFilters;
  const filtered = state.drafts.filter(d => {
    return (cf.platforms.length===0||cf.platforms.includes(d.platform)) &&
           (cf.accounts.length===0||cf.accounts.includes(d.accountId)) &&
           (cf.types.length===0||cf.types.includes(d.type));
  });

  const postsForDay = day => filtered.filter(d => {
    const dd = new Date(d.scheduledAt);
    return dd.getFullYear()===vDate.getFullYear()&&dd.getMonth()===vDate.getMonth()&&dd.getDate()===day;
  }).sort((a,b)=>new Date(a.scheduledAt)-new Date(b.scheduledAt));

  // Toolbar
  const toolbar = div("",{padding:"10px 16px",background:"#fff",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:"8px",flexShrink:0,flexWrap:"wrap"});
  const prevBtn = renderBtn("<", false, () => setState({calendarMonthOffset:state.calendarMonthOffset-1}), {padding:"5px 10px"});
  toolbar.appendChild(prevBtn);
  toolbar.appendChild(el("span",{style:{fontSize:"13px",fontWeight:500,minWidth:"130px",textAlign:"center"}},mName));
  const nextBtn = renderBtn(">", false, () => setState({calendarMonthOffset:state.calendarMonthOffset+1}), {padding:"5px 10px"});
  toolbar.appendChild(nextBtn);
  toolbar.appendChild(el("div",{style:{width:"1px",background:"#e5e7eb",height:"20px",margin:"0 4px"}}));
  toolbar.appendChild(renderMultiSelect("Platform", state.platforms.map(p=>({id:p.name,label:p.name,color:p.color})), cf.platforms, v=>setState({calendarFilters:{...cf,platforms:v}})));
  toolbar.appendChild(renderMultiSelect("Account", state.accounts.map(a=>({id:a.id,label:a.sub,color:a.color})), cf.accounts, v=>setState({calendarFilters:{...cf,accounts:v}})));
  toolbar.appendChild(renderMultiSelect("Type", state.postTypes.map(t=>({id:t.id,label:t.name})), cf.types, v=>setState({calendarFilters:{...cf,types:v}})));

  const legend = div("",{marginLeft:"auto",display:"flex",gap:"8px",fontSize:"10px"});
  Object.entries(SC).forEach(([s,c])=>{ const item=div("",{display:"flex",alignItems:"center",gap:"3px",color:"#6b7280"}); item.appendChild(el("span",{class:"dot",style:{width:"7px",height:"7px",background:c}})); item.appendChild(txt(s)); legend.appendChild(item); });
  toolbar.appendChild(legend);
  wrap.appendChild(toolbar);

  // Day headers
  const dayHeaders = div("",{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"4px",padding:"8px 16px 0",flexShrink:0});
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d => dayHeaders.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",textAlign:"center",paddingBottom:"4px"}},d)));
  wrap.appendChild(dayHeaders);

  // Grid
  const calArea = div("content-area",{paddingTop:"0"});
  const grid = div("",{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"4px"});

  for (let i=0;i<firstD;i++) grid.appendChild(div("",{minHeight:"90px"}));

  for (let day=1;day<=dim;day++) {
    const posts = postsForDay(day);
    const isTod = day===NOW.getDate()&&vDate.getMonth()===NOW.getMonth()&&vDate.getFullYear()===NOW.getFullYear();
    const cell = div("",{background:"#fff",border:isTod?"1.5px solid #1c1c1e":"1px solid #f0f0f0",borderRadius:"10px",padding:"6px",minHeight:"90px"});

    cell.appendChild(el("div",{style:{fontSize:"10px",color:isTod?"#1c1c1e":"#9ca3af",fontFamily:"monospace",fontWeight:isTod?"600":"400",marginBottom:"4px"}},day+(isTod?" today":"")));

    posts.forEach((d,pi) => {
      const st  = getStatus(d);
      const acc = state.accounts.find(a=>a.id===d.accountId);
      const postEl = div("sc-"+st,{background:SBG[st],borderRadius:"4px",padding:"3px 5px",marginBottom:"3px",cursor:"pointer"});
      postEl.draggable = true;
      postEl.addEventListener("dragstart",e=>{ e.dataTransfer.setData("draftId",d.id); e.dataTransfer.effectAllowed="move"; });
      const postRow = div("",{display:"flex",alignItems:"center",gap:"3px",marginBottom:"1px"});
      postRow.appendChild(el("span",{class:"dot",style:{width:"5px",height:"5px",background:acc?.color||"#888"}}));
      postRow.appendChild(el("span",{style:{fontSize:"9px",color:STX[st],fontFamily:"monospace",fontWeight:500}},"#"+(pi+1)+" "+d.type));
      // Auto-title button
      const autoTitleBtn = el("span",{style:{fontSize:"8px",color:STX[st],cursor:"pointer",marginLeft:"2px",opacity:0.7,fontFamily:"monospace"}},"↺");
      autoTitleBtn.title = "Regenerate title";
      autoTitleBtn.addEventListener("click",e=>{
        e.stopPropagation();
        const order = state.drafts.filter(x=>x.accountId===d.accountId&&x.scheduledAt?.slice(0,10)===d.scheduledAt?.slice(0,10)).indexOf(d)+1;
        const newName = autoName(d.platform,d.accountId,d.type,d.scheduledAt,order);
        setState({drafts:state.drafts.map(x=>x.id===d.id?{...x,name:newName}:x)});
        if (isAuthenticated()) saveToSheets();
      });
      postRow.appendChild(autoTitleBtn);
      postEl.appendChild(postRow);
      postEl.appendChild(el("div",{style:{fontSize:"9px",color:"#6b7280",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},acc?.sub||""));
      postEl.addEventListener("click", () => setState({showDraftModal:d}));
      cell.appendChild(postEl);
    });

    cell.addEventListener("dragover", e=>e.preventDefault());
    cell.addEventListener("drop", e=>{
      e.preventDefault();
      const draftId = e.dataTransfer.getData("draftId");
      if (!draftId) return;
      const nd = vDate.getFullYear()+"-"+String(vDate.getMonth()+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      const draft = state.drafts.find(x=>x.id===draftId);
      if (!draft) return;
      const ot = draft.scheduledAt?.slice(11)||"08:00";
      const ns = nd+"T"+ot;
      const newSt = draft.status==="posted"?"posted":(new Date(ns)>NOW?"scheduled":"missed");
      // Update date in name - replace 8-digit date pattern at end
      const oldDate = draft.scheduledAt?.slice(0,10)?.replace(/-/g,"")||"";
      const newDate = nd.replace(/-/g,"");
      const newName = draft.name?.includes(oldDate) ? draft.name.replace(oldDate, newDate) : draft.name;
      setState({drafts:state.drafts.map(x=>x.id===draftId?{...x,scheduledAt:ns,status:newSt,name:newName}:x)});
      if (isAuthenticated()) saveToSheets();
    });

    grid.appendChild(cell);
  }
  calArea.appendChild(grid);
  wrap.appendChild(calArea);

  // Draft modal
  if (state.showDraftModal) {
    const d   = state.showDraftModal;
    const st  = getStatus(d);
    const acc = state.accounts.find(a=>a.id===d.accountId);
    const con = (d.contentIds||[]).map(id=>state.content.find(c=>c.id===id)).filter(Boolean);
    const past= isPast(d.scheduledAt);

    const overlay = div("overlay",{});
    overlay.addEventListener("click", () => setState({showDraftModal:null}));
    const modal = div("modal",{width:"380px",maxHeight:"85vh",overflowY:"auto"});
    modal.addEventListener("click", e=>e.stopPropagation());

    const mHeader = div("",{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"});
    mHeader.appendChild(el("span",{style:{fontSize:"14px",fontWeight:600}},d.type+" - "+(acc?.sub||"")));
    const mClose = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"18px",color:"#9ca3af"}},"x");
    mClose.addEventListener("click", () => setState({showDraftModal:null}));
    mHeader.appendChild(mClose);
    modal.appendChild(mHeader);

    // Status buttons
    const statusSection = div("",{marginBottom:"14px"});
    statusSection.appendChild(el("div",{class:"lbl"},"STATUS"));
    const statusBtns = div("",{display:"flex",gap:"6px",flexWrap:"wrap"});
    const statusOptions = past ? ["posted","missed"] : ["draft","scheduled","posted"];
    statusOptions.forEach(s => {
      const isActive = st===s;
      const sBtn = el("button",{style:{padding:"5px 14px",borderRadius:"20px",border:"1.5px solid",borderColor:isActive?SC[s]:"#e5e7eb",background:isActive?SBG[s]:"transparent",color:isActive?STX[s]:"#9ca3af",fontSize:"11px",fontWeight:isActive?"600":"400",cursor:"pointer",fontFamily:"monospace"}},s);
      sBtn.addEventListener("click", () => {
        let updatedContent = state.content;
        if (s === "posted") {
          updatedContent = state.content.map(c => {
            if (!(d.contentIds||[]).includes(c.id)) return c;
            const alreadyPosted = (c.posts||[]).some(p=>p.accountId===d.accountId&&p.date===d.scheduledAt?.slice(0,10));
            if (alreadyPosted) return c;
            return {...c, posts:[...(c.posts||[]),{accountId:d.accountId,date:d.scheduledAt?.slice(0,10)||"",postName:d.name||"",views:0,likes:0,comments:0}]};
          });
        } else {
          updatedContent = state.content.map(c => {
            if (!(d.contentIds||[]).includes(c.id)) return c;
            return {...c, posts:(c.posts||[]).filter(p=>p.accountId!==d.accountId||p.date!==d.scheduledAt?.slice(0,10))};
          });
        }
        setState({drafts:state.drafts.map(x=>x.id===d.id?{...x,status:s}:x), content:updatedContent, showDraftModal:{...d,status:s}});
        if (isAuthenticated()) saveToSheets();
      });
      statusBtns.appendChild(sBtn);
    });
    statusSection.appendChild(statusBtns);
    modal.appendChild(statusSection);

    // Date/time
    const dtSection = div("",{marginBottom:"14px"});
    dtSection.appendChild(el("span",{class:"lbl"},"DATE AND TIME"));
    const dtInp = el("input",{type:"datetime-local",class:"inp",value:d.scheduledAt});
    dtInp.addEventListener("blur", e=>{
      const ns = e.target.value;
      if (!ns) return;
      const newSt = d.status==="posted"?"posted":(new Date(ns)>NOW?"scheduled":"missed");
      setState({drafts:state.drafts.map(x=>x.id===d.id?{...x,scheduledAt:ns,status:newSt}:x), showDraftModal:{...d,scheduledAt:ns,status:newSt}});
    });
    dtSection.appendChild(dtInp);
    modal.appendChild(dtSection);

    // Content
    modal.appendChild(el("div",{class:"section-title"},"CONTENT"));
    con.forEach((c,i) => {
      const cRow = div("",{display:"flex",alignItems:"center",gap:"8px",background:"#f9f9f9",borderRadius:"8px",padding:"7px 10px",marginBottom:"5px",cursor:c.driveUrl?"pointer":"default"});
      // Thumbnail
      const thumb = div("",{width:"40px",height:"40px",borderRadius:"6px",background:"#f3f4f6",flexShrink:0,overflow:"hidden",position:"relative"});
      if (c.driveId) {
        const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});
        img.onerror = ()=>{ img.style.display="none"; };
        setThumbSrc(img, c.driveId);
        thumb.appendChild(img);
      }
      cRow.appendChild(thumb);
      const cInfo = div("",{flex:1,minWidth:0});
      cInfo.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},c.label));
      const ov = Array.isArray(d.overlays) ? d.overlays[i] : d.overlays?.[c.id];
      if (ov) cInfo.appendChild(el("div",{style:{fontSize:"10px",color:"#6b7280",fontFamily:"monospace",marginTop:"2px"}},'"'+ov+'"'));
      cRow.appendChild(cInfo);
      if (c.driveUrl) {
        const dlLink = el("a",{style:{fontSize:"11px",color:"#3b82f6",flexShrink:0,textDecoration:"none",padding:"4px 8px",border:"1px solid #bfdbfe",borderRadius:"6px",whiteSpace:"nowrap"}},"Open");
        dlLink.href = c.driveUrl;
        dlLink.target = "_blank";
        cRow.appendChild(dlLink);
      }
      modal.appendChild(cRow);
    });

    if (d.caption) { modal.appendChild(el("div",{class:"section-title",style:{marginTop:"12px"}},"CAPTION")); modal.appendChild(el("div",{style:{fontSize:"12px",color:"#374151",lineHeight:1.4,marginBottom:"6px"}},d.caption)); }
    if (d.hashtags) modal.appendChild(el("div",{style:{fontSize:"11px",color:"#3b82f6",fontFamily:"monospace",marginBottom:"12px"}},d.hashtags));

    const mBtns = div("",{display:"flex",gap:"8px",marginTop:"16px",flexWrap:"wrap"});
    const delDraftBtn = renderBtn("Delete", false, ()=>{
      if (!confirm("Delete this post?")) return;
      setState({drafts:state.drafts.filter(x=>x.id!==d.id),showDraftModal:null});
      if (isAuthenticated()) saveToSheets();
    }, {color:"#ef4444",borderColor:"#fecaca",fontSize:"11px"});
    mBtns.appendChild(delDraftBtn);
    const editBtn = renderBtn("Edit Post", false, () => {
      const overlaysObj = {};
      (d.contentIds||[]).forEach((id,i)=>{ overlaysObj[id]=d.overlays[i]||""; });
      setState({editingDraft:d, draftForm:{platform:d.platform,accountId:d.accountId,type:d.type,contentIds:[...d.contentIds],overlays:overlaysObj,caption:d.caption,hashtags:d.hashtags,scheduledAt:d.scheduledAt,name:d.name,status:d.status}, draftNameOverridden:true, tab:"draft", showDraftModal:null});
    }, {flex:1,justifyContent:"center",fontSize:"11px"});
    const doneBtn = renderBtn("Done", true, () => setState({showDraftModal:null}), {flex:1,justifyContent:"center",fontSize:"11px"});
    mBtns.appendChild(editBtn);
    mBtns.appendChild(doneBtn);
    modal.appendChild(mBtns);
    overlay.appendChild(modal);
    wrap.appendChild(overlay);
  }

  return wrap;
}

// ── METRICS ───────────────────────────────────────────────────────────────────
function openMetricsLightbox(contentItems, startIdx, draft) {
  let cur = startIdx;
  const overlays = draft?.overlays || [];

  const overlay = div("overlay",{zIndex:2000,background:"rgba(0,0,0,0.88)"});
  document.body.appendChild(overlay);

  const box = div("",{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",zIndex:2001,background:"#1c1c1e",borderRadius:"14px",padding:"20px",width:"min(92vw,680px)",height:"92vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 60px rgba(0,0,0,0.7)"});
  box.addEventListener("click",e=>e.stopPropagation());
  document.body.appendChild(box);

  function close() { document.removeEventListener("keydown", onKey); overlay.remove(); box.remove(); }
  overlay.addEventListener("click", close);

  // Close button
  const closeBtn = el("button",{style:{position:"absolute",top:"10px",right:"14px",border:"none",background:"transparent",color:"#9ca3af",fontSize:"22px",cursor:"pointer",lineHeight:1,zIndex:1}},"×");
  closeBtn.addEventListener("click", close);
  box.appendChild(closeBtn);

  // Counter
  const counter = el("div",{style:{fontSize:"11px",color:"#6b7280",fontFamily:"monospace",textAlign:"center",marginBottom:"10px"}});
  box.appendChild(counter);

  // Image area
  const imgWrap = div("",{flex:1,minHeight:0,borderRadius:"10px",background:"#2c2c2e",overflow:"hidden",position:"relative",marginBottom:"10px"});
  const imgEl = el("img",{style:{position:"absolute",top:0,left:0,width:"100%",height:"100%",objectFit:"contain"}});
  imgWrap.appendChild(imgEl);
  box.appendChild(imgWrap);

  // Overlay text
  const ovText = el("div",{style:{fontSize:"12px",color:"#e8e6e0",fontFamily:"monospace",textAlign:"center",minHeight:"18px",marginBottom:"10px"}});
  box.appendChild(ovText);

  // Nav row
  const navRow = div("",{display:"flex",gap:"10px",justifyContent:"center"});
  const prevBtn = renderBtn("← Prev", false, ()=>{ cur=(cur-1+contentItems.length)%contentItems.length; show(); }, {fontSize:"12px"});
  const nextBtn = renderBtn("Next →", false, ()=>{ cur=(cur+1)%contentItems.length; show(); }, {fontSize:"12px"});
  navRow.appendChild(prevBtn);
  navRow.appendChild(nextBtn);
  box.appendChild(navRow);

  // Keyboard nav
  function onKey(e) { if(e.key==="ArrowLeft"){cur=(cur-1+contentItems.length)%contentItems.length;show();}else if(e.key==="ArrowRight"){cur=(cur+1)%contentItems.length;show();}else if(e.key==="Escape"){close();} }
  document.addEventListener("keydown", onKey);

  function show() {
    const c = contentItems[cur];
    counter.textContent = "Slide "+(cur+1)+" of "+contentItems.length;
    prevBtn.disabled = contentItems.length <= 1;
    nextBtn.disabled = contentItems.length <= 1;
    imgEl.src = "";
    if (c?.driveId) {
      if (thumbCache[c.driveId]) { imgEl.src = thumbCache[c.driveId]; }
      else { setThumbSrc(imgEl, c.driveId); }
    }
    ovText.textContent = overlays[cur] || "";
  }
  show();
}

function renderDashboard() {
  const df = state.dashboardFilters;
  const isAllModels = state.model === "all";

  // All posted drafts
  const allPostedDrafts = state.drafts.filter(d => getStatus(d) === "posted");
  const modelDrafts = isAllModels ? allPostedDrafts : allPostedDrafts.filter(d => {
    const acc = state.accounts.find(a => a.id === d.accountId);
    return acc?.modelId === state.model;
  });

  // Apply dashboard filters
  function applyFilters(drafts) {
    return drafts.filter(d => {
      const acc = state.accounts.find(a => a.id === d.accountId);
      const date = d.scheduledAt || "";
      const year = date.slice(0,4);
      const month = date.slice(5,7);
      if (df.platforms.length && !df.platforms.includes(d.platform)) return false;
      if (df.accounts.length && !df.accounts.includes(d.accountId)) return false;
      if (df.types.length && !df.types.includes(d.type)) return false;
      if (df.years.length && !df.years.includes(year)) return false;
      if (df.months.length && !df.months.includes(month)) return false;
      return true;
    });
  }

  const filtered = applyFilters(modelDrafts);

  // Aggregate metrics
  const totalViews    = filtered.reduce((s,d) => s + (parseInt(d.metrics?.views)||0), 0);
  const totalLikes    = filtered.reduce((s,d) => s + (parseInt(d.metrics?.likes)||0), 0);
  const totalComments = filtered.reduce((s,d) => s + (parseInt(d.metrics?.comments)||0), 0);
  const totalPosts    = filtered.length;
  const avgER = totalViews > 0 ? ((totalLikes + totalComments) / totalViews * 100).toFixed(2) + "%" : "--";

  const modelAccounts = isAllModels
    ? state.accounts.filter(a => a.status === "active")
    : state.accounts.filter(a => a.status === "active" && a.modelId === state.model);
  const totalFollowers = modelAccounts.reduce((s,a) => s + (parseInt(a.followers)||0), 0);
  const totalAccounts  = modelAccounts.length;

  // Available years/months from data
  const availYears  = [...new Set(modelDrafts.map(d => (d.scheduledAt||"").slice(0,4)).filter(Boolean))].sort().reverse();
  const availMonths = [...new Set(modelDrafts.map(d => (d.scheduledAt||"").slice(5,7)).filter(Boolean))].sort();
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const wrap = div("", {height:"100%", display:"flex", flexDirection:"column", overflow:"hidden"});

  // ── FILTERS BAR ──
  const toolbar = div("", {padding:"10px 16px", background:"#fff", borderBottom:"1px solid #f0f0f0", display:"flex", alignItems:"center", gap:"8px", flexShrink:0, flexWrap:"wrap"});
  toolbar.appendChild(renderMultiSelect("Platform", state.platforms.map(p=>({id:p.name,label:p.name,color:p.color})), df.platforms, v=>setState({dashboardFilters:{...df,platforms:v}})));

  const accMulti = renderMultiSelect("Account", state.accounts.filter(a=>a.status==="active").map(a=>({id:a.id,label:(a.sub||a.handle)})), df.accounts, v=>setState({dashboardFilters:{...df,accounts:v}}));
  if (isAllModels) { accMulti.style.opacity="0.4"; accMulti.style.pointerEvents="none"; accMulti.title="Select a specific model to filter by account"; }
  toolbar.appendChild(accMulti);

  toolbar.appendChild(renderMultiSelect("Type", state.postTypes.map(t=>({id:t.id,label:t.name})), df.types, v=>setState({dashboardFilters:{...df,types:v}})));
  toolbar.appendChild(renderMultiSelect("Year", availYears.map(y=>({id:y,label:y})), df.years, v=>setState({dashboardFilters:{...df,years:v}})));
  toolbar.appendChild(renderMultiSelect("Month", availMonths.map(m=>({id:m,label:MONTH_NAMES[parseInt(m)-1]||m})), df.months, v=>setState({dashboardFilters:{...df,months:v}})));

  if (df.platforms.length||df.accounts.length||df.types.length||df.years.length||df.months.length) {
    const clearBtn = renderBtn("Clear Filters", false, ()=>setState({dashboardFilters:{platforms:[],accounts:[],types:[],years:[],months:[]}}), {fontSize:"11px",marginLeft:"auto"});
    toolbar.appendChild(clearBtn);
  }
  wrap.appendChild(toolbar);

  // ── SCROLLABLE BODY ──
  const body = div("content-area", {});
  wrap.appendChild(body);

  // ── TIER 1: METRIC PILLS ──
  const pillsRow = div("", {display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"10px", marginBottom:"20px"});
  [
    ["Total Followers", fmt(totalFollowers)],
    ["Total Accounts",  totalAccounts],
    ["Total Posts",     totalPosts],
    ["Total Views",     fmt(totalViews)],
    ["Total Likes",     fmt(totalLikes)],
    ["Total Comments",  fmt(totalComments)],
    ["Avg ER",          avgER],
  ].forEach(([label, val]) => {
    const pill = div("card", {padding:"12px 14px", textAlign:"center"});
    pill.appendChild(el("div", {style:{fontSize:"20px", fontWeight:600, fontFamily:"monospace", marginBottom:"3px"}}, String(val)));
    pill.appendChild(el("div", {style:{fontSize:"10px", color:"#9ca3af"}}, label));
    pillsRow.appendChild(pill);
  });
  body.appendChild(pillsRow);

  // ── TIER 1: CHARTS ──
  // Build time-series data bucketed by month
  function buildTimeSeries(drafts) {
    const buckets = {};
    drafts.forEach(d => {
      const key = (d.scheduledAt||"").slice(0,7); // "YYYY-MM"
      if (!key || key.length < 7) return;
      if (!buckets[key]) buckets[key] = {views:0,likes:0,comments:0,count:0};
      buckets[key].views    += parseInt(d.metrics?.views)||0;
      buckets[key].likes    += parseInt(d.metrics?.likes)||0;
      buckets[key].comments += parseInt(d.metrics?.comments)||0;
      buckets[key].count    += 1;
    });
    const keys = Object.keys(buckets).sort();
    return {
      labels: keys.map(k => { const [y,m]=k.split("-"); return (MONTH_NAMES[parseInt(m)-1]||m)+" "+y; }),
      views:    keys.map(k => buckets[k].views),
      likes:    keys.map(k => buckets[k].likes),
      comments: keys.map(k => buckets[k].comments),
      counts:   keys.map(k => buckets[k].count),
      er:       keys.map(k => buckets[k].views > 0 ? +((buckets[k].likes+buckets[k].comments)/buckets[k].views*100).toFixed(2) : 0),
    };
  }
  const ts = buildTimeSeries(filtered);

  const chartsGrid = div("", {display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:"14px", marginBottom:"20px"});

  function makeChartCard(title, chartId, type, labels, data, color) {
    const card = div("card", {padding:"14px", overflow:"hidden"});
    card.appendChild(el("div", {style:{fontSize:"11px", fontWeight:500, color:"#6b7280", fontFamily:"monospace", marginBottom:"10px", letterSpacing:"0.06em"}}, title));
    const canvasWrap = div("", {position:"relative", width:"100%", height:"160px", overflow:"hidden"});
    const canvas = el("canvas", {id:chartId, style:{display:"block"}});
    canvas.height = 160;
    canvasWrap.appendChild(canvas);
    card.appendChild(canvasWrap);
    chartsGrid.appendChild(card);
    requestAnimationFrame(() => {
      const existing = Chart.getChart(chartId);
      if (existing) existing.destroy();
      canvas.width  = canvasWrap.offsetWidth || 300;
      canvas.height = 160;
      const isDark = state.darkMode;
      const gridColor = isDark ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)";
      const tickColor = isDark ? "#8e8c88" : "#9ca3af";
      new Chart(canvas, {
        type,
        data: {
          labels,
          datasets: [{
            label: title,
            data,
            backgroundColor: type==="bar" ? color+"99" : color+"33",
            borderColor: color,
            borderWidth: 2,
            fill: type==="line",
            tension: 0.4,
            pointRadius: labels.length > 12 ? 2 : 4,
          }]
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          plugins: { legend:{display:false} },
          scales: {
            x: { grid:{color:gridColor}, ticks:{color:tickColor, font:{size:10}} },
            y: { grid:{color:gridColor}, ticks:{color:tickColor, font:{size:10}}, beginAtZero:true },
          }
        }
      });
    });
    return card;
  }

  if (ts.labels.length > 0) {
    makeChartCard("POSTING FREQUENCY", "dash-chart-freq",    "bar",  ts.labels, ts.counts,   "#6366f1");
    makeChartCard("VIEWS TREND",       "dash-chart-views",   "line", ts.labels, ts.views,    "#3b82f6");
    makeChartCard("LIKES TREND",       "dash-chart-likes",   "line", ts.labels, ts.likes,    "#ec4899");
    makeChartCard("COMMENTS TREND",    "dash-chart-comments","line", ts.labels, ts.comments, "#f59e0b");
    makeChartCard("ER TREND (%)",      "dash-chart-er",      "line", ts.labels, ts.er,       "#10b981");
    body.appendChild(chartsGrid);
  } else {
    const noData = div("card", {padding:"20px", textAlign:"center", marginBottom:"20px"});
    noData.appendChild(el("div",{style:{fontSize:"12px",color:"#9ca3af"}},"No chart data yet — post some content first."));
    body.appendChild(noData);
  }

  // ── TIER 2: MODEL BREAKDOWN ──
  const t2Label = div("", {fontSize:"10px", fontWeight:500, color:"#6b7280", fontFamily:"monospace", marginBottom:"10px", letterSpacing:"0.06em"});
  t2Label.textContent = isAllModels ? "MODEL BREAKDOWN" : "ACCOUNT BREAKDOWN";
  body.appendChild(t2Label);

  if (isAllModels) {
    const realModels = state.models.filter(m => m.id !== "all");
    if (!realModels.length) {
      body.appendChild(el("div",{style:{fontSize:"12px",color:"#9ca3af",marginBottom:"20px"}},"No models configured yet."));
    } else {
      const modelGrid = div("", {display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:"10px", marginBottom:"20px"});
      realModels.forEach(m => {
        const mAccounts = state.accounts.filter(a => a.modelId === m.id && a.status === "active");
        const mDrafts   = allPostedDrafts.filter(d => mAccounts.some(a => a.id === d.accountId));
        const mFollowers = mAccounts.reduce((s,a) => s+(parseInt(a.followers)||0), 0);
        const mViews    = mDrafts.reduce((s,d) => s+(parseInt(d.metrics?.views)||0), 0);
        const mLikes    = mDrafts.reduce((s,d) => s+(parseInt(d.metrics?.likes)||0), 0);
        const mComments = mDrafts.reduce((s,d) => s+(parseInt(d.metrics?.comments)||0), 0);
        const mER = mViews > 0 ? ((mLikes+mComments)/mViews*100).toFixed(1)+"%" : "--";
        const lastAct = mDrafts.map(d=>d.scheduledAt||"").filter(Boolean).sort().reverse()[0] || null;
        const card = div("card", {cursor:"pointer"});
        card.addEventListener("click", () => setState({model:m.id}));
        card.appendChild(el("div",{style:{fontSize:"13px",fontWeight:600,marginBottom:"8px"}},m.label));
        [
          ["Accounts", mAccounts.length],
          ["Followers", fmt(mFollowers)],
          ["Posts",    mDrafts.length],
          ["Avg ER",   mER],
        ].forEach(([lbl,val]) => {
          const row = div("",{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"#6b7280",marginBottom:"3px"});
          row.appendChild(el("span",{},lbl));
          row.appendChild(el("span",{style:{fontWeight:500,color:"#374151",fontFamily:"monospace"}},String(val)));
          card.appendChild(row);
        });
        if (lastAct) card.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace",marginTop:"6px"}},"Last: "+lastAct.slice(0,10)));
        modelGrid.appendChild(card);
      });
      body.appendChild(modelGrid);
    }
  } else {
    // Specific model — show account breakdown
    const mAccs = state.accounts.filter(a => a.modelId === state.model && a.status === "active");
    if (!mAccs.length) {
      body.appendChild(el("div",{style:{fontSize:"12px",color:"#9ca3af",marginBottom:"20px"}},"No accounts for this model."));
    } else {
      const accGrid = div("", {display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:"10px", marginBottom:"20px"});
      mAccs.forEach(acc => {
        const aDrafts = filtered.filter(d => d.accountId === acc.id);
        const aViews    = aDrafts.reduce((s,d) => s+(parseInt(d.metrics?.views)||0), 0);
        const aLikes    = aDrafts.reduce((s,d) => s+(parseInt(d.metrics?.likes)||0), 0);
        const aComments = aDrafts.reduce((s,d) => s+(parseInt(d.metrics?.comments)||0), 0);
        const aER = aViews > 0 ? ((aLikes+aComments)/aViews*100).toFixed(1)+"%" : "--";
        const card = div("card", {});
        const hdr = div("",{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"});
        hdr.appendChild(renderDot(acc.color, 9));
        hdr.appendChild(el("div",{},[
          el("div",{style:{fontSize:"12px",fontWeight:600}},acc.sub||acc.handle),
          el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace"}},acc.handle),
        ]));
        card.appendChild(hdr);
        [
          ["Platform",   acc.platform],
          ["Followers",  fmt(parseInt(acc.followers)||0)],
          ["Posts",      aDrafts.length],
          ["Views",      fmt(aViews)],
          ["Likes",      fmt(aLikes)],
          ["Comments",   fmt(aComments)],
          ["Avg ER",     aER],
        ].forEach(([lbl,val]) => {
          const row = div("",{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"#6b7280",marginBottom:"3px"});
          row.appendChild(el("span",{},lbl));
          row.appendChild(el("span",{style:{fontWeight:500,color:"#374151",fontFamily:"monospace"}},String(val)));
          card.appendChild(row);
        });
        accGrid.appendChild(card);
      });
      body.appendChild(accGrid);
    }
  }

  // ── TIER 3: INSIGHTS & RECOMMENDATIONS ──
  body.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,color:"#6b7280",fontFamily:"monospace",marginBottom:"10px",letterSpacing:"0.06em"}},"INSIGHTS & RECOMMENDATIONS"));
  const insightBox = div("card",{padding:"32px",textAlign:"center",marginBottom:"20px"});
  insightBox.appendChild(el("div",{style:{fontSize:"16px",marginBottom:"8px"}},"💡"));
  insightBox.appendChild(el("div",{style:{fontSize:"13px",fontWeight:600,marginBottom:"6px",color:"#374151"}},"Insights Coming Soon"));
  insightBox.appendChild(el("div",{style:{fontSize:"12px",color:"#9ca3af",maxWidth:"360px",margin:"0 auto",lineHeight:1.6}},"AI-powered insights and posting recommendations will appear here once enough data has been collected."));
  body.appendChild(insightBox);

  return wrap;
}

function renderSwipe() {
  const isAllModels = state.model === "all";
  const sf = state.swipeFilters;

  // Filter by model
  function modelFilter(item) {
    if (isAllModels) return true;
    return (item.modelIds||["all"]).includes(state.model) || (item.modelIds||["all"]).includes("all");
  }

  // Filter accounts
  let filteredAccounts = state.swipeAccounts.filter(modelFilter);
  if (sf.platform !== "all") filteredAccounts = filteredAccounts.filter(a => a.platform === sf.platform);
  if (sf.search) filteredAccounts = filteredAccounts.filter(a =>
    a.handle.toLowerCase().includes(sf.search.toLowerCase()) ||
    a.niche.toLowerCase().includes(sf.search.toLowerCase()) ||
    a.notes.toLowerCase().includes(sf.search.toLowerCase())
  );

  // Filter inspo
  let filteredInspo = state.swipeInspo.filter(modelFilter);
  if (sf.platform !== "all") filteredInspo = filteredInspo.filter(p => p.platform === sf.platform);
  if (sf.postType !== "all") filteredInspo = filteredInspo.filter(p => p.postType === sf.postType);
  if (sf.search) filteredInspo = filteredInspo.filter(p =>
    p.account.toLowerCase().includes(sf.search.toLowerCase()) ||
    p.caption.toLowerCase().includes(sf.search.toLowerCase()) ||
    p.notes.toLowerCase().includes(sf.search.toLowerCase())
  );

  // Sort
  function sortItems(items) {
    return [...items].sort((a,b) => {
      let av, bv;
      if (state.swipeSortBy==="followers")  { av=a.followers||0; bv=b.followers||0; }
      else if (state.swipeSortBy==="views") { av=a.views||0; bv=b.views||0; }
      else if (state.swipeSortBy==="likes") { av=a.likes||0; bv=b.likes||0; }
      else if (state.swipeSortBy==="comments") { av=a.comments||0; bv=b.comments||0; }
      else { av=new Date(a.lastUpdated||0); bv=new Date(b.lastUpdated||0); }
      return state.swipeSortDir==="desc" ? bv-av : av-bv;
    });
  }

  const wrap = div("", {height:"100%", display:"flex", flexDirection:"column", overflow:"hidden"});

  // ── TOOLBAR ──
  const toolbar = div("", {padding:"10px 16px", background:"#fff", borderBottom:"1px solid #f0f0f0", display:"flex", alignItems:"center", gap:"8px", flexShrink:0, flexWrap:"wrap"});

  // Section toggle
  const secWrap = div("", {display:"flex", gap:"4px", background:"#f3f4f6", borderRadius:"8px", padding:"3px"});
  ["accounts","inspo"].forEach(sec => {
    const active = state.swipeSection === sec;
    const lbl = sec === "accounts" ? "Account Following" : "Inspiration Vault";
    const btn = el("button", {style:{padding:"5px 12px", borderRadius:"6px", border:"none", background:active?"#1c1c1e":"transparent", color:active?"#fff":"#6b7280", fontSize:"11px", cursor:"pointer", fontWeight:active?"600":"400", whiteSpace:"nowrap"}}, lbl);
    btn.addEventListener("click", () => setState({swipeSection:sec, swipeAccountDetail:null, swipeInspoDetail:null}));
    secWrap.appendChild(btn);
  });
  toolbar.appendChild(secWrap);

  // Search
  const searchInp = el("input", {class:"inp", placeholder:"Search...", style:{width:"160px", fontSize:"11px"}});
  searchInp.value = sf.search;
  searchInp.addEventListener("input", e => { state.swipeFilters = {...sf, search:e.target.value}; render(); });
  toolbar.appendChild(searchInp);

  // Platform filter
  const platOpts = [{value:"all",label:"All Platforms"}, ...state.platforms.map(p=>({value:p.name,label:p.name}))];
  toolbar.appendChild(renderSel(sf.platform, platOpts, v => setState({swipeFilters:{...sf,platform:v}})));

  // Post type filter (inspo only)
  if (state.swipeSection === "inspo") {
    const typeOpts = [{value:"all",label:"All Types"}, ...state.postTypes.map(t=>({value:t.id,label:t.name}))];
    toolbar.appendChild(renderSel(sf.postType, typeOpts, v => setState({swipeFilters:{...sf,postType:v}})));
  }

  // Sort
  const sortOpts = state.swipeSection==="accounts"
    ? [{value:"lastUpdated",label:"Date"},{value:"followers",label:"Followers"}]
    : [{value:"lastUpdated",label:"Date"},{value:"views",label:"Views"},{value:"likes",label:"Likes"},{value:"comments",label:"Comments"}];
  toolbar.appendChild(renderSel(state.swipeSortBy, sortOpts, v => setState({swipeSortBy:v})));
  toolbar.appendChild(renderBtn(state.swipeSortDir==="desc"?"Desc":"Asc", false, ()=>setState({swipeSortDir:state.swipeSortDir==="desc"?"asc":"desc"}), {fontSize:"11px"}));

  // Add button
  const addLabel = state.swipeSection==="accounts" ? "+ Add Account" : "+ Add Post";
  toolbar.appendChild(renderBtn(addLabel, true, ()=>setState(state.swipeSection==="accounts" ? {swipeShowNewAccount:true} : {swipeShowNewInspo:true}), {marginLeft:"auto"}));
  wrap.appendChild(toolbar);

  // ── MAIN LAYOUT ──
  const mainRow = div("", {display:"flex", flex:1, overflow:"hidden", minHeight:0});

  // Grid area
  const gridArea = div("content-area", {flex:1, minWidth:0});

  if (state.swipeSection === "accounts") {
    const sorted = sortItems(filteredAccounts);
    if (!sorted.length) {
      gridArea.appendChild(renderEmptyState("No accounts yet", "Add accounts you follow for inspiration.", "", null));
    } else {
      const grid = div("", {display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))", gap:"10px"});
      sorted.forEach(a => {
        const isSelected = state.swipeAccountDetail?.id === a.id;
        const platColor = state.platforms.find(p=>p.name===a.platform)?.color || "#888";
        const card = div("card", {cursor:"pointer", border:isSelected?"2px solid #1c1c1e":"2px solid transparent"});
        card.addEventListener("click", () => setState({swipeAccountDetail: isSelected ? null : a, swipeInspoDetail:null}));

        // Platform badge + handle
        const hdr = div("", {display:"flex", alignItems:"center", gap:"8px", marginBottom:"8px"});
        hdr.appendChild(el("span", {style:{fontSize:"10px", padding:"2px 8px", borderRadius:"20px", background:platColor+"22", color:platColor, fontFamily:"monospace", fontWeight:600}}, a.platform||""));
        hdr.appendChild(el("div", {style:{flex:1, minWidth:0}}, [
          el("div", {style:{fontSize:"12px", fontWeight:600, overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis"}}, a.handle||"—"),
          a.niche ? el("div", {style:{fontSize:"10px", color:"#9ca3af", fontFamily:"monospace"}}, a.niche) : null,
        ].filter(Boolean)));
        card.appendChild(hdr);

        // Stats row
        const stats = div("", {display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"4px", marginBottom:"8px"});
        [["Followers",fmt(a.followers)],["Posts",fmt(a.posts)],["Following",fmt(a.following)],["Likes",fmt(a.likes)]].forEach(([l,v])=>{
          const s = div("", {background:"#f9f9f9", borderRadius:"6px", padding:"4px", textAlign:"center"});
          s.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af"}},l));
          s.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,fontFamily:"monospace"}},String(v)));
          stats.appendChild(s);
        });
        card.appendChild(stats);

        if (a.whyGood) card.appendChild(el("div",{style:{fontSize:"11px",color:"#374151",marginBottom:"4px",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",lineHeight:1.4}},a.whyGood));
        if (a.notes)   card.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},a.notes));
        if (a.lastUpdated) card.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace",marginTop:"6px"}},new Date(a.lastUpdated).toLocaleDateString()));

        grid.appendChild(card);
      });
      gridArea.appendChild(grid);
    }
  } else {
    // Inspo vault
    const sorted = sortItems(filteredInspo);
    if (!sorted.length) {
      gridArea.appendChild(renderEmptyState("No inspiration posts yet", "Add posts that inspire you.", "", null));
    } else {
      const grid = div("", {display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))", gap:"10px"});
      sorted.forEach(p => {
        const isSelected = state.swipeInspoDetail?.id === p.id;
        const platColor = state.platforms.find(pl=>pl.name===p.platform)?.color || "#888";
        const er = (p.views||0) > 0 ? (((p.likes||0)+(p.comments||0))/(p.views||1)*100).toFixed(1)+"%" : "--";
        const card = div("card", {cursor:"pointer", border:isSelected?"2px solid #1c1c1e":"2px solid transparent"});
        card.addEventListener("click", () => setState({swipeInspoDetail: isSelected ? null : p, swipeAccountDetail:null}));

        // Thumbnail (first drive file)
        const thumb = div("", {width:"100%", aspectRatio:"4/3", borderRadius:"8px", background:"#f3f4f6", marginBottom:"8px", overflow:"hidden", position:"relative", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"11px", color:"#9ca3af"});
        if (p.driveFileIds?.length) {
          const img = el("img", {style:{width:"100%",height:"100%",objectFit:"cover",position:"absolute",top:0,left:0}});
          img.onerror = () => { img.style.display="none"; };
          setThumbSrc(img, p.driveFileIds[0]);
          thumb.appendChild(img);
          if (p.driveFileIds.length > 1) {
            thumb.appendChild(el("span",{style:{position:"absolute",top:"6px",right:"6px",background:"rgba(0,0,0,0.6)",color:"#fff",fontSize:"9px",borderRadius:"4px",padding:"2px 5px",fontFamily:"monospace"}},p.driveFileIds.length+" files"));
          }
        } else {
          thumb.appendChild(txt(p.postType||"Post"));
        }
        card.appendChild(thumb);

        // Platform + type
        const hdr = div("",{display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"});
        hdr.appendChild(el("span",{style:{fontSize:"10px",padding:"2px 7px",borderRadius:"20px",background:platColor+"22",color:platColor,fontFamily:"monospace",fontWeight:600}},p.platform||""));
        hdr.appendChild(el("span",{style:{fontSize:"10px",color:"#9ca3af"}},p.postType||""));
        if (p.account) hdr.appendChild(el("span",{style:{fontSize:"10px",color:"#6b7280",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",flex:1}},"@"+p.account));
        card.appendChild(hdr);

        if (p.caption) card.appendChild(el("div",{style:{fontSize:"11px",color:"#374151",marginBottom:"6px",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",lineHeight:1.4}},p.caption));

        // Metrics
        const mRow = div("",{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"4px",marginBottom:"6px"});
        [["Views",fmt(p.views||0)],["Likes",fmt(p.likes||0)],["Comments",fmt(p.comments||0)]].forEach(([l,v])=>{
          const m = div("",{background:"#f9f9f9",borderRadius:"6px",padding:"4px",textAlign:"center"});
          m.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af"}},l));
          m.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,fontFamily:"monospace"}},String(v)));
          mRow.appendChild(m);
        });
        card.appendChild(mRow);
        card.appendChild(el("div",{style:{fontSize:"10px",color:"#15803d",fontFamily:"monospace",marginBottom:"4px"}},"ER: "+er));
        if (p.notes) card.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},p.notes));
        if (p.lastUpdated) card.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace",marginTop:"4px"}},new Date(p.lastUpdated).toLocaleDateString()));

        grid.appendChild(card);
      });
      gridArea.appendChild(grid);
    }
  }
  mainRow.appendChild(gridArea);

  // ── ACCOUNT DETAIL PANEL ──
  if (state.swipeAccountDetail) {
    const a = state.swipeAccounts.find(x=>x.id===state.swipeAccountDetail.id) || state.swipeAccountDetail;
    const panel = div("", {width:"300px", flexShrink:0, borderLeft:"1px solid #f0f0f0", overflowY:"auto", padding:"16px", background:"#fafafa"});
    panel.addEventListener("click", e=>e.stopPropagation());
    gridArea.addEventListener("click", ()=>setState({swipeAccountDetail:null}));

    // Header
    const ph = div("",{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"});
    ph.appendChild(el("span",{style:{fontSize:"10px",fontWeight:500,color:"#6b7280",fontFamily:"monospace",letterSpacing:"0.06em"}},"ACCOUNT DETAIL"));
    const xBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",color:"#9ca3af",fontSize:"18px",lineHeight:1}},"×");
    xBtn.addEventListener("click",()=>setState({swipeAccountDetail:null}));
    ph.appendChild(xBtn);
    panel.appendChild(ph);

    function swipeAccField(label, key, type="text") {
      const row = div("",{marginBottom:"10px"});
      row.appendChild(el("span",{class:"lbl"},label));
      const inp = type==="textarea"
        ? el("textarea",{class:"inp",rows:3,style:{resize:"vertical"}})
        : el("input",{class:"inp",type:type||"text"});
      inp.value = a[key]||"";
      inp.addEventListener("change",()=>{
        const updated = {...a, [key]: type==="number"?parseInt(inp.value)||0:inp.value, lastUpdated:new Date().toISOString()};
        setState({swipeAccounts:state.swipeAccounts.map(x=>x.id===a.id?updated:x), swipeAccountDetail:updated});
        if(isAuthenticated()) saveToSheets();
      });
      row.appendChild(inp);
      return row;
    }

    panel.appendChild(swipeAccField("HANDLE","handle"));
    panel.appendChild(swipeAccField("PLATFORM","platform"));
    panel.appendChild(swipeAccField("PROFILE LINK","profileLink","url"));
    panel.appendChild(swipeAccField("FOLLOWERS","followers","number"));
    panel.appendChild(swipeAccField("POSTS","posts","number"));
    panel.appendChild(swipeAccField("FOLLOWING","following","number"));
    panel.appendChild(swipeAccField("LIKES","likes","number"));
    panel.appendChild(swipeAccField("NICHE","niche"));
    panel.appendChild(swipeAccField("WHY THEY'RE GOOD","whyGood","textarea"));
