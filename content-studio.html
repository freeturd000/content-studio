// ── METRICS ───────────────────────────────────────────────────────────────────
function renderMetrics() {
  const wrap = div("",{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden"});
  const mf = state.metricsFilters;

  const allPosts = state.content.flatMap(c =>
    c.posts.filter(p => {
      const acc = state.accounts.find(a=>a.id===p.accountId);
      return (mf.accounts.length===0||mf.accounts.includes(p.accountId)) &&
             (mf.types.length===0||mf.types.includes(c.type)) &&
             (mf.platforms.length===0||mf.platforms.includes(acc?.platform));
    }).map(p=>({...p, content:c, acc:state.accounts.find(a=>a.id===p.accountId)}))
  );

  const sorted = [...allPosts].sort((a,b)=>{
    let av,bv;
    if(state.metricsSortBy==="date"){av=new Date(a.date);bv=new Date(b.date);}
    else if(state.metricsSortBy==="views"){av=a.views;bv=b.views;}
    else if(state.metricsSortBy==="likes"){av=a.likes;bv=b.likes;}
    else if(state.metricsSortBy==="comments"){av=a.comments;bv=b.comments;}
    else{av=(a.likes+a.comments)/(a.acc?.followers||1);bv=(b.likes+b.comments)/(b.acc?.followers||1);}
    return state.metricsSortDir==="desc"?bv-av:av-bv;
  });

  const selAccs = mf.accounts.length ? mf.accounts : state.accounts.map(a=>a.id);
  const totF = selAccs.reduce((s,id)=>s+(state.accounts.find(a=>a.id===id)?.followers||0),0);
  const totV = allPosts.reduce((s,p)=>s+p.views,0);
  const totL = allPosts.reduce((s,p)=>s+p.likes,0);
  const totC = allPosts.reduce((s,p)=>s+p.comments,0);
  const avgER = allPosts.length ? ((totL+totC)/(totF*allPosts.length)*100).toFixed(1)+"%" : "--";

  // Toolbar
  const toolbar = div("",{padding:"10px 16px",background:"#fff",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:"8px",flexShrink:0,flexWrap:"wrap"});
  toolbar.appendChild(renderMultiSelect("Platform", state.platforms.map(p=>({id:p.name,label:p.name,color:p.color})), mf.platforms, v=>setState({metricsFilters:{...mf,platforms:v}})));
  toolbar.appendChild(renderMultiSelect("Account", state.accounts.map(a=>({id:a.id,label:a.sub,color:a.color})), mf.accounts, v=>setState({metricsFilters:{...mf,accounts:v}})));
  toolbar.appendChild(renderMultiSelect("Type", state.postTypes.map(t=>({id:t.id,label:t.name})), mf.types, v=>setState({metricsFilters:{...mf,types:v}})));

  const sortWrap = div("",{marginLeft:"auto",display:"flex",gap:"6px",alignItems:"center"});
  sortWrap.appendChild(el("span",{style:{fontSize:"11px",color:"#9ca3af"}},"Sort:"));
  const sortSel = renderSel(state.metricsSortBy, [{value:"date",label:"Date"},{value:"views",label:"Views"},{value:"likes",label:"Likes"},{value:"comments",label:"Comments"},{value:"er",label:"Eng. Rate"}], v=>setState({metricsSortBy:v}));
  Object.assign(sortSel.style,{width:"auto",padding:"4px 10px",fontSize:"11px"});
  sortWrap.appendChild(sortSel);
  const dirBtn = renderBtn(state.metricsSortDir==="desc"?"Desc":"Asc", false, ()=>setState({metricsSortDir:state.metricsSortDir==="desc"?"asc":"desc"}), {fontSize:"11px",padding:"4px 10px"});
  sortWrap.appendChild(dirBtn);
  toolbar.appendChild(sortWrap);
  wrap.appendChild(toolbar);

  const area = div("content-area",{});

  // Stats
  const statsRow = div("",{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"10px",marginBottom:"14px"});
  [["Followers",totF.toLocaleString()],["Views",fmt(totV)],["Likes",fmt(totL)],["Comments",fmt(totC)],["Avg ER",avgER]].forEach(([l,v])=>{
    const card = div("card",{padding:"10px 12px"});
    card.appendChild(el("div",{style:{fontSize:"20px",fontWeight:600,fontFamily:"monospace"}},v));
    card.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",marginTop:"2px"}},l));
    statsRow.appendChild(card);
  });
  area.appendChild(statsRow);

  // Follower counts
  const followerCard = div("card",{marginBottom:"14px"});
  followerCard.appendChild(el("div",{class:"section-title"},"FOLLOWER COUNTS"));
  const followerRow = div("",{display:"flex",gap:"8px",flexWrap:"wrap"});
  selAccs.forEach(id=>{
    const acc = state.accounts.find(a=>a.id===id);
    if (!acc) return;
    const row = div("",{display:"flex",alignItems:"center",gap:"7px",padding:"6px 12px",background:"#f9f9f9",borderRadius:"8px",flex:1,minWidth:"120px"});
    row.appendChild(renderDot(acc.color));
    const info = div("",{flex:1});
    info.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500}},acc.sub));
    info.appendChild(el("div",{style:{fontSize:"12px",fontFamily:"monospace"}},acc.followers.toLocaleString()));
    row.appendChild(info);
    const editBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"11px",color:"#9ca3af"}},"edit");
    editBtn.addEventListener("click",()=>setState({showMetricsUpdate:{accountId:id,content:{id:"dummy"},views:0,likes:0,comments:0}}));
    row.appendChild(editBtn);
    followerRow.appendChild(row);
  });
  followerCard.appendChild(followerRow);
  area.appendChild(followerCard);

  // Posts grid
  if (!sorted.length) {
    area.appendChild(renderEmptyState("No posts found","Adjust your filters to see posts.","",null));
  } else {
    const grid = div("",{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"10px"});
    sorted.forEach(p=>{
      const er = pct(p.likes+p.comments,p.acc?.followers);
      const rr = pct(p.views,p.acc?.followers);
      const card = div("card",{});
      const thumb = div("",{width:"100%",aspectRatio:"4/3",borderRadius:"8px",background:"#f8f8f7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",color:"#9ca3af",marginBottom:"8px"});
      thumb.appendChild(txt(p.content.type));
      card.appendChild(thumb);
      card.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginBottom:"3px"}},p.content.type+" - "+p.date));
      card.appendChild(el("div",{style:{fontSize:"12px",fontWeight:500,lineHeight:1.3,marginBottom:"7px",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}},p.content.label));
      const accRow = div("",{display:"flex",alignItems:"center",gap:"5px",marginBottom:"8px"});
      accRow.appendChild(renderDot(p.acc?.color));
      accRow.appendChild(el("span",{style:{fontSize:"10px",color:"#6b7280"}},p.acc?.sub||""));
      card.appendChild(accRow);
      const metricsGrid = div("grid3",{marginBottom:"6px"});
      [["Views",fmt(p.views)],["Likes",fmt(p.likes)],["Cmts",fmt(p.comments)]].forEach(([ic,v])=>{
        const m = div("",{background:"#f9f9f9",borderRadius:"6px",padding:"5px 4px",textAlign:"center"});
        m.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af"}},ic));
        m.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,fontFamily:"monospace"}},v));
        metricsGrid.appendChild(m);
      });
      card.appendChild(metricsGrid);
      const rates = div("",{display:"flex",gap:"5px",marginBottom:"8px"});
      const erDiv = div("",{flex:1,background:"#f0fdf4",borderRadius:"6px",padding:"4px 6px",textAlign:"center"});
      erDiv.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,color:"#15803d",fontFamily:"monospace"}},er));
      erDiv.appendChild(el("div",{style:{fontSize:"9px",color:"#15803d"}},"eng rate"));
      const rrDiv = div("",{flex:1,background:"#eff6ff",borderRadius:"6px",padding:"4px 6px",textAlign:"center"});
      rrDiv.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,color:"#1d4ed8",fontFamily:"monospace"}},rr));
      rrDiv.appendChild(el("div",{style:{fontSize:"9px",color:"#1d4ed8"}},"reach rate"));
      rates.appendChild(erDiv);
      rates.appendChild(rrDiv);
      card.appendChild(rates);
      const updBtn = renderBtn("Update metrics", false, ()=>setState({showMetricsUpdate:p}), {width:"100%",justifyContent:"center",fontSize:"11px"});
      card.appendChild(updBtn);
      grid.appendChild(card);
    });
    area.appendChild(grid);
  }
  wrap.appendChild(area);

  // Update metrics modal
  if (state.showMetricsUpdate) {
    const p = state.showMetricsUpdate;
    const overlay = div("overlay",{});
    const modal = div("modal",{width:"300px"});
    const mHeader = div("",{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px"});
    mHeader.appendChild(el("span",{style:{fontSize:"14px",fontWeight:600}},"Update Metrics"));
    const mc = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"18px",color:"#9ca3af"}},"x");
    mc.addEventListener("click",()=>setState({showMetricsUpdate:null}));
    mHeader.appendChild(mc);
    modal.appendChild(mHeader);

    const fields = {};
    const acc = state.accounts.find(a=>a.id===p.accountId);
    [{l:"VIEWS",k:"views",v:p.views||0},{l:"LIKES",k:"likes",v:p.likes||0},{l:"COMMENTS",k:"comments",v:p.comments||0},{l:"FOLLOWERS",k:"followers",v:acc?.followers||0}].forEach(f=>{
      const row = div("",{marginBottom:"10px"});
      row.appendChild(el("span",{class:"lbl"},f.l));
      const inp = el("input",{type:"number",class:"inp",value:f.v});
      fields[f.k] = inp;
      row.appendChild(inp);
      modal.appendChild(row);
    });

    const saveBtn = renderBtn("Save", true, ()=>{
      const views    = parseInt(fields.views.value)||0;
      const likes    = parseInt(fields.likes.value)||0;
      const comments = parseInt(fields.comments.value)||0;
      const followers= parseInt(fields.followers.value)||0;
      if (p.content.id !== "dummy") {
        setState({content:state.content.map(c=>{
          if(c.id!==p.content.id) return c;
          return {...c,posts:c.posts.map(pp=>pp.accountId===p.accountId?{...pp,views,likes,comments}:pp)};
        }), accounts:state.accounts.map(a=>a.id===p.accountId?{...a,followers}:a), showMetricsUpdate:null});
      } else {
        setState({accounts:state.accounts.map(a=>a.id===p.accountId?{...a,followers}:a), showMetricsUpdate:null});
      }
      if (isAuthenticated()) saveToSheets();
    }, {width:"100%",justifyContent:"center",marginTop:"6px"});
    modal.appendChild(saveBtn);
    overlay.appendChild(modal);
    wrap.appendChild(overlay);
  }

  return wrap;
}

  const topBtns = div("",{display:"flex",gap:"8px"});
  const uploadBtn = renderBtn("Quick Upload", false, ()=>setState({showUpload:true}));
  const draftBtn  = renderBtn("+ Draft Post", true, ()=>setState({tab:"draft",editingDraft:null,draftForm:{platform:"Instagram",accountId:"ig-main",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"},draftNameOverridden:false}));
  topBtns.appendChild(uploadBtn);
  topBtns.appendChild(draftBtn);
  topbar.appendChild(topBtns);
  main.appendChild(topbar);

  // Tab content
  const content = div("",{flex:1,overflow:"hidden"});
  if (state.tab==="library")  content.appendChild(renderLibrary());
  if (state.tab==="draft")    content.appendChild(renderDraft());
  if (state.tab==="calendar") content.appendChild(renderCalendar());
  if (state.tab==="metrics")  content.appendChild(renderMetrics());
  main.appendChild(content);
  app.appendChild(main);

  // Modals
  if (state.showSettings)     app.appendChild(renderSettings());
  if (state.showConfirm)      app.appendChild(renderConfirm(state.showConfirm.message, state.showConfirm.onYes, ()=>setState({showConfirm:null})));
  if (state.showEditAccount)  app.appendChild(renderEditAccountModal(state.showEditAccount));
  if (state.showAddAccount)   app.appendChild(renderAddAccountModal());
  if (state.showUpload)       app.appendChild(renderUploadModal());

  return app;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Restore token from localStorage if still valid
(function restoreToken() {
  const token  = localStorage.getItem("cs_token");
  const expiry = localStorage.getItem("cs_token_expiry");
  if (token && expiry && new Date() < new Date(expiry)) {
    state.token      = token;
    state.tokenExpiry= expiry;
  }
})();
checkAuthCallback();
render();
// Auto-load if already authenticated
if (isAuthenticated()) {
  setTimeout(() => loadFromSheets(), 500);
}
</script>
</body>
</html>
