function renderMetrics() {
  const wrap = div("",{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden"});
  const mf = state.metricsFilters;

  // Metrics shows posted drafts
  const postedDrafts = state.drafts.filter(d => {
    const acc = state.accounts.find(a=>a.id===d.accountId);
    const st = getStatus(d);
    return st==="posted" &&
           (mf.accounts.length===0||mf.accounts.includes(d.accountId)) &&
           (mf.types.length===0||mf.types.includes(d.type)) &&
           (mf.platforms.length===0||mf.platforms.includes(d.platform));
  });

  const allPosts = postedDrafts.map(d => {
    const acc = state.accounts.find(a=>a.id===d.accountId);
    const con = (d.contentIds||[]).map(id=>state.content.find(c=>c.id===id)).filter(Boolean);
    const metrics = d.metrics || {views:0,likes:0,comments:0};
    return {
      id: d.id,
      accountId: d.accountId,
      date: d.scheduledAt?.slice(0,10)||"",
      views: parseInt(metrics.views)||0,
      likes: parseInt(metrics.likes)||0,
      comments: parseInt(metrics.comments)||0,
      acc,
      content: con[0]||{label:d.name,driveId:null},
      draft: d,
      type: d.type,
    };
  });

  const sorted = [...allPosts].sort((a,b)=>{
    let av,bv;
    if(state.metricsSortBy==="date"){av=new Date(a.date||0);bv=new Date(b.date||0);}
    else if(state.metricsSortBy==="views"){av=a.views||0;bv=b.views||0;}
    else if(state.metricsSortBy==="likes"){av=a.likes||0;bv=b.likes||0;}
    else if(state.metricsSortBy==="comments"){av=a.comments||0;bv=b.comments||0;}
    else{av=(a.likes+a.comments)/(a.acc?.followers||1);bv=(b.likes+b.comments)/(b.acc?.followers||1);}
    return state.metricsSortDir==="desc"?bv-av:av-bv;
  });

  const totV = allPosts.reduce((s,p)=>s+(p.views||0),0);
  const totL = allPosts.reduce((s,p)=>s+(p.likes||0),0);
  const totC = allPosts.reduce((s,p)=>s+(p.comments||0),0);
  const totPosts = allPosts.length;
  const avgER = totPosts && totV ? ((totL+totC)/totV*100).toFixed(2)+"%" : "--";

  // Toolbar
  const toolbar = div("",{padding:"10px 16px",background:"#fff",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:"8px",flexShrink:0,flexWrap:"wrap"});
  toolbar.appendChild(renderMultiSelect("Platform", state.platforms.map(p=>({id:p.name,label:p.name,color:p.color})), mf.platforms, v=>setState({metricsFilters:{...mf,platforms:v}})));
  toolbar.appendChild(renderMultiSelect("Account", state.accounts.map(a=>({id:a.id,label:a.sub,color:a.color})), mf.accounts, v=>setState({metricsFilters:{...mf,accounts:v}})));
  toolbar.appendChild(renderMultiSelect("Type", state.postTypes.map(t=>({id:t.id,label:t.name})), mf.types, v=>setState({metricsFilters:{...mf,types:v}})));

  const sortWrap = div("",{marginLeft:"auto",display:"flex",gap:"6px",alignItems:"center"});
  sortWrap.appendChild(el("span",{style:{fontSize:"11px",color:"#9ca3af"}},"Sort:"));
  const sortSel = renderSel(state.metricsSortBy, [{value:"date",label:"Date"},{value:"views",label:"Views"},{value:"likes",label:"Likes"},{value:"comments",label:"Comments"},{value:"er",label:"Eng. Rate"}], v=>setState({metricsSortBy:v}));
  Object.assign(sortSel.style,{width:"auto",padding:"4px 10px",fontSize:"11px"});
  sortWrap.appendChild(sortSel);
  const dirBtn = renderBtn(state.metricsSortDir==="desc"?"Desc":"Asc", false, ()=>setState({metricsSortDir:state.metricsSortDir==="desc"?"asc":"desc"}), {fontSize:"11px",padding:"4px 10px"});
  sortWrap.appendChild(dirBtn);
  toolbar.appendChild(sortWrap);
  wrap.appendChild(toolbar);

  // Posts grid
  const mainRow = div("",{display:"flex",flex:1,overflow:"hidden",minHeight:0});

  const gridArea = div("",{flex:1,overflowY:"auto",padding:"0 16px 16px"});

  // Stats
  const statsRow = div("",{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"10px",marginBottom:"14px"});
  [["Posted",totPosts],["Views",fmt(totV)],["Likes",fmt(totL)],["Comments",fmt(totC)],["Avg ER",avgER]].forEach(([l,v])=>{
    const card = div("card",{padding:"10px 12px"});
    card.appendChild(el("div",{style:{fontSize:"20px",fontWeight:600,fontFamily:"monospace"}},v));
    card.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",marginTop:"2px"}},l));
    statsRow.appendChild(card);
  });
  gridArea.appendChild(statsRow);

  if (!sorted.length) {
    gridArea.appendChild(renderEmptyState("No posts found","Adjust your filters to see posts.","",null));
  } else {
    const grid = div("",{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"10px"});
    sorted.forEach(p=>{
      const er = p.likes+p.comments > 0 ? ((p.likes+p.comments)/Math.max(1,p.views)*100).toFixed(1)+"%" : "--";
      const isSelected = state.showMetricsDetail?.id === p.id;
      const card = div("card",{cursor:"pointer",border:isSelected?"2px solid #1c1c1e":"2px solid transparent",transition:"border-color 0.1s"});
      card.addEventListener("click", ()=>setState({showMetricsDetail: isSelected ? null : p}));
      const thumb = div("",{width:"100%",aspectRatio:"4/3",borderRadius:"8px",background:"#f8f8f7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",color:"#9ca3af",marginBottom:"8px",overflow:"hidden",position:"relative"});
      if (p.content?.driveId) {
        const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover",position:"absolute",top:0,left:0}});
        setThumbSrc(img, p.content.driveId);
        thumb.appendChild(img);
      } else { thumb.appendChild(txt(p.type||"")); }
      card.appendChild(thumb);
      card.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginBottom:"3px"}},p.type+" - "+p.date));
      card.appendChild(el("div",{style:{fontSize:"12px",fontWeight:500,lineHeight:1.3,marginBottom:"7px",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}},p.draft?.name||p.content?.label||""));
      const accRowEl = div("",{display:"flex",alignItems:"center",gap:"5px",marginBottom:"8px"});
      accRowEl.appendChild(renderDot(p.acc?.color));
      accRowEl.appendChild(el("span",{style:{fontSize:"10px",color:"#6b7280"}},(p.acc?.sub||"")+(p.acc?.handle?" - "+p.acc.handle:"")));
      card.appendChild(accRowEl);
      const metricsGrid = div("grid3",{marginBottom:"6px"});
      [["Views",fmt(p.views)],["Likes",fmt(p.likes)],["Cmts",fmt(p.comments)]].forEach(([ic,v])=>{
        const m = div("",{background:"#f9f9f9",borderRadius:"6px",padding:"5px 4px",textAlign:"center"});
        m.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af"}},ic));
        m.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,fontFamily:"monospace"}},v));
        metricsGrid.appendChild(m);
      });
      card.appendChild(metricsGrid);
      const erDiv = div("",{background:"#f0fdf4",borderRadius:"6px",padding:"4px 6px",textAlign:"center",marginBottom:"6px"});
      erDiv.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,color:"#15803d",fontFamily:"monospace"}},er));
      erDiv.appendChild(el("div",{style:{fontSize:"9px",color:"#15803d"}},"eng rate"));
      card.appendChild(erDiv);
      const cardDraft = state.drafts.find(d=>d.id===p.id);
      const cardTs = cardDraft?.lastMetricsUpdated || cardDraft?.scheduledAt;
      const cardTsLabel = cardDraft?.lastMetricsUpdated ? "Updated: " : "Posted: ";
      const cardFd = cardTs ? new Date(cardTs).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
      card.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace",textAlign:"center",marginTop:"4px"}},cardTsLabel+cardFd));
      grid.appendChild(card);
    });
    gridArea.appendChild(grid);
  }
  if (state.showMetricsDetail) gridArea.addEventListener("click",e=>{ if(e.target===gridArea) setState({showMetricsDetail:null}); });
  mainRow.appendChild(gridArea);

  // Detail panel
  if (state.showMetricsDetail) {
    const p = state.showMetricsDetail;
    const draft = state.drafts.find(d=>d.id===p.id) || p.draft;
    const panel = div("",{width:"300px",flexShrink:0,borderLeft:"1px solid #f0f0f0",overflowY:"auto",padding:"16px",background:"#fafafa"});
    panel.addEventListener("click",e=>e.stopPropagation());

    // Header
    const ph = div("",{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"});
    ph.appendChild(el("span",{style:{fontSize:"10px",fontWeight:500,color:"#6b7280",fontFamily:"monospace",letterSpacing:"0.06em"}},"POST DETAIL"));
    const closeBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",color:"#9ca3af",fontSize:"18px",lineHeight:1,padding:"0"}},"×");
    closeBtn.addEventListener("click",()=>setState({showMetricsDetail:null}));
    ph.appendChild(closeBtn);
    panel.appendChild(ph);

    // All content thumbnails (click opens lightbox)
    const contentItems = (draft?.contentIds||[]).map(id=>state.content.find(c=>c.id===id)).filter(Boolean);
    const overlaysArr = draft?.overlays || [];
    if (contentItems.length) {
      const thumbRow = div("",{display:"flex",gap:"6px",marginBottom:"12px",flexWrap:"wrap"});
      contentItems.forEach((c,i)=>{
        const tb = div("",{width:"70px",height:"70px",borderRadius:"8px",background:"#e5e7eb",overflow:"hidden",flexShrink:0,position:"relative",cursor:"pointer"});
        if (c.driveId) {
          const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});
          img.onerror=()=>{img.style.display="none";};
          setThumbSrc(img,c.driveId);
          tb.appendChild(img);
        }
        const numBadge = el("span",{style:{position:"absolute",bottom:"3px",left:"3px",background:"rgba(0,0,0,0.55)",color:"#fff",fontSize:"9px",borderRadius:"4px",padding:"1px 4px",fontFamily:"monospace"}},""+(i+1));
        tb.appendChild(numBadge);
        tb.addEventListener("click",e=>{
          e.stopPropagation();
          openMetricsLightbox(contentItems, i, draft);
        });
        thumbRow.appendChild(tb);
      });
      panel.appendChild(thumbRow);
    }

    // Post name
    panel.appendChild(el("div",{style:{fontSize:"13px",fontWeight:600,marginBottom:"4px",wordBreak:"break-all"}},draft?.name||p.content?.label||""));

    // Platform / account / type / date
    const meta = div("",{fontSize:"11px",color:"#6b7280",fontFamily:"monospace",marginBottom:"10px",lineHeight:1.7});
    meta.appendChild(el("div",{},(draft?.platform||"")+" · "+(p.acc?.sub||"")+(p.acc?.handle?" · "+p.acc.handle:"")));
    meta.appendChild(el("div",{},(draft?.type||"")+" · "+(draft?.scheduledAt?.slice(0,16)||"").replace("T"," ")));
    const statusColors = {posted:"#15803d",scheduled:"#1d4ed8",missed:"#b91c1c",draft:"#6b7280"};
    const st = getStatus(draft||{status:p.draft?.status});
    meta.appendChild(el("span",{style:{display:"inline-block",fontSize:"10px",padding:"2px 8px",borderRadius:"20px",background:st==="posted"?"#d1fae5":st==="scheduled"?"#dbeafe":st==="missed"?"#fee2e2":"#f3f4f6",color:statusColors[st]||"#6b7280",fontFamily:"monospace",marginTop:"2px"}},st));
    panel.appendChild(meta);

    // Text overlays per slide
    const overlaysArrFull = draft?.overlays || [];
    const hasOverlays = overlaysArrFull.some(o=>o&&o.trim());
    if (hasOverlays) {
      panel.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,color:"#9ca3af",fontFamily:"monospace",marginBottom:"6px",letterSpacing:"0.06em"}},"TEXT OVERLAYS"));
      overlaysArrFull.forEach((ov,i)=>{
        if (!ov || !ov.trim()) return;
        const ovRow = div("",{display:"flex",gap:"8px",alignItems:"flex-start",marginBottom:"5px",background:"#fff",borderRadius:"6px",padding:"6px 10px",border:"1px solid #e5e7eb"});
        ovRow.appendChild(el("span",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace",flexShrink:0,marginTop:"1px"}},"S"+(i+1)));
        ovRow.appendChild(el("span",{style:{fontSize:"11px",color:"#374151",flex:1,lineHeight:1.4}},ov));
        panel.appendChild(ovRow);
      });
      panel.appendChild(div("",{height:"6px"}));
    }

    // Caption & hashtags
    if (draft?.caption) {
      panel.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,color:"#9ca3af",fontFamily:"monospace",marginBottom:"3px",letterSpacing:"0.06em"}},"CAPTION"));
      panel.appendChild(el("div",{style:{fontSize:"11px",color:"#374151",marginBottom:"10px",lineHeight:1.5,background:"#fff",borderRadius:"6px",padding:"8px 10px",border:"1px solid #e5e7eb"}},draft.caption));
    }
    if (draft?.hashtags) {
      panel.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,color:"#9ca3af",fontFamily:"monospace",marginBottom:"3px",letterSpacing:"0.06em"}},"HASHTAGS"));
      panel.appendChild(el("div",{style:{fontSize:"11px",color:"#6366f1",marginBottom:"10px",fontFamily:"monospace",wordBreak:"break-all"}},draft.hashtags));
    }

    // Editable metrics
    panel.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,color:"#9ca3af",fontFamily:"monospace",marginBottom:"8px",letterSpacing:"0.06em"}},"METRICS"));
    const mFields = {};
    const currentDraft = state.drafts.find(d=>d.id===p.id);
    [{l:"VIEWS",k:"views"},{l:"LIKES",k:"likes"},{l:"COMMENTS",k:"comments"}].forEach(f=>{
      const row = div("",{marginBottom:"8px"});
      row.appendChild(el("span",{class:"lbl"},f.l));
      const inp = el("input",{type:"number",class:"inp",value:currentDraft?.metrics?.[f.k]||0,style:{fontFamily:"monospace"}});
      inp.addEventListener("change",()=>{
        const views    = parseInt(mFields.views?.value)||0;
        const likes    = parseInt(mFields.likes?.value)||0;
        const comments = parseInt(mFields.comments?.value)||0;
        const ts = new Date().toISOString();
        setState({
          drafts: state.drafts.map(d=>d.id===p.id?{...d,metrics:{views,likes,comments},lastMetricsUpdated:ts}:d),
          showMetricsDetail: {...state.showMetricsDetail, views, likes, comments}
        });
        if (isAuthenticated()) saveToSheets();
      });
      mFields[f.k] = inp;
      row.appendChild(inp);
      panel.appendChild(row);
    });

    // Last updated — always show, fall back to scheduledAt if never manually updated
    const lmu = currentDraft?.lastMetricsUpdated || currentDraft?.scheduledAt;
    const lmuLabel = currentDraft?.lastMetricsUpdated ? "Updated: " : "Posted: ";
    const lmuFmt = lmu ? new Date(lmu).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
    panel.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginTop:"8px"}},lmuLabel+lmuFmt));

    mainRow.appendChild(panel);
  }

  wrap.appendChild(mainRow);

  // Update metrics modal (kept for any legacy callers)
  if (state.showMetricsUpdate) wrap.appendChild(renderMetricsUpdateModal());

  return wrap;
}

// ── ACCOUNT MODALS ────────────────────────────────────────────────────────────
function renderEditAccountModal(account) {
  const form = {...account};
  const overlay = div("overlay",{});
  const modal = div("modal",{width:"320px"});
  const header = div("",{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px"});
  header.appendChild(el("span",{style:{fontSize:"14px",fontWeight:600}},"Edit Account"));
  const closeBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"18px",color:"#9ca3af"}},"x");
  closeBtn.addEventListener("click",()=>setState({showEditAccount:null}));
  header.appendChild(closeBtn);
  modal.appendChild(header);

  const fields = {};
  [{l:"DISPLAY NAME",k:"sub"},{l:"HANDLE",k:"handle"},{l:"FOLLOWERS",k:"followers"}].forEach(f=>{
    const row = div("",{marginBottom:"10px"});
    row.appendChild(el("span",{class:"lbl"},f.l));
    const inp = el("input",{class:"inp",value:form[f.k]||""});
    inp.addEventListener("input",e=>{form[f.k]=e.target.value;});
    fields[f.k]=inp;
    row.appendChild(inp);
    modal.appendChild(row);
  });

  const platRow = div("",{marginBottom:"10px"});
  platRow.appendChild(el("span",{class:"lbl"},"PLATFORM"));
  const platSel = renderSel(form.platform, state.platforms.map(p=>({value:p.name,label:p.name})), v=>{form.platform=v;});
  platRow.appendChild(platSel);
  modal.appendChild(platRow);

  const statRow = div("",{marginBottom:"16px"});
  statRow.appendChild(el("span",{class:"lbl"},"STATUS"));
  const statSel = renderSel(form.status, [{value:"active",label:"Active"},{value:"inactive",label:"Inactive"}], v=>{form.status=v;});
  statRow.appendChild(statSel);
  modal.appendChild(statRow);

  const btnRow = div("",{display:"flex",gap:"8px"});
  const saveBtn = renderBtn("Save", true, ()=>{
    form.followers = parseInt(fields.followers.value)||0;
    form.sub = fields.sub.value;
    form.handle = fields.handle.value;
    form.platform = platSel.value;
    form.status = statSel.value;
    setState({accounts:state.accounts.map(a=>a.id===form.id?form:a),showEditAccount:null});
    if (isAuthenticated()) saveToSheets();
  }, {flex:1,justifyContent:"center"});
  const delBtn = renderBtn("Delete", false, ()=>{
    setState({showConfirm:{message:"Delete account "+account.sub+"?",onYes:()=>setState({accounts:state.accounts.filter(a=>a.id!==account.id),showEditAccount:null,showConfirm:null})},showEditAccount:null});
  }, {flex:1,justifyContent:"center",color:"#ef4444",borderColor:"#fecaca"});
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(delBtn);
  modal.appendChild(btnRow);
  overlay.appendChild(modal);
  return overlay;
}

// ── MOBILE APP ────────────────────────────────────────────────────────────────
function renderMobileApp() {
  const bg = state.darkMode ? "#111112" : "#f8f8f7";
  const cardBg = state.darkMode ? "#2c2c2e" : "#fff";
  const wrap = el("div",{style:{display:"flex",flexDirection:"column",height:"100vh",background:bg,fontFamily:"system-ui,sans-serif",fontSize:"13px",overflow:"hidden"}});

  // Top bar
  const mTopbarBg = state.darkMode ? "#111110" : "#1c1c1e";
  const topbar = el("div",{style:{background:mTopbarBg,padding:"12px 16px",display:"flex",alignItems:"center",gap:"10px",justifyContent:"space-between",flexShrink:0,paddingTop:"env(safe-area-inset-top, 12px)"}});
  const hamburger = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"20px",color:"#fff",padding:"4px",minWidth:"44px",minHeight:"44px",display:"flex",alignItems:"center",justifyContent:"center"}},"☰");
  hamburger.addEventListener("click",()=>setState({sidebarOpen:!state.sidebarOpen}));
  topbar.appendChild(hamburger);
  const titleDiv = el("div",{style:{flex:1,display:"flex",flexDirection:"column"}});
  titleDiv.appendChild(el("span",{style:{fontSize:"14px",fontWeight:600,color:"#fff"}},"Calendar"));
  if (isAuthenticated()) {
    const expiryMins = state.tokenExpiry ? Math.max(0,Math.round((new Date(state.tokenExpiry)-new Date())/60000)) : 0;
    titleDiv.appendChild(el("span",{style:{fontSize:"9px",color:"#22c55e",fontFamily:"monospace"}},expiryMins+"m"));
  }
  topbar.appendChild(titleDiv);
  const rightWrap = el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});
  if (!isAuthenticated()) {
    const connectBtn = el("button",{style:{background:"#fff",color:"#1c1c1e",border:"none",borderRadius:"8px",padding:"7px 12px",fontSize:"12px",fontWeight:600,cursor:"pointer",minHeight:"44px"}},"Connect");
    connectBtn.addEventListener("click",connectGoogle);
    rightWrap.appendChild(connectBtn);
  } else {
    const modelSel = el("select",{style:{background:"#2c2c2e",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",borderRadius:"8px",padding:"5px 8px",fontSize:"12px",cursor:"pointer",minHeight:"44px"}});
    state.models.forEach(m=>{
      const opt = el("option",{value:m.id},m.label);
      if (m.id===state.model) opt.selected=true;
      modelSel.appendChild(opt);
    });
    modelSel.addEventListener("change",e=>setState({model:e.target.value}));
    rightWrap.appendChild(modelSel);
  }
  topbar.appendChild(rightWrap);
  wrap.appendChild(topbar);

  // Collapsible sidebar overlay
  if (state.sidebarOpen) {
    const sideOverlay = el("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:300}});
    sideOverlay.addEventListener("click",()=>setState({sidebarOpen:false}));
    const sidePanel = el("div",{style:{position:"fixed",top:0,left:0,bottom:0,width:"260px",background:"#1c1c1e",zIndex:301,overflowY:"auto",boxShadow:"4px 0 20px rgba(0,0,0,0.3)"}});
    // Render the full sidebar content inside
    const innerSidebar = renderSidebar();
    // Reuse sidebar content: copy all children
    while (innerSidebar.firstChild) sidePanel.appendChild(innerSidebar.firstChild);
    sideOverlay.appendChild(sidePanel);
    wrap.appendChild(sideOverlay);
  }

  // Content area — mobile is calendar-only
  const content = el("div",{style:{flex:1,overflowY:"auto",paddingBottom:"0"}});
  content.appendChild(renderMobileCalendar());
  wrap.appendChild(content);

  // Modals
  if (state.showDraftModal) wrap.appendChild(renderMobileDraftModal());
  if (state.showMetricsUpdate) wrap.appendChild(renderMetricsUpdateModal());
  if (state.showUpload) wrap.appendChild(renderUploadModal());
  if (state.showSettings) wrap.appendChild(renderSettings());
  if (state.showEditAccount) wrap.appendChild(renderEditAccountModal(state.showEditAccount));
  if (state.showAddAccount) wrap.appendChild(renderAddAccountModal());
  if (state.showConfirm) wrap.appendChild(renderConfirm(state.showConfirm.message, state.showConfirm.onYes, ()=>setState({showConfirm:null})));

  return wrap;
}

  // Search
  const searchInp = el("input",{style:{width:"100%",padding:"8px 12px",border:"1px solid "+borderCol,borderRadius:"8px",background:bg,color:state.darkMode?"#e5e5e5":"#1a1a1a",fontSize:"13px",boxSizing:"border-box"},placeholder:"Search..."});
  searchInp.value = state.librarySearch||"";
  searchInp.addEventListener("input",e=>setState({librarySearch:e.target.value}));
  toolbar.appendChild(searchInp);

  // SFW/NSFW filter
  const sfwRow = el("div",{style:{display:"flex",gap:"6px",overflowX:"auto"}});
  ["All","SFW","NSFW"].forEach(opt=>{
    const active=(state.librarySfwFilter||"All")===opt;
    const btn = el("button",{style:{padding:"6px 16px",borderRadius:"20px",border:"1px solid",borderColor:active?"#1c1c1e":borderCol,background:active?"#1c1c1e":"transparent",color:active?"#fff":"#6b7280",fontSize:"12px",cursor:"pointer",fontFamily:"monospace",whiteSpace:"nowrap",minHeight:"36px"}},opt);
    btn.addEventListener("click",()=>setState({librarySfwFilter:opt}));
    sfwRow.appendChild(btn);
  });
  // Folder filter
  const folderSelM = el("select",{style:{flex:1,border:"1px solid "+borderCol,borderRadius:"8px",padding:"6px 8px",fontSize:"12px",background:bg,color:state.darkMode?"#e5e5e5":"#1a1a1a",minHeight:"36px"}});
  const allFolderOpt = el("option",{value:"all"},"All Folders");
  if ((state.libraryFolder||"all")==="all") allFolderOpt.selected=true;
  folderSelM.appendChild(allFolderOpt);
  const buildFolderOpts = (parentId,depth) => {
    state.folders.filter(f=>f.parentId===parentId&&!f.locked).forEach(f=>{
      const opt = el("option",{value:f.id},"  ".repeat(depth)+f.name);
      if (state.libraryFolder===f.id) opt.selected=true;
      folderSelM.appendChild(opt);
      buildFolderOpts(f.id,depth+1);
    });
  };
  state.folders.filter(f=>f.locked).forEach(f=>buildFolderOpts(f.id,0));
  folderSelM.addEventListener("change",e=>setState({libraryFolder:e.target.value}));
  const filterRow = el("div",{style:{display:"flex",gap:"6px",alignItems:"center"}});
  filterRow.appendChild(sfwRow);
  filterRow.appendChild(folderSelM);
  toolbar.appendChild(filterRow);
  wrap.appendChild(toolbar);

  // Filter content
  const modelContent = state.model==="all"?state.content:state.content.filter(c=>c.modelId===state.model);
  const getFolderIds = fid => { if(fid==="all"||!fid) return null; const kids=state.folders.filter(f=>f.parentId===fid).map(f=>f.id); return [fid,...kids]; };
  const fids = getFolderIds(state.libraryFolder||"all");
  const sfwF = state.librarySfwFilter||"All";
  const filtered = modelContent.filter(c=>{
    const fOk=!fids||fids.includes(c.folderId);
    const sOk=!state.librarySearch||c.label.toLowerCase().includes(state.librarySearch.toLowerCase());
    const swOk=sfwF==="All"||c.sfwNsfw===sfwF;
    return fOk&&sOk&&swOk;
  });

  // Stats bar
  const statsBar = el("div",{style:{display:"flex",gap:"1px",background:borderCol,borderBottom:"1px solid "+borderCol}});
  [{l:"Total",v:modelContent.length},{l:"Unused",v:modelContent.filter(c=>!c.posts.length).length},{l:"Shown",v:filtered.length}].forEach(s=>{
    const cell = el("div",{style:{flex:1,padding:"8px 4px",textAlign:"center",background:cardBg}});
    cell.appendChild(el("div",{style:{fontSize:"16px",fontWeight:600,fontFamily:"monospace",color:state.darkMode?"#e5e5e5":"#1a1a1a"}},s.v));
    cell.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af"}},s.l));
    statsBar.appendChild(cell);
  });
  wrap.appendChild(statsBar);

  // Content grid
  const grid = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"10px",padding:"12px 16px"}});
  if (!filtered.length) {
    const empty = el("div",{style:{gridColumn:"1/-1",textAlign:"center",padding:"40px 20px",color:"#9ca3af"}});
    empty.appendChild(el("div",{style:{fontSize:"32px",marginBottom:"8px",opacity:0.3}},"[ ]"));
    empty.appendChild(el("div",{style:{fontSize:"14px",fontWeight:500,color:state.darkMode?"#aeaeb2":"#374151"}},"No content"));
    grid.appendChild(empty);
  } else {
    filtered.forEach(c=>{
      const card = el("div",{style:{background:cardBg,border:"1px solid "+borderCol,borderRadius:"10px",padding:"10px",cursor:"pointer",position:"relative"}});
      card.addEventListener("click",()=>setState({selectedContent:state.selectedContent===c.id?null:c.id}));
      if (c.sfwNsfw) {
        const badge = el("span",{style:{position:"absolute",top:"6px",left:"6px",fontSize:"9px",padding:"1px 5px",borderRadius:"20px",background:c.sfwNsfw==="SFW"?"#eff6ff":"#fef2f2",color:c.sfwNsfw==="SFW"?"#1d4ed8":"#b91c1c",fontWeight:600,fontFamily:"monospace"}},c.sfwNsfw);
        card.appendChild(badge);
      }
      // Thumbnail
      const thumb = el("div",{style:{width:"100%",aspectRatio:"4/3",borderRadius:"6px",background:"#f3f4f6",marginBottom:"7px",overflow:"hidden",position:"relative"}});
      if (c.driveId) {
        const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});
        img.onerror=()=>{img.style.display="none";};
        setThumbSrc(img, c.driveId);
        thumb.appendChild(img);
      }
      card.appendChild(thumb);
      card.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",color:state.darkMode?"#e5e5e5":"#1a1a1a",marginBottom:"5px"}},c.label));
      const pills = el("div",{style:{display:"flex",flexDirection:"column",gap:"2px"}});
      state.platforms.forEach(plat=>{
        const ps = getContentStatusForPlatform(c.id, plat.name);
        if (ps===null) {
          pills.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",background:"transparent",borderRadius:"4px",padding:"1px 5px",fontFamily:"monospace",border:"1px dashed #e5e7eb"}},plat.name+" — available"));
        } else if (ps==="posted") {
          pills.appendChild(el("div",{style:{fontSize:"9px",color:"#15803d",background:"#f0fdf4",borderRadius:"4px",padding:"1px 5px",fontFamily:"monospace"}},plat.name+" — posted"));
        } else if (ps==="scheduled") {
          pills.appendChild(el("div",{style:{fontSize:"9px",color:"#1d4ed8",background:"#eff6ff",borderRadius:"4px",padding:"1px 5px",fontFamily:"monospace"}},plat.name+" — scheduled"));
        } else if (ps==="missed") {
          pills.appendChild(el("div",{style:{fontSize:"9px",color:"#b91c1c",background:"#fef2f2",borderRadius:"4px",padding:"1px 5px",fontFamily:"monospace"}},plat.name+" — missed"));
        } else {
          pills.appendChild(el("div",{style:{fontSize:"9px",color:"#6b7280",background:"#f3f4f6",borderRadius:"4px",padding:"1px 5px",fontFamily:"monospace"}},plat.name+" — drafted"));
        }
      });
      card.appendChild(pills);
      grid.appendChild(card);
    });
  }
  wrap.appendChild(grid);

  // Upload FAB
  const fab = el("button",{style:{position:"fixed",bottom:"72px",right:"16px",background:"#1c1c1e",color:"#fff",border:"none",borderRadius:"50%",width:"52px",height:"52px",fontSize:"22px",cursor:"pointer",boxShadow:"0 4px 16px rgba(0,0,0,0.25)",zIndex:90,display:"flex",alignItems:"center",justifyContent:"center"}},"+");
  fab.addEventListener("click",()=>setState({showUpload:true}));
  wrap.appendChild(fab);

  return wrap;
}

  nameI.value = f.name||"";
  nameI.addEventListener("input",e=>{state.draftForm.name=e.target.value;state.draftNameOverridden=true;});
  const autoBtn2 = el("button",{style:{padding:"8px 12px",border:"1px solid "+borderCol,borderRadius:"8px",background:"transparent",color:textCol,fontSize:"12px",cursor:"pointer",whiteSpace:"nowrap",minHeight:"44px"}},"Auto");

  nameRow.appendChild(autoBtn2);
  nameCard.appendChild(nameRow);
  wrap.appendChild(nameCard);

  // Account settings

    state.draftForm.platform=v;
    const pla=state.accounts.find(a=>a.platform===v&&a.status==="active");
    state.draftForm.accountId=pla?.id||"";
    if(!state.draftNameOverridden) updateDraftName();
    render();
  }));
  accCard2.appendChild(el("div",{style:{height:"8px"}}));
  accCard2.appendChild(lbl("ACCOUNT"));
  const platAccsM = state.accounts.filter(a=>a.platform===f.platform&&a.status==="active");
  accCard2.appendChild(sel(f.accountId, platAccsM.map(a=>({value:a.id,label:a.sub+" — "+a.handle})), v=>{state.draftForm.accountId=v;if(!state.draftNameOverridden)updateDraftName();render();}));
  accCard2.appendChild(el("div",{style:{height:"8px"}}));
  accCard2.appendChild(lbl("TYPE"));
  accCard2.appendChild(sel(f.type, state.postTypes.map(t=>({value:t.id,label:t.name})), v=>{state.draftForm.type=v;if(!state.draftNameOverridden)updateDraftName();render();}));
  accCard2.appendChild(el("div",{style:{height:"8px"}}));
  accCard2.appendChild(lbl("STATUS"));
  accCard2.appendChild(sel(f.status, ["draft","scheduled","posted"].map(s=>({value:s,label:s})), v=>{state.draftForm.status=v;}));
  accCard2.appendChild(el("div",{style:{height:"8px"}}));
  accCard2.appendChild(lbl("SCHEDULE"));
  const schedI2 = el("input",{type:"datetime-local",style:{width:"100%",padding:"8px 10px",border:"1px solid "+borderCol,borderRadius:"8px",background:bg,color:textCol,fontSize:"13px",boxSizing:"border-box"}});
  schedI2.value=f.scheduledAt||"";
  schedI2.addEventListener("change",e=>{state.draftForm.scheduledAt=e.target.value;if(!state.draftNameOverridden)updateDraftName();});
  accCard2.appendChild(schedI2);
  wrap.appendChild(accCard2);

  // Content picker (compact)

  pickerCard.appendChild(lbl("CONTENT"));

  const pickerSrch = el("input",{style:{flex:1,padding:"6px 10px",border:"1px solid "+borderCol,borderRadius:"8px",background:bg,color:textCol,fontSize:"12px",boxSizing:"border-box"},placeholder:"Search..."});
  pickerSrch.value=state.draftPickerSearch||"";
  pickerSrch.addEventListener("input",e=>{state.draftPickerSearch=e.target.value;render();});
  pickerRow.appendChild(pickerSrch);
  ["All","SFW","NSFW"].forEach(opt=>{
    const active=(state.draftPickerSfw||"All")===opt;
    const b=el("button",{style:{padding:"6px 10px",borderRadius:"20px",border:"1px solid",borderColor:active?"#1c1c1e":borderCol,background:active?"#1c1c1e":"transparent",color:active?"#fff":"#6b7280",fontSize:"11px",cursor:"pointer",whiteSpace:"nowrap",minHeight:"36px"}},opt);
    b.addEventListener("click",()=>{state.draftPickerSfw=opt;render();});
    pickerRow.appendChild(b);
  });
  pickerCard.appendChild(pickerRow);
  const pickerSearch2=state.draftPickerSearch||"";
  const pickerSfw2=state.draftPickerSfw||"All";
  const filtM=mcM.filter(c=>{
    const sOk=!pickerSearch2||c.label.toLowerCase().includes(pickerSearch2.toLowerCase());
    const swOk=pickerSfw2==="All"||c.sfwNsfw===pickerSfw2;
    return sOk&&swOk;
  });
  const pickerListM=el("div",{style:{maxHeight:"260px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"4px"}});
  filtM.forEach(c=>{
    const isPicked=f.contentIds.includes(c.id);
    const posted=(c.posts||[]).filter(p=>state.accounts.find(a=>a.id===p.accountId)?.platform===f.platform);
    const isPosted=posted.length>0;
    const bdr=isPicked?"2px solid #1c1c1e":isPosted?"2px solid #f59e0b":"1px solid "+borderCol;
    const rbg=isPicked?(state.darkMode?"#3a3a3c":"#f9f9f9"):isPosted?"#fffbeb":"transparent";
    const row=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"8px",borderRadius:"8px",border:bdr,background:rbg,cursor:"pointer"}});
    row.addEventListener("click",()=>{
      if(isPicked){state.draftForm.contentIds=f.contentIds.filter(x=>x!==c.id);render();}
      else if(isPosted){
        const pn=posted.map(p=>p.postName||p.date).join(", ");
        if(confirm("Already posted as "+pn+". Use again?")){state.draftForm.contentIds=[...f.contentIds,c.id];render();}
      }else{state.draftForm.contentIds=[...f.contentIds,c.id];render();}
    });
    const th=el("div",{style:{width:"36px",height:"36px",borderRadius:"6px",background:"#f3f4f6",flexShrink:0,overflow:"hidden"}});
    if(c.driveId){const img=el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});img.onerror=()=>{img.style.display="none";};setThumbSrc(img,c.driveId);th.appendChild(img);}
    row.appendChild(th);
    const inf=el("div",{style:{flex:1,minWidth:0}});
    inf.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",color:textCol}},c.label));
    if(isPosted){const pn=posted.map(p=>p.postName||p.date).join(", ");inf.appendChild(el("div",{style:{fontSize:"10px",color:"#b45309",fontFamily:"monospace"}},"⚠ "+pn));}
    row.appendChild(inf);
    if(isPicked) row.appendChild(el("span",{style:{fontSize:"16px",color:"#22c55e",flexShrink:0}},"✓"));
    pickerListM.appendChild(row);
  });
  pickerCard.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",marginBottom:"4px",fontFamily:"monospace"}},filtM.length+" shown · "+f.contentIds.length+" selected"));
  pickerCard.appendChild(pickerListM);
  wrap.appendChild(pickerCard);

  // Selected content order & overlays
  if (f.contentIds.length) {
    const ovCard=card();
    ovCard.appendChild(lbl("ORDER & OVERLAYS"));
    f.contentIds.forEach((id,idx)=>{
      const c=state.content.find(x=>x.id===id);
      const row=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"8px",borderRadius:"8px",background:state.darkMode?"#1c1c1e":"#f9f9f9",marginBottom:"6px",border:"1px solid "+borderCol}});
      row.appendChild(el("span",{style:{fontSize:"12px",color:"#9ca3af",userSelect:"none",minWidth:"20px"}},(idx+1)+"."));
      const inf2=el("div",{style:{flex:1,minWidth:0}});
      inf2.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",color:textCol,marginBottom:"4px"}},c?.label||""));

      ovI.value=f.overlays[id]||"";
      ovI.addEventListener("input",e=>{state.draftForm.overlays[id]=e.target.value;});
      inf2.appendChild(ovI);
      row.appendChild(inf2);
      const remB=el("button",{style:{border:"none",background:"transparent",cursor:"pointer",color:"#9ca3af",fontSize:"18px",minWidth:"36px",minHeight:"36px",display:"flex",alignItems:"center",justifyContent:"center"}},"×");
      remB.addEventListener("click",()=>{state.draftForm.contentIds=f.contentIds.filter(x=>x!==id);render();});
      row.appendChild(remB);
      ovCard.appendChild(row);
    });
    wrap.appendChild(ovCard);
  }

  // Caption / hashtags
  const capCard=card();
  capCard.appendChild(lbl("CAPTION"));
  const capTA2=el("textarea",{style:{width:"100%",padding:"8px 10px",border:"1px solid "+borderCol,borderRadius:"8px",background:bg,color:textCol,fontSize:"13px",boxSizing:"border-box",resize:"vertical",minHeight:"80px"},rows:3,placeholder:"Write your caption..."});
  capTA2.value=f.caption||"";
  capTA2.addEventListener("input",e=>{state.draftForm.caption=e.target.value;});
  capCard.appendChild(capTA2);
  capCard.appendChild(el("div",{style:{height:"8px"}}));
  capCard.appendChild(lbl("HASHTAGS"));
  const hashI2=el("input",{style:{width:"100%",padding:"8px 10px",border:"1px solid "+borderCol,borderRadius:"8px",background:bg,color:textCol,fontSize:"13px",boxSizing:"border-box"},placeholder:"#fyp #pickleball"});
  hashI2.value=f.hashtags||"";
  hashI2.addEventListener("input",e=>{state.draftForm.hashtags=e.target.value;});
  capCard.appendChild(hashI2);
  wrap.appendChild(capCard);

  // Save / Clear
  const btnRow2=el("div",{style:{display:"flex",gap:"8px",paddingBottom:"8px"}});
  const isEdit2=!!state.editingDraft;
  const saveB2=el("button",{style:{flex:1,padding:"12px",border:"none",borderRadius:"10px",background:"#1c1c1e",color:"#fff",fontSize:"14px",fontWeight:600,cursor:"pointer",minHeight:"48px"}},isEdit2?"Save Changes":"Save Draft");
  saveB2.addEventListener("click",()=>{
    const draft={
      id:state.editingDraft?.id||"d"+Date.now(), name:f.name||autoName(f.platform,f.accountId,f.type,f.scheduledAt,1),
      accountId:f.accountId, platform:f.platform, type:f.type,
      contentIds:[...f.contentIds], overlays:f.contentIds.map(id=>f.overlays[id]||""),
      caption:f.caption, hashtags:f.hashtags, scheduledAt:f.scheduledAt, status:f.status, postOrder:1,
      metrics:state.editingDraft?.metrics||{views:0,likes:0,comments:0}
    };
    const newDrafts=isEdit2?state.drafts.map(d=>d.id===draft.id?draft:d):[...state.drafts,draft];
    let newContent=state.content;
    if(f.status==="posted"){
      newContent=state.content.map(c=>{
        if(!draft.contentIds.includes(c.id)) return c;
        const ap=(c.posts||[]).some(p=>p.accountId===draft.accountId&&p.date===draft.scheduledAt?.slice(0,10));
        if(ap) return c;
        return {...c,posts:[...(c.posts||[]),{accountId:draft.accountId,date:draft.scheduledAt?.slice(0,10)||"",postName:draft.name||"",views:0,likes:0,comments:0}]};
      });
    }
    setState({drafts:newDrafts,content:newContent,editingDraft:null,draftForm:{platform:"Instagram",accountId:"",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"},draftNameOverridden:false});
    if(isAuthenticated()) saveToSheets();
  });
  const clearB2=el("button",{style:{flex:1,padding:"12px",border:"1px solid "+(state.darkMode?"#3a3a3c":"#e5e7eb"),borderRadius:"10px",background:"transparent",color:state.darkMode?"#aeaeb2":"#6b7280",fontSize:"14px",cursor:"pointer",minHeight:"48px"}},isEdit2?"Cancel":"Clear");
  clearB2.addEventListener("click",()=>{
    setState({editingDraft:null,draftForm:{platform:"Instagram",accountId:"",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"},draftNameOverridden:false});
  });
  btnRow2.appendChild(saveB2);
  btnRow2.appendChild(clearB2);
  wrap.appendChild(btnRow2);

  return wrap;
}

  const statusOptsM = past?["posted","missed"]:["draft","scheduled","posted"];
  statusOptsM.forEach(s=>{
    const isActive=st===s;
    const sb=el("button",{style:{padding:"8px 14px",borderRadius:"20px",border:"1.5px solid",borderColor:isActive?SC[s]:"#e5e7eb",background:isActive?SBG[s]:"transparent",color:isActive?STX[s]:"#9ca3af",fontSize:"12px",fontWeight:isActive?"600":"400",cursor:"pointer",fontFamily:"monospace",minHeight:"40px"}},s);
    sb.addEventListener("click",()=>{
      let updatedContent=state.content;
      if(s==="posted"){
        updatedContent=state.content.map(c=>{
          if(!(d.contentIds||[]).includes(c.id)) return c;
          const ap=(c.posts||[]).some(p=>p.accountId===d.accountId&&p.date===d.scheduledAt?.slice(0,10));
          if(ap) return c;
          return {...c,posts:[...(c.posts||[]),{accountId:d.accountId,date:d.scheduledAt?.slice(0,10)||"",postName:d.name||"",views:0,likes:0,comments:0}]};
        });
      } else {
        updatedContent=state.content.map(c=>{
          if(!(d.contentIds||[]).includes(c.id)) return c;
          return {...c,posts:(c.posts||[]).filter(p=>p.accountId!==d.accountId||p.date!==d.scheduledAt?.slice(0,10))};
        });
      }
      setState({drafts:state.drafts.map(x=>x.id===d.id?{...x,status:s}:x),content:updatedContent,showDraftModal:{...d,status:s}});
      if(isAuthenticated()) saveToSheets();

  });
  sheet.appendChild(statusBtnsM);

  // Date/time
  sheet.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",letterSpacing:"0.06em",marginBottom:"6px"}},"DATE AND TIME"));

  dtI2.value=d.scheduledAt||"";
  dtI2.addEventListener("blur",e=>{
    const ns=e.target.value;
    if(!ns) return;
    const newSt=d.status==="posted"?"posted":(new Date(ns)>NOW?"scheduled":"missed");
    setState({drafts:state.drafts.map(x=>x.id===d.id?{...x,scheduledAt:ns,status:newSt}:x),showDraftModal:{...d,scheduledAt:ns,status:newSt}});
  });
  sheet.appendChild(dtI2);

  // Content slides (tap to open in Drive)
  if (con.length) {
    sheet.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",letterSpacing:"0.06em",marginBottom:"6px"}},"CONTENT"));
    con.forEach((c,i)=>{
      const cRow=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",background:state.darkMode?"#3a3a3c":"#f9f9f9",borderRadius:"8px",padding:"8px 10px",marginBottom:"6px",cursor:c.driveUrl?"pointer":"default"}});
      if(c.driveUrl) cRow.addEventListener("click",()=>window.open(c.driveUrl,"_blank"));
      const th=el("div",{style:{width:"44px",height:"44px",borderRadius:"8px",background:"#f3f4f6",flexShrink:0,overflow:"hidden",position:"relative"}});
      if(c.driveId){const img=el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});img.onerror=()=>{img.style.display="none";};setThumbSrc(img,c.driveId);th.appendChild(img);}
      cRow.appendChild(th);
      const ci=el("div",{style:{flex:1,minWidth:0}});
      ci.appendChild(el("div",{style:{fontSize:"12px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",color:textCol}},c.label));
      const ov=Array.isArray(d.overlays)?d.overlays[i]:d.overlays?.[c.id];
      if(ov) ci.appendChild(el("div",{style:{fontSize:"11px",color:"#6b7280",fontFamily:"monospace",marginTop:"2px"}},'"'+ov+'"'));
      cRow.appendChild(ci);
      if(c.driveUrl) cRow.appendChild(el("span",{style:{fontSize:"16px",color:"#3b82f6",flexShrink:0}},"↗"));
      sheet.appendChild(cRow);

  if(d.caption){sheet.appendChild(el("div",{style:{fontSize:"11px",color:textCol,lineHeight:1.4,marginBottom:"6px",marginTop:"10px"}},d.caption));}
  if(d.hashtags){sheet.appendChild(el("div",{style:{fontSize:"11px",color:"#3b82f6",fontFamily:"monospace",marginBottom:"12px"}},d.hashtags));}

  // Action buttons

  delB.addEventListener("click",()=>{
    if(!confirm("Delete this post?")) return;
    setState({drafts:state.drafts.filter(x=>x.id!==d.id),showDraftModal:null});
    if(isAuthenticated()) saveToSheets();
  });
  const editB=el("button",{style:{flex:1,padding:"10px",border:"1px solid "+(state.darkMode?"#3a3a3c":"#e5e7eb"),borderRadius:"8px",background:"transparent",color:textCol,fontSize:"13px",cursor:"pointer",minHeight:"44px"}},"Edit Post");
  editB.addEventListener("click",()=>{
    const ovObj={};
    (d.contentIds||[]).forEach((id,i)=>{ovObj[id]=d.overlays[i]||"";});
    setState({editingDraft:d,draftForm:{platform:d.platform,accountId:d.accountId,type:d.type,contentIds:[...d.contentIds],overlays:ovObj,caption:d.caption,hashtags:d.hashtags,scheduledAt:d.scheduledAt,name:d.name,status:d.status},draftNameOverridden:true,mobileTab:"draft",showDraftModal:null});
  });
  const doneB=el("button",{style:{flex:1,padding:"10px",border:"none",borderRadius:"8px",background:"#1c1c1e",color:"#fff",fontSize:"13px",fontWeight:600,cursor:"pointer",minHeight:"44px"}},"Done");
  doneB.addEventListener("click",()=>setState({showDraftModal:null}));
  actRow.appendChild(delB);
  actRow.appendChild(editB);
  actRow.appendChild(doneB);
  sheet.appendChild(actRow);

  overlay.appendChild(sheet);
  return overlay;
}

  wrap.appendChild(accFilter);

  // Posts for this day
  const dayPosts = state.drafts.filter(d=>{
    const dDate = d.scheduledAt?.slice(0,10);

  }).sort((a,b)=>new Date(a.scheduledAt)-new Date(b.scheduledAt));

          if (c.driveId) {
            const sImg = el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});
            sImg.onerror = ()=>{ sImg.style.display="none"; };
            setThumbSrc(sImg, c.driveId);
            sThumb.appendChild(sImg);

          slideRow.appendChild(sThumb);
          const sInfo = el("div",{style:{flex:1,minWidth:0}});
          sInfo.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",fontFamily:"monospace"}},c.label));
          const overlay = Array.isArray(d.overlays) ? d.overlays[i] : d.overlays?.[c.id];
          if (overlay) sInfo.appendChild(el("div",{style:{fontSize:"12px",fontWeight:500,color:"#1a1a1a",marginTop:"2px",fontStyle:"italic"}},'"'+overlay+'"'));
          slideRow.appendChild(sInfo);
          if (c.driveUrl) slideRow.appendChild(el("span",{style:{fontSize:"14px",color:"#3b82f6",flexShrink:0}},"↗"));
          slideSection.appendChild(slideRow);

      if (d.hashtags) {
        card.appendChild(el("div",{style:{fontSize:"11px",color:"#3b82f6",fontFamily:"monospace",marginBottom:"10px"}},d.hashtags));
      }

      // Status buttons
      const statusBtns = el("div",{style:{display:"flex",gap:"6px",marginBottom:"10px",flexWrap:"wrap"}});
      const statusOpts = past?["posted","missed"]:["draft","scheduled","posted"];
      statusOpts.forEach(s=>{

        const sBtn = el("button",{style:{padding:"6px 12px",borderRadius:"8px",border:"1.5px solid",borderColor:isActive?SC[s]:"#e5e7eb",background:isActive?SBG[s]:"transparent",color:isActive?STX[s]:"#9ca3af",fontSize:"11px",fontWeight:isActive?"600":"400",cursor:"pointer",fontFamily:"monospace"}},s);
        sBtn.addEventListener("click",()=>{
          const updatedDrafts = state.drafts.map(x=>x.id===d.id?{...x,status:s}:x);
          let updatedContent = state.content;
          // When marking as posted, record on content items
          if (s==="posted") {
            const acc = state.accounts.find(a=>a.id===d.accountId);
            updatedContent = state.content.map(c=>{
              if (!(d.contentIds||[]).includes(c.id)) return c;
              const alreadyPosted = c.posts?.some(p=>p.accountId===d.accountId&&p.date===d.scheduledAt?.slice(0,10));
              if (alreadyPosted) return c;
              return {...c, posts:[...(c.posts||[]),{accountId:d.accountId,date:d.scheduledAt?.slice(0,10)||"",postName:d.name||"",views:0,likes:0,comments:0}]};
            });
          }
          // When unmarking from posted, remove from content.posts
          if (s!=="posted" && getStatus({...d,status:s})!=="posted") {
            updatedContent = state.content.map(c=>{
              if (!(d.contentIds||[]).includes(c.id)) return c;
              return {...c, posts:(c.posts||[]).filter(p=>p.accountId!==d.accountId||p.date!==d.scheduledAt?.slice(0,10))};
            });
          }
          setState({drafts:updatedDrafts, content:updatedContent});
          if (isAuthenticated()) saveToSheets();
        });
        statusBtns.appendChild(sBtn);
      });
      card.appendChild(statusBtns);

      // Edit button → opens bottom sheet with date/time + full controls
      const editRowM = el("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:"4px"}});
      const editCardBtn = el("button",{style:{padding:"6px 14px",border:"1px solid "+(state.darkMode?"#3a3836":"#e5e7eb"),borderRadius:"8px",background:"transparent",color:state.darkMode?"#8e8c88":"#6b7280",fontSize:"11px",cursor:"pointer",fontFamily:"monospace"}},"Edit / Date ↗");
      editCardBtn.addEventListener("click",()=>setState({showDraftModal:d}));
      editRowM.appendChild(editCardBtn);
      card.appendChild(editRowM);

      postsWrap.appendChild(card);
    });
  }
  wrap.appendChild(postsWrap);
  return wrap;
}

function renderMobileMetrics() {
  const wrap = el("div",{style:{padding:"0"}});

  // Filters
  const filterBar = el("div",{style:{padding:"10px 16px",background:"#fff",borderBottom:"1px solid #f0f0f0",position:"sticky",top:0,zIndex:10}});

  // Account filter dropdown
  const accRow = el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}});
  accRow.appendChild(el("span",{style:{fontSize:"11px",color:"#9ca3af",whiteSpace:"nowrap"}},"Account:"));
  const metAccSel = el("select",{style:{flex:1,border:"1px solid #e5e7eb",borderRadius:"8px",padding:"6px 10px",fontSize:"12px",background:"#fff",color:"#1a1a1a"}});
  const metAllOpt = el("option",{value:"all"},"All Accounts");
  if (state.mobileMetricsAccount==="all") metAllOpt.selected=true;
  metAccSel.appendChild(metAllOpt);
  state.accounts.forEach(a=>{
    const opt = el("option",{value:a.id},a.sub+" ("+a.platform+")");
    if (state.mobileMetricsAccount===a.id) opt.selected=true;
    metAccSel.appendChild(opt);
  });
  metAccSel.addEventListener("change",e=>setState({mobileMetricsAccount:e.target.value}));
  accRow.appendChild(metAccSel);
  filterBar.appendChild(accRow);

  // Sort row
  const sortRow = el("div",{style:{display:"flex",gap:"6px",alignItems:"center"}});
  sortRow.appendChild(el("span",{style:{fontSize:"11px",color:"#9ca3af"}},"Sort:"));
  const sortSel = el("select",{style:{border:"1px solid #e5e7eb",borderRadius:"8px",padding:"4px 8px",fontSize:"11px",background:"#fff",flex:1}});
  [{value:"date",label:"Date"},{value:"views",label:"Views"},{value:"likes",label:"Likes"},{value:"comments",label:"Comments"},{value:"er",label:"Eng. Rate"}].forEach(o=>{
    const opt = el("option",{value:o.value},o.label);
    if (o.value===state.mobileMetricsSortBy) opt.selected=true;
    sortSel.appendChild(opt);
  });
  sortSel.addEventListener("change",e=>setState({mobileMetricsSortBy:e.target.value}));
  sortRow.appendChild(sortSel);
  const dirBtn = el("button",{style:{border:"1px solid #e5e7eb",borderRadius:"8px",padding:"4px 10px",background:"transparent",cursor:"pointer",fontSize:"11px",color:"#6b7280"}},state.mobileMetricsSortDir==="desc"?"Desc":"Asc");
  dirBtn.addEventListener("click",()=>setState({mobileMetricsSortDir:state.mobileMetricsSortDir==="desc"?"asc":"desc"}));
  sortRow.appendChild(dirBtn);
  filterBar.appendChild(sortRow);
  wrap.appendChild(filterBar);

  // Posts - use posted drafts same as web
  const mobPostedDrafts = state.drafts.filter(d=>{
    const st = getStatus(d);
    const aOk = state.mobileMetricsAccount==="all"||d.accountId===state.mobileMetricsAccount;
    return st==="posted" && aOk;
  });

  const allPosts = mobPostedDrafts.map(d=>{
    const acc = state.accounts.find(a=>a.id===d.accountId);
    const con = (d.contentIds||[]).map(id=>state.content.find(c=>c.id===id)).filter(Boolean);
    const metrics = d.metrics || {views:0,likes:0,comments:0};
    return {
      id:d.id, accountId:d.accountId,
      date:d.scheduledAt?.slice(0,10)||"",
      views:parseInt(metrics.views)||0,
      likes:parseInt(metrics.likes)||0,
      comments:parseInt(metrics.comments)||0,
      acc, content:con[0]||{label:d.name,driveId:null}, draft:d, type:d.type,
    };
  });

  const sorted = [...allPosts].sort((a,b)=>{
    let av,bv;
    if(state.mobileMetricsSortBy==="date"){av=new Date(a.date||0);bv=new Date(b.date||0);}
    else if(state.mobileMetricsSortBy==="views"){av=a.views||0;bv=b.views||0;}
    else if(state.mobileMetricsSortBy==="likes"){av=a.likes||0;bv=b.likes||0;}
    else if(state.mobileMetricsSortBy==="comments"){av=a.comments||0;bv=b.comments||0;}
    else{av=(a.likes+a.comments)/(a.acc?.followers||1);bv=(b.likes+b.comments)/(b.acc?.followers||1);}
    return state.mobileMetricsSortDir==="desc"?bv-av:av-bv;
  });

  const postsWrap = el("div",{style:{padding:"12px 16px"}});

  if (!sorted.length) {
    const empty = el("div",{style:{textAlign:"center",padding:"40px 20px",color:"#9ca3af"}});
    empty.appendChild(el("div",{style:{fontSize:"32px",marginBottom:"8px",opacity:0.3}},"📊"));
    empty.appendChild(el("div",{style:{fontSize:"14px",fontWeight:500,color:"#374151"}},"No posts yet"));
    postsWrap.appendChild(empty);
  } else {
    sorted.forEach(p=>{
      const er = pct(p.likes+p.comments,p.acc?.followers);
      const rr = pct(p.views,p.acc?.followers);
      const card = el("div",{style:{background:"#fff",borderRadius:"12px",padding:"12px",marginBottom:"10px",boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}});

      const header = el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}});
      if (p.driveId||p.content.driveId) {
        const thumb = el("div",{style:{width:"44px",height:"44px",borderRadius:"8px",background:"#f3f4f6",flexShrink:0,overflow:"hidden"}});
        const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover"}});
        img.onerror = ()=>{ img.style.display="none"; };
        setThumbSrc(img, p.content.driveId||p.driveId);
        thumb.appendChild(img);
        header.appendChild(thumb);
      }
      const info = el("div",{style:{flex:1,minWidth:0}});
      info.appendChild(el("div",{style:{fontSize:"12px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},p.content.label));
      const accRow2 = el("div",{style:{display:"flex",alignItems:"center",gap:"4px",marginTop:"2px"}});
      accRow2.appendChild(el("span",{style:{width:"6px",height:"6px",borderRadius:"50%",background:p.acc?.color||"#888",display:"inline-block"}}));
      accRow2.appendChild(el("span",{style:{fontSize:"10px",color:"#9ca3af"}},p.acc?.sub+" - "+p.date));
      info.appendChild(accRow2);
      header.appendChild(info);
      card.appendChild(header);

      // Metrics grid
      const metrics = el("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"6px"}});
      [["Views",fmt(p.views)],["Likes",fmt(p.likes)],["Comments",fmt(p.comments)],["ER",er]].forEach(([l,v])=>{
        const m = el("div",{style:{background:"#f9f9f9",borderRadius:"8px",padding:"6px 4px",textAlign:"center"}});
        m.appendChild(el("div",{style:{fontSize:"13px",fontWeight:600,fontFamily:"monospace",color:"#1a1a1a"}},v));
        m.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",marginTop:"1px"}},l));
        metrics.appendChild(m);
      });
      card.appendChild(metrics);
      postsWrap.appendChild(card);
    });
  }
  wrap.appendChild(postsWrap);
  return wrap;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function renderApp() {
  const app = div(state.darkMode?"app dark":"app",{});
  app.appendChild(renderSidebar());

  const main = div("main",{});

  // Mobile overlay when sidebar open
  if (window.innerWidth <= 768 && state.sidebarOpen) {
    const overlay = div("",{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:199});
    overlay.addEventListener("click",()=>setState({sidebarOpen:false}));
    app.appendChild(overlay);
  }

  // Topbar
  const topbar = div("topbar",{});

  // Hamburger for mobile
  const hamburger = el("button",{class:"mobile-nav",style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"20px",color:"#1a1a1a",padding:"4px 8px",marginRight:"8px"}},"☰");
  hamburger.addEventListener("click",()=>setState({sidebarOpen:!state.sidebarOpen}));
  topbar.appendChild(hamburger);
  const tabTitles = {dashboard:"Dashboard",library:"Content Library",draft:"Draft Post",calendar:"Calendar",posts:"Posts",swipe:"Swipe & Inspiration"};
  const titleWrap = div("",{});
  titleWrap.appendChild(el("div",{style:{fontSize:"15px",fontWeight:600,color:"#1a1a1a"}},tabTitles[state.tab]||""));
  titleWrap.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",marginTop:"1px"}},state.models.find(m=>m.id===state.model)?.label||""));
  topbar.appendChild(titleWrap);

  const topBtns = div("",{display:"flex",gap:"8px"});
  const uploadBtn = renderBtn("Quick Upload", false, ()=>setState({showUpload:true}));
  const draftBtn  = renderBtn("+ Draft Post", true, ()=>setState({tab:"draft",editingDraft:null,draftForm:{platform:"Instagram",accountId:"ig-main",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"},draftNameOverridden:false}));
  topBtns.appendChild(uploadBtn);
  topBtns.appendChild(draftBtn);
  topbar.appendChild(topBtns);
  main.appendChild(topbar);

  // Tab content
  const content = div("",{flex:1,overflow:"hidden"});
  if (state.tab==="dashboard") content.appendChild(renderDashboard());
  if (state.tab==="library")  content.appendChild(renderLibrary());
  if (state.tab==="draft")    content.appendChild(renderDraft());
  if (state.tab==="calendar") content.appendChild(renderCalendar());
  if (state.tab==="posts")    content.appendChild(renderMetrics());
  if (state.tab==="swipe")   content.appendChild(renderSwipe());
  main.appendChild(content);
  app.appendChild(main);

  // Modals
  if (state.showSettings)     app.appendChild(renderSettings());
  if (state.showConfirm)      app.appendChild(renderConfirm(state.showConfirm.message, state.showConfirm.onYes, ()=>setState({showConfirm:null})));
  if (state.showEditAccount)  app.appendChild(renderEditAccountModal(state.showEditAccount));
  if (state.showAddAccount)   app.appendChild(renderAddAccountModal());
  if (state.showUpload)       app.appendChild(renderUploadModal());

  // Mobile bottom nav
  if (window.innerWidth <= 768) {
    const bottomNav = div("",{
      position:"fixed",bottom:0,left:0,right:0,
      background:"#fff",borderTop:"1px solid #f0f0f0",
      display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom)"
    });
    [
      {id:"library",  label:"Library",  icon:"[lib]"},
      {id:"draft",    label:"Draft",    icon:"[+]"},
      {id:"calendar", label:"Calendar", icon:"[cal]"},
      {id:"dashboard",label:"Dash",     icon:"[d]"},
      {id:"posts",    label:"Posts",    icon:"[m]"},
    ].forEach(t=>{
      const isActive = state.tab===t.id;
      const btn = el("button",{style:{
        flex:1,padding:"10px 4px 8px",border:"none",background:"transparent",
        cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",
        color:isActive?"#1c1c1e":"#9ca3af",fontWeight:isActive?"600":"400"
      }});
      btn.appendChild(el("span",{style:{fontSize:"18px"}},t.icon));
      btn.appendChild(el("span",{style:{fontSize:"10px"}},t.label));
      btn.addEventListener("click",()=>setState({tab:t.id,sidebarOpen:false}));
      bottomNav.appendChild(btn);
    });
    app.appendChild(bottomNav);

    // Add padding to main content so bottom nav doesn't overlap
    main.style.paddingBottom = "65px";
  }

  return app;
}

// ── PWA INSTALL ───────────────────────────────────────────────────────────────
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Show install button if available
  setTimeout(render, 500);
});

// ── INIT ──────────────────────────────────────────────────────────────────────
// Restore token and tab from localStorage
(function restoreToken() {
  const token  = localStorage.getItem("cs_token");
  const expiry = localStorage.getItem("cs_token_expiry");
  if (token && expiry && new Date() < new Date(expiry)) {
    state.token      = token;
    state.tokenExpiry= expiry;
  }
  const savedTab = localStorage.getItem("cs_active_tab");
  if (savedTab) state.tab = savedTab;
})();
checkAuthCallback();
render();
window.addEventListener("resize", () => render());
// Don't auto-load - user clicks Load manually to avoid stale data overriding app state
</script>
</body>
</html>
