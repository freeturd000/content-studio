const NOW = new Date();

function getStatus(d) {
  if (d.status === "posted") return "posted";
  if (new Date(d.scheduledAt) < NOW) return "missed";
  return d.status === "draft" ? "draft" : "scheduled";
}
function isPast(s) { return new Date(s) < NOW; }

function folderPath(folderId, folders) {
  const f = folders.find(x => x.id === folderId);
  if (!f) return "";
  if (!f.parentId) return f.name;
  const p = folders.find(x => x.id === f.parentId);
  return p ? p.name + " > " + f.name : f.name;
}

function autoName(platform, accountId, type, date, order) {

// ── GOOGLE AUTH ───────────────────────────────────────────────────────────────
function isAuthenticated() {
  return state.token && state.tokenExpiry && new Date() < new Date(state.tokenExpiry);
}

function connectGoogle() {
  const redirectUri = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: redirectUri,
    response_type: "token",
    scope: SCOPES,
    include_granted_scopes: "true",
    prompt: "consent",
  });
  const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();

  // Store state so we can restore after redirect
  sessionStorage.setItem("cs_pre_auth_tab", state.tab);

  // Redirect in same window (more reliable than popup for GitHub Pages)
  window.location.href = authUrl;
}

function checkAuthCallback() {
  // Check if we are returning from OAuth redirect
  const hash = window.location.hash;
  if (hash && hash.includes("access_token")) {
    const params = new URLSearchParams(hash.slice(1));
    const token = params.get("access_token");
    const expiresIn = parseInt(params.get("expires_in") || "3600");
    const expiry = new Date(Date.now() + expiresIn * 1000).toISOString();
    // Clean URL
    history.replaceState(null, "", window.location.pathname);
    state.token = token;
    state.tokenExpiry = expiry;
    state.syncError = null;
    const savedTab = sessionStorage.getItem("cs_pre_auth_tab") || "library";
    state.tab = savedTab;
    sessionStorage.removeItem("cs_pre_auth_tab");
    render();
    loadFromSheets();
  }
}

function disconnectGoogle() {
  localStorage.removeItem("cs_token");
  localStorage.removeItem("cs_token_expiry");
  setState({token: null, tokenExpiry: null});
}

// ── SHEETS API ────────────────────────────────────────────────────────────────
async function sheetsGet(range) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`, {
    headers: {Authorization: "Bearer " + state.token}
  });
  if (!r.ok) throw new Error("Sheets read failed: " + r.status);
  const data = await r.json();
  return data.values || [];
}

async function sheetsSet(range, values) {
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=RAW`, {
    method: "PUT",
    headers: {Authorization: "Bearer " + state.token, "Content-Type": "application/json"},
    body: JSON.stringify({values})
  });
}

async function sheetsClear(range) {
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:clear`, {
    method: "POST",
    headers: {Authorization: "Bearer " + state.token}
  });
}

async function ensureSheet(name) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}`, {
    headers: {Authorization: "Bearer " + state.token}
  });
  const data = await r.json();
  const exists = data.sheets?.some(s => s.properties.title === name);
  if (!exists) {
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}:batchUpdate`, {
      method: "POST",
      headers: {Authorization: "Bearer " + state.token, "Content-Type": "application/json"},
      body: JSON.stringify({requests:[{addSheet:{properties:{title:name}}}]})
    });
  }
}

// ── LOAD FROM SHEETS ──────────────────────────────────────────────────────────
async function loadFromSheets() {
  if (!isAuthenticated()) return;
  setState({syncing: true, syncError: null});
  try {
    await Promise.all([
      ensureSheet("Models"), ensureSheet("Accounts"), ensureSheet("Platforms"),
      ensureSheet("PostTypes"), ensureSheet("Folders"), ensureSheet("Content"),
      ensureSheet("Drafts"), ensureSheet("Posts"),
    ]);

    const [modelsData, accountsData, platformsData, postTypesData, foldersData, contentData, draftsData, postsData] = await Promise.all([
      sheetsGet("Models!A2:C"), sheetsGet("Accounts!A2:J"), sheetsGet("Platforms!A2:C"),
      sheetsGet("PostTypes!A2:B"), sheetsGet("Folders!A2:D"), sheetsGet("Content!A2:I"),
      sheetsGet("Drafts!A2:L"), sheetsGet("Posts!A2:H"),
    ]);

    const models = modelsData.length ? modelsData.map(r => ({id:r[0],label:r[1]})) : state.models;
    if (!models.find(m => m.id === "all")) models.unshift({id:"all",label:"All Models"});

    const platforms = platformsData.length ? platformsData.map(r => ({id:r[0],name:r[1],color:r[2]||"#888"})) : state.platforms;
    const postTypes = postTypesData.length ? postTypesData.map(r => ({id:r[0],name:r[1]})) : state.postTypes;
    const accounts  = accountsData.length  ? accountsData.map(r  => ({id:r[0],handle:r[1],platform:r[2],sub:r[3],color:r[4],followers:parseInt(r[5])||0,status:r[6],modelId:r[7]})) : state.accounts;
    const folders   = foldersData.length   ? foldersData.map(r   => ({id:r[0],name:r[1],parentId:r[2]||null,sfwNsfw:r[3]||null,driveId:r[4]||null,locked:r[5]==='true'})) : state.folders;

    const postsMap = {};
    postsData.forEach(r => {
      const contentId = r[0];
      if (!postsMap[contentId]) postsMap[contentId] = [];
      postsMap[contentId].push({accountId:r[1],date:r[2],views:parseInt(r[3])||0,likes:parseInt(r[4])||0,comments:parseInt(r[5])||0});
    });

    const content = contentData.map(r => ({
      id:r[0], folderId:r[1], type:r[2], label:r[3], uploaded:r[4], icon:r[5]||"f",
      modelId:r[6], driveId:r[7]||null, driveUrl:r[8]||null, sfwNsfw:r[9]||null,
      thumbnailUrl:r[10]||null,
      posts: postsMap[r[0]] || [],
    }));

    const drafts = draftsData.map(r => ({
      id:r[0], name:r[1], accountId:r[2], platform:r[3], type:r[4],
      contentIds: r[5] ? r[5].split("|") : [],
      overlays:   r[6] ? r[6].split("|") : [],
      caption:r[7]||"", hashtags:r[8]||"", scheduledAt:r[9]||"", status:r[10]||"draft", postOrder:parseInt(r[11])||1,
    }));

    setState({models, platforms, postTypes, accounts, folders, content, drafts, syncing:false, lastSynced: new Date().toLocaleTimeString()});
  } catch(e) {
    setState({syncing:false, syncError: e.message});
  }
}

// ── SAVE TO SHEETS ────────────────────────────────────────────────────────────
async function saveToSheets() {
  if (!isAuthenticated()) return;
  setState({syncing: true});
  try {
    await sheetsClear("Models!A2:C");
    if (state.models.filter(m=>m.id!=="all").length) {
      await sheetsSet("Models!A2", state.models.filter(m=>m.id!=="all").map(m=>[m.id,m.label,""]));
    }

    await sheetsClear("Platforms!A2:C");
    if (state.platforms.length) await sheetsSet("Platforms!A2", state.platforms.map(p=>[p.id,p.name,p.color]));

    await sheetsClear("PostTypes!A2:B");
    if (state.postTypes.length) await sheetsSet("PostTypes!A2", state.postTypes.map(t=>[t.id,t.name]));

    await sheetsClear("Accounts!A2:J");
    if (state.accounts.length) await sheetsSet("Accounts!A2", state.accounts.map(a=>[a.id,a.handle,a.platform,a.sub,a.color,a.followers,a.status,a.modelId,"",""]));

    await sheetsClear("Folders!A2:D");
    if (state.folders.length) await sheetsSet("Folders!A2", state.folders.map(f=>[f.id,f.name,f.parentId||"",f.sfwNsfw||"",f.driveId||"",f.locked?'true':'']));

    await sheetsClear("Content!A2:I");
    if (state.content.length) await sheetsSet("Content!A2", state.content.map(c=>[c.id,c.folderId,c.type,c.label,c.uploaded,c.icon,c.modelId,c.driveId||"",c.driveUrl||"",c.sfwNsfw||"",c.thumbnailUrl||""]));

    await sheetsClear("Posts!A2:H");
    const postRows = state.content.flatMap(c => c.posts.map(p=>[c.id,p.accountId,p.date,p.views,p.likes,p.comments,"",""]));
    if (postRows.length) await sheetsSet("Posts!A2", postRows);

    await sheetsClear("Drafts!A2:L");
    if (state.drafts.length) await sheetsSet("Drafts!A2", state.drafts.map(d=>[
      d.id, d.name, d.accountId, d.platform, d.type,
      d.contentIds.join("|"), d.overlays.join("|"),
      d.caption, d.hashtags, d.scheduledAt, d.status, d.postOrder

    setState({syncing:false, lastSynced: new Date().toLocaleTimeString()});
  } catch(e) {
    setState({syncing:false, syncError: e.message});
  }
}

// ── DRIVE API ─────────────────────────────────────────────────────────────────
async function driveListFolder(folderId) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&orderBy=name`, {
    headers: {Authorization: "Bearer " + state.token}
  });
  const data = await r.json();
  return data.files || [];
}

async function driveCreateFolder(name, parentId) {
  const r = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: {Authorization: "Bearer " + state.token, "Content-Type": "application/json"},
    body: JSON.stringify({name, mimeType:"application/vnd.google-apps.folder", parents:[parentId]})
  });
  const data = await r.json();
  return data.id;
}

async function driveUploadFile(file, name, parentId) {
  const meta = JSON.stringify({name, parents:[parentId]});
  const form = new FormData();
  form.append("metadata", new Blob([meta], {type:"application/json"}));
  form.append("file", file);
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
    method: "POST",
    headers: {Authorization: "Bearer " + state.token},
    body: form
  });
  return await r.json();
}

async function driveCountFilesInFolder(folderId) {
  const files = await driveListFolder(folderId);
  return files.filter(f => f.mimeType !== "application/vnd.google-apps.folder").length;
}

// ── DRIVE FOLDER SYNC ─────────────────────────────────────────────────────────
async function syncDriveFolders(modelDriveId, sfwOrNsfw) {
  // Find or create 03 - Content > SFW/NSFW > 05 - Ready
  const modelContents = await driveListFolder(modelDriveId);
  let contentFolder = modelContents.find(f => f.name === "03 - Content");
  if (!contentFolder) { const id = await driveCreateFolder("03 - Content", modelDriveId); contentFolder = {id}; }

  const contentChildren = await driveListFolder(contentFolder.id);
  const sfwLabel = sfwOrNsfw === "SFW" ? "01 - SFW" : "02 - NSFW";
  let sfwFolder = contentChildren.find(f => f.name === sfwLabel);
  if (!sfwFolder) { const id = await driveCreateFolder(sfwLabel, contentFolder.id); sfwFolder = {id}; }

  const sfwChildren = await driveListFolder(sfwFolder.id);
  let readyFolder = sfwChildren.find(f => f.name === "05 - Ready");
  if (!readyFolder) { const id = await driveCreateFolder("05 - Ready", sfwFolder.id); readyFolder = {id}; }

  return readyFolder.id;
}

    await driveCreateFolder("02 - Inspiration", nsfwId);
    await driveCreateFolder("03 - Raw", nsfwId);
    await driveCreateFolder("04 - Edit", nsfwId);
    await driveCreateFolder("05 - Ready", nsfwId);
    await driveCreateFolder("04 - AI", folderId);

  } catch(e) {

}

// ── GET SFW/NSFW FOR FOLDER ──────────────────────────────────────────────────
function getFolderSfwNsfw(folderId) {
  let f = state.folders.find(x=>x.id===folderId);
  while (f) {
    if (f.sfwNsfw) return f.sfwNsfw;
    if (!f.parentId) break;
    f = state.folders.find(x=>x.id===f.parentId);
  }
  return "SFW";
}

// ── SCAN DRIVE ────────────────────────────────────────────────────────────────
async function scanDrive(modelId) {
  if (!isAuthenticated()) { alert("Connect Google first."); return; }
  setState({syncing:true, syncError:null});
  try {
    const modelObj = state.models.find(m=>m.id===modelId);
    if (!modelObj || modelObj.id==="all") { setState({syncing:false,syncError:"Select a specific model to scan."}); return; }
    const modelName = modelObj.label;

    // Find model folder in Drive
    const modelFiles = await driveListFolder(MODELS_FOLDER_ID);
    const modelDriveFolder = modelFiles.find(f=>f.name.toLowerCase().includes(modelName.toLowerCase()));
    if (!modelDriveFolder) { setState({syncing:false,syncError:"Model folder not found in Drive: "+modelName}); return; }

    // Get existing drive IDs so we dont re-import
    const existingDriveIds = new Set(state.content.map(c=>c.driveId).filter(Boolean));
    const newContent = [];

    // Scan both SFW and NSFW
    for (const sfwNsfw of ["SFW","NSFW"]) {
      const sfwLabel = sfwNsfw==="SFW"?"01 - SFW":"02 - NSFW";
      try {
        // Navigate to 03 - Content > SFW/NSFW > 05 - Ready
        const contentChildren = await driveListFolder(modelDriveFolder.id);
        const contentFolder = contentChildren.find(f=>f.name==="03 - Content");
        if (!contentFolder) continue;

        const sfwChildren = await driveListFolder(contentFolder.id);
        const sfwFolder = sfwChildren.find(f=>f.name===sfwLabel);
        if (!sfwFolder) continue;

        const readyChildren = await driveListFolder(sfwFolder.id);
        const readyFolder = readyChildren.find(f=>f.name==="05 - Ready");
        if (!readyFolder) continue;

        // Get top-level folders in Ready (Selfie, Lifestyle, etc.)
        const categoryFolders = await driveListFolder(readyFolder.id);

        for (const catFolder of categoryFolders) {
          if (catFolder.mimeType !== "application/vnd.google-apps.folder") continue;

          // Find or create matching app folder
          const catFolderName = catFolder.name.replace(/^[0-9]+\s*-\s*/,"").trim();
          let appCatFolder = state.folders.find(f=>f.name.toLowerCase()===catFolderName.toLowerCase()&&f.sfwNsfw===sfwNsfw);
          if (!appCatFolder) {
            // Try partial match
            appCatFolder = state.folders.find(f=>f.sfwNsfw===sfwNsfw&&!f.parentId&&(f.name.toLowerCase().includes(catFolderName.toLowerCase())||catFolderName.toLowerCase().includes(f.name.toLowerCase())));
          }

          // Get subfolders
          const subFolders = await driveListFolder(catFolder.id);
          const hasSubFolders = subFolders.some(f=>f.mimeType==="application/vnd.google-apps.folder");

          if (hasSubFolders) {
            for (const subFolder of subFolders) {
              if (subFolder.mimeType !== "application/vnd.google-apps.folder") continue;
              const subFolderName = subFolder.name.replace(/^\d+\s*-\s*/,"");

              // Find or create app subfolder
              let appSubFolder = state.folders.find(f=>f.name.toLowerCase()===subFolderName.toLowerCase()&&f.parentId===appCatFolder?.id);
              if (!appSubFolder && appCatFolder) {
                // Try partial match
                appSubFolder = state.folders.find(f=>f.parentId===appCatFolder?.id&&(f.name.toLowerCase().includes(subFolderName.toLowerCase())||subFolderName.toLowerCase().includes(f.name.toLowerCase())));
              }
              if (!appSubFolder && appCatFolder) {
                appSubFolder = {id:"f"+Date.now()+Math.random().toString(36).slice(2,6),name:subFolderName,parentId:appCatFolder.id,sfwNsfw,driveId:subFolder.id};
                state.folders.push(appSubFolder);
              }

              // Scan files in subfolder
              const files = await driveListFolder(subFolder.id);
              for (const file of files) {
                if (file.mimeType==="application/vnd.google-apps.folder") continue;
                if (existingDriveIds.has(file.id)) continue;
                const fileDetails = await fetch("https://www.googleapis.com/drive/v3/files/"+file.id+"?fields=id,name,webViewLink,thumbnailLink",{headers:{Authorization:"Bearer "+state.token}}).then(r=>r.json());
                // Determine best folder ID from filename e.g. LillyRose_selfie_bathroom_0001
                const parts = file.name.replace(/\.[^.]+$/,"").split("_");
                let bestFolderId = appSubFolder?.id||appCatFolder?.id||"f1";
                if (parts.length >= 3) {
                  const subName = parts[2].toLowerCase();
                  const matchedSub = state.folders.find(f=>f.name.toLowerCase()===subName&&f.parentId===appCatFolder?.id);
                  if (matchedSub) bestFolderId = matchedSub.id;
                }
                newContent.push({
                  id:"c"+Date.now()+Math.random().toString(36).slice(2,8),
                  folderId:bestFolderId,
                  type:"", label:file.name,
                  uploaded:new Date().toISOString().slice(0,10),
                  icon:"f", modelId, sfwNsfw,
                  driveId:file.id, driveUrl:fileDetails.webViewLink||"",
                  thumbnailUrl:fileDetails.thumbnailLink||"",
                  posts:[]
                });
                existingDriveIds.add(file.id);
              }
            }
          } else {
            // Files directly in category folder
            for (const file of subFolders) {
              if (file.mimeType==="application/vnd.google-apps.folder") continue;
              if (existingDriveIds.has(file.id)) continue;
              const fileDetails = await fetch("https://www.googleapis.com/drive/v3/files/"+file.id+"?fields=id,name,webViewLink,thumbnailLink",{headers:{Authorization:"Bearer "+state.token}}).then(r=>r.json());
              newContent.push({
                id:"c"+Date.now()+Math.random().toString(36).slice(2,8),
                folderId:appCatFolder?.id||"f1",
                type:"", label:file.name,
                uploaded:new Date().toISOString().slice(0,10),
                icon:"f", modelId, sfwNsfw,
                driveId:file.id, driveUrl:fileDetails.webViewLink||"",
                thumbnailUrl:fileDetails.thumbnailLink||"",
                posts:[]
              });
              existingDriveIds.add(file.id);
            }
          }
        }
      } catch(e) { console.warn("Scan error for "+sfwNsfw+":", e); }
    }

    const updatedContent = [...state.content, ...newContent];
    setState({content:updatedContent, syncing:false, lastSynced:new Date().toLocaleTimeString()});
    if (newContent.length) { await saveToSheets(); alert("Imported "+newContent.length+" new file(s)."); }
    else alert("No new files found.");
  } catch(e) {
    setState({syncing:false, syncError:e.message});
  }
}

// ── CREATE DRIVE FOLDER FOR APP FOLDER ───────────────────────────────────────
async function createDriveFolderForAppFolder(appFolder, modelId) {
  if (!isAuthenticated()) return null;
  try {
    const modelObj = state.models.find(m=>m.id===modelId);
    if (!modelObj || modelObj.id==="all") return null;
    const modelFiles = await driveListFolder(MODELS_FOLDER_ID);
    const modelDriveFolder = modelFiles.find(f=>f.name.toLowerCase().includes(modelObj.label.toLowerCase()));
    if (!modelDriveFolder) return null;

    const sfwNsfw = appFolder.sfwNsfw || getFolderSfwNsfw(appFolder.parentId);
    const readyFolderId = await syncDriveFolders(modelDriveFolder.id, sfwNsfw);

    // Find parent drive folder
    let parentDriveId = readyFolderId;
    if (appFolder.parentId && appFolder.parentId !== "sfw" && appFolder.parentId !== "nsfw") {
      const parentAppFolder = state.folders.find(f=>f.id===appFolder.parentId);
      if (parentAppFolder?.driveId) parentDriveId = parentAppFolder.driveId;
      else {
        // Try to find by name in ready folder
        const readyContents = await driveListFolder(readyFolderId);
        const match = readyContents.find(f=>f.name.toLowerCase().includes(parentAppFolder?.name.toLowerCase()||""));
        if (match) parentDriveId = match.id;
      }
    }

    const newDriveId = await driveCreateFolder(appFolder.name, parentDriveId);
    return newDriveId;
  } catch(e) { console.warn("createDriveFolderForAppFolder failed:", e); return null; }
}

// ── UPLOAD FILE ───────────────────────────────────────────────────────────────
async function uploadFile(file, folderId, modelName, category, subfolder, sfwNsfw) {
  if (!isAuthenticated()) return null;
  try {
    const folderFiles = await driveListFolder(folderId);
    const count = folderFiles.filter(f => f.mimeType !== "application/vnd.google-apps.folder").length;
    const nextNum = String(count + 1).padStart(4, "0");
    const ext = file.name.split(".").pop();
    const safeName = modelName.replace(/\s+/g,"");
    const safeCategory = category.toLowerCase().replace(/\s+/g,"-");
    const safeSubfolder = subfolder.toLowerCase().replace(/\s+/g,"-");
    const newName = safeName + "_" + safeCategory + "_" + safeSubfolder + "_" + nextNum + "." + ext;
    const result = await driveUploadFile(file, newName, folderId);
    return {name: newName, driveId: result.id, driveUrl: result.webViewLink};
  } catch(e) {
    console.error("Upload failed:", e);
    return null;
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild(renderApp());
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") e.className = v;
    else if (k === "checked" && tag === "input") e.checked = v;
    else if (k === "value" && (tag === "input" || tag === "select" || tag === "textarea")) { e.value = v || ""; }
    else if (k === "placeholder") e.placeholder = v;
    else if (k === "type") e.type = v;
    else if (k === "disabled") e.disabled = v;
    else if (k === "rows") e.rows = v;
    else e.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c === null || c === undefined) return;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Element) e.appendChild(c);
  });
  return e;
}

function txt(s) { return document.createTextNode(String(s||"")); }

function div(cls, style, ...children) {
  return el("div", {class:cls||"", style:style||{}}, ...children);
}

// ── COMPONENTS ────────────────────────────────────────────────────────────────

function renderDot(color, size) {
  return el("span", {class:"dot", style:{background:color||"#888",width:(size||7)+"px",height:(size||7)+"px"}});
}

function renderBadge(status) {
  return el("span", {class:"badge status-"+status}, status.toUpperCase());
}

function renderBtn(label, primary, onClick, extra) {
  const b = el("button", {class: primary?"btn-primary":"btn-secondary", onClick}, label);
  if (extra) Object.assign(b.style, extra);
  return b;
}

function renderInp(val, onChange, placeholder, type) {
  const i = el("input", {class:"inp", value:val, placeholder:placeholder||"", type:type||"text"});
  i.addEventListener("input", e => onChange(e.target.value));
  return i;
}

function renderSel(val, options, onChange) {
  const s = el("select", {class:"sel", value:val});
  options.forEach(o => {
    const opt = el("option", {value:o.value||o}, o.label||o);
    if ((o.value||o) === val) opt.selected = true;
    s.appendChild(opt);
  });
  s.addEventListener("change", e => onChange(e.target.value));
  return s;
}

function renderMultiSelect(label, options, selected, onChange) {
  const wrap = el("div", {style:{position:"relative",display:"inline-block",minWidth:"110px"}});
  const isAll = selected.length === 0;
  const display = isAll ? label : selected.length <= 2 ? selected.map(s=>options.find(o=>o.id===s)?.label||s).join(", ") : selected.length+" selected";

  const btn = el("button", {style:{padding:"5px 10px",border:"1px solid #e5e7eb",borderRadius:"8px",background:"#fff",fontSize:"11px",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",color:"#374151",whiteSpace:"nowrap"}}, display+" v");
  const dropdown = el("div", {style:{display:"none",position:"absolute",top:"100%",left:0,zIndex:999,background:"#fff",border:"1px solid #e5e7eb",borderRadius:"10px",boxShadow:"0 4px 20px rgba(0,0,0,0.1)",minWidth:"160px",marginTop:"4px",padding:"4px"}});

  const allLabel = el("label", {style:{display:"flex",alignItems:"center",gap:"8px",padding:"6px 10px",cursor:"pointer",borderRadius:"6px",background:isAll?"#f3f4f6":"transparent",borderBottom:"1px solid #f0f0f0",marginBottom:"2px"}});
  const allCheck = el("input", {type:"checkbox", style:{width:"12px",height:"12px",cursor:"pointer"}});
  allCheck.checked = isAll;
  allCheck.addEventListener("change", () => { onChange([]); dropdown.style.display="none"; });
  allLabel.appendChild(allCheck);
  allLabel.appendChild(txt("All"));
  dropdown.appendChild(allLabel);

  options.forEach(o => {
    const lbl = el("label", {style:{display:"flex",alignItems:"center",gap:"8px",padding:"6px 10px",cursor:"pointer",borderRadius:"6px",background:selected.includes(o.id)?"#f3f4f6":"transparent"}});
    const chk = el("input", {type:"checkbox", style:{width:"12px",height:"12px",cursor:"pointer"}});
    chk.checked = selected.includes(o.id);
    chk.addEventListener("change", () => {
      const next = selected.includes(o.id) ? selected.filter(x=>x!==o.id) : [...selected,o.id];
      onChange(next);
    });
    lbl.appendChild(chk);
    if (o.color) lbl.appendChild(renderDot(o.color, 6));
    lbl.appendChild(txt(o.label));
    dropdown.appendChild(lbl);
  });

  btn.addEventListener("click", e => { e.stopPropagation(); dropdown.style.display = dropdown.style.display==="none"?"block":"none"; });
  document.addEventListener("click", () => { dropdown.style.display="none"; }, {once:false});

  wrap.appendChild(btn);
  wrap.appendChild(dropdown);
  return wrap;
}

    const fBtn = el("button",{style:{display:"flex",alignItems:"center",flex:1,padding:"5px 4px",border:"none",borderRadius:"6px",background:isSel?"rgba(28,28,30,0.1)":"transparent",color:isLocked?"#374151":isSel?"#1c1c1e":"#6b7280",fontSize:isLocked?"12px":"11px",fontWeight:isLocked?"600":"400",cursor:"pointer",textAlign:"left",marginBottom:"1px",paddingLeft:(indent+4)+"px"}}, f.name);

    row.appendChild(fBtn);

    if (!isLocked) {
      const gearBtn = el("button",{style:{border:"none",background:"#f3f4f6",cursor:"pointer",color:"#6b7280",fontSize:"10px",padding:"1px 6px",borderRadius:"4px",opacity:0,transition:"opacity 0.15s",flexShrink:0}}, "...");
      row.addEventListener("mouseenter",()=>{ gearBtn.style.opacity="1"; });
      row.addEventListener("mouseleave",()=>{ gearBtn.style.opacity="0"; });
      gearBtn.addEventListener("click",e=>{
        e.stopPropagation();
        const menu = div("",{position:"fixed",background:"#fff",border:"1px solid #e5e7eb",borderRadius:"8px",boxShadow:"0 4px 16px rgba(0,0,0,0.1)",zIndex:999,minWidth:"140px",padding:"4px"});
        const rect = gearBtn.getBoundingClientRect();
        menu.style.top = rect.bottom+4+"px";
        menu.style.left = rect.left+"px";

        const menuItems = [
          {label:"Add subfolder", action:()=>{
            const name = prompt("Subfolder name:");
            if (!name) return;
            const newF = {id:"f"+Date.now(),name,parentId:f.id,sfwNsfw:f.sfwNsfw,driveId:null};
            state.folders.push(newF);
            f._expanded = true;
            if (isAuthenticated() && state.model!=="all") {
              createDriveFolderForAppFolder(newF, state.model).then(driveId=>{
                if(driveId){ newF.driveId=driveId; saveToSheets(); }
              });
            }
            render();
          }},
          {label:"Rename", action:()=>{
            const name = prompt("New name:", f.name);
            if (!name) return;
            setState({folders:state.folders.map(x=>x.id===f.id?{...x,name}:x)});
          }},
          {label:"Delete", action:()=>{
            if (!confirm("Delete folder "+f.name+"? Content will move to parent.")) return;
            const parentId = f.parentId;
            setState({
              folders:state.folders.filter(x=>x.id!==f.id),
              content:state.content.map(c=>c.folderId===f.id?{...c,folderId:parentId}:c),
              libraryFolder:state.libraryFolder===f.id?"all":state.libraryFolder
            });
          }},
        ];

        menuItems.forEach(item=>{
          const btn = el("button",{style:{display:"block",width:"100%",padding:"6px 10px",border:"none",background:"transparent",cursor:"pointer",textAlign:"left",fontSize:"12px",color:"#374151",borderRadius:"6px"}}, item.label);
          btn.addEventListener("mouseenter",()=>btn.style.background="#f3f4f6");
          btn.addEventListener("mouseleave",()=>btn.style.background="transparent");
          btn.addEventListener("click",()=>{ document.body.removeChild(menu); item.action(); });
          menu.appendChild(btn);
        });

        document.body.appendChild(menu);
        setTimeout(()=>{ const close=()=>{ if(document.body.contains(menu)) document.body.removeChild(menu); document.removeEventListener("click",close); }; document.addEventListener("click",close); },10);
      });
      row.appendChild(gearBtn);
    }

    wrap.appendChild(row);

    if (f._expanded) {
      kids.forEach(kid=>wrap.appendChild(renderFolderNode(kid, depth+1)));
    }
    return wrap;
  }

  // Render SFW, NSFW sections first, then non-sfwNsfw folders
  const sfwSection = state.folders.find(f=>f.id==="sfw");
  const nsfwSection = state.folders.find(f=>f.id==="nsfw");
  const otherRoots = state.folders.filter(f=>!f.parentId && f.id!=="sfw" && f.id!=="nsfw");

  if (sfwSection) { sfwSection._expanded = sfwSection._expanded !== false; folderSide.appendChild(renderFolderNode(sfwSection, 0)); }
  if (nsfwSection) { if(nsfwSection._expanded===undefined) nsfwSection._expanded=false; folderSide.appendChild(renderFolderNode(nsfwSection, 0)); }
  otherRoots.forEach(f=>{ folderSide.appendChild(renderFolderNode(f, 0)); });

  // Add folder
  const addFolderWrap = div("", {marginTop:"10px",borderTop:"1px solid #f0f0f0",paddingTop:"10px"});
  const addFolderBtn = el("button", {style:{display:"flex",alignItems:"center",gap:"5px",width:"100%",padding:"5px 8px",border:"1px dashed #e5e7eb",borderRadius:"7px",background:"transparent",color:"#9ca3af",fontSize:"11px",cursor:"pointer"}}, "+ New Folder");
  addFolderBtn.addEventListener("click", () => {
    const name = prompt("Folder name:");
    if (!name) return;
    const parentOptions = state.folders.filter(f=>!f.parentId).map(f=>f.name);
    let parentId = null;
    if (parentOptions.length) {
      const parentName = prompt("Parent folder? (leave blank for top level)\n"+parentOptions.join(", "));
      if (parentName) {
        const parent = state.folders.find(f=>f.name.toLowerCase()===parentName.toLowerCase());
        if (parent) parentId = parent.id;
      }
    }
    setState({folders:[...state.folders, {id:"f"+Date.now(),name,parentId,driveId:null}]});
  });
  addFolderWrap.appendChild(addFolderBtn);
  folderSide.appendChild(addFolderWrap);
  wrap.appendChild(folderSide);

  // Main content
  const main = div("", {flex:1,display:"flex",flexDirection:"column",overflow:"hidden"});

  // Toolbar
  const toolbar = div("", {padding:"10px 16px",background:"#fff",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:"8px",flexShrink:0,flexWrap:"wrap"});
  const breadcrumb = state.libraryFolder==="all" ? "All Content" : folderPath(state.libraryFolder, state.folders);
  toolbar.appendChild(el("span", {style:{fontSize:"13px",fontWeight:500,color:"#1a1a1a"}}, breadcrumb));

  const searchInp = el("input", {class:"inp",placeholder:"Search...",style:{width:"180px",marginLeft:"auto"}});
  searchInp.value = state.librarySearch;
  searchInp.addEventListener("input", e => setState({librarySearch:e.target.value}));
  toolbar.appendChild(searchInp);

  const scanBtn = renderBtn("Scan Drive", false, () => {
    if (state.model==="all") { alert("Select a specific model first."); return; }
    scanDrive(state.model);
  });
  const reassignBtn = renderBtn("Fix Folders", false, () => {
    let fixed = 0;
    const updatedContent = state.content.map(c => {
      const parts = c.label.replace(/\.[^.]+$/,"").split("_");
      if (parts.length < 3) return c;
      const catName = parts[1].toLowerCase();
      const subName = parts[2].toLowerCase();
      const catFolder = state.folders.find(f=>f.name.toLowerCase()===catName&&!f.parentId||f.name.toLowerCase()===catName);
      const subFolder = catFolder ? state.folders.find(f=>f.name.toLowerCase()===subName&&f.parentId===catFolder.id) : null;
      if (subFolder && subFolder.id !== c.folderId) { fixed++; return {...c, folderId:subFolder.id}; }
      return c;
    });
    setState({content:updatedContent});
    if (isAuthenticated()) saveToSheets();
    alert("Fixed "+fixed+" items.");
  });
  toolbar.appendChild(scanBtn);
  const uploadBtn = renderBtn("Upload", true, () => setState({showUpload:true}));
  toolbar.appendChild(uploadBtn);
  main.appendChild(toolbar);

  // Filter content
  const modelContent = state.model==="all" ? state.content : state.content.filter(c=>c.modelId===state.model);
  const getFolderIds = fid => { if(fid==="all") return null; const kids=state.folders.filter(f=>f.parentId===fid).map(f=>f.id); return [fid,...kids]; };
  const sfwF = state.librarySfwFilter||"All";
  const filtered = modelContent.filter(c => {
    const fids = getFolderIds(state.libraryFolder);
    const fOk = !fids||fids.includes(c.folderId);
    const sOk = !state.librarySearch||c.label.toLowerCase().includes(state.librarySearch.toLowerCase());
    const sfwOk = sfwF==="All"||c.sfwNsfw===sfwF||(!c.sfwNsfw&&sfwF==="All");
    return fOk&&sOk&&sfwOk;
  });

  // SFW/NSFW filter
  const sfwFilter = div("",{padding:"8px 16px 0",display:"flex",gap:"6px",flexShrink:0});
  ["All","SFW","NSFW"].forEach(opt=>{
    const active = (state.librarySfwFilter||"All")===opt;
    const btn = el("button",{style:{padding:"4px 14px",borderRadius:"20px",border:"1px solid",borderColor:active?"#1c1c1e":"#e5e7eb",background:active?"#1c1c1e":"transparent",color:active?"#fff":"#6b7280",fontSize:"11px",cursor:"pointer",fontFamily:"monospace",fontWeight:active?"600":"400"}},opt);
    btn.addEventListener("click",()=>setState({librarySfwFilter:opt}));
    sfwFilter.appendChild(btn);
  });
  main.appendChild(sfwFilter);

  // Stats
  const statsRow = div("grid4", {padding:"12px 16px 0",flexShrink:0});
  [{l:"Total",v:modelContent.length},{l:"Unused",v:modelContent.filter(c=>c.posts.length===0).length,c:"#22c55e"},{l:"Folders",v:state.folders.length},{l:"In View",v:filtered.length}].forEach(s => {
    const card = div("card", {padding:"10px 14px"});
    card.appendChild(el("div", {style:{fontSize:"22px",fontWeight:600,color:s.c||"#1a1a1a",fontFamily:"monospace"}}, s.v));
    card.appendChild(el("div", {style:{fontSize:"11px",color:"#9ca3af",marginTop:"2px"}}, s.l));
    statsRow.appendChild(card);
  });
  main.appendChild(statsRow);

  // Grid
  const contentArea = div("content-area", {});
  if (filtered.length === 0) {
    contentArea.appendChild(renderEmptyState("No content here", "Upload your first piece of content.", "Upload", () => setState({showUpload:true})));
  } else {
    const grid = div("", {display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:"10px"});
    filtered.forEach(c => {
      const igP = c.posts.filter(p=>state.accounts.find(a=>a.id===p.accountId)?.platform==="Instagram");
      const ttP = c.posts.filter(p=>state.accounts.find(a=>a.id===p.accountId)?.platform==="TikTok");
      const isSel = state.selectedContent===c.id;
      const card = div("card", {cursor:"pointer",border:isSel?"1.5px solid #1c1c1e":"1px solid #f0f0f0",position:"relative"});
      card.addEventListener("click", () => setState({selectedContent:isSel?null:c.id}));

      if (c.posts.length===0) {
        const badge = el("span", {style:{position:"absolute",top:"8px",right:"8px",fontSize:"9px",padding:"2px 6px",borderRadius:"20px",background:"#f0fdf4",color:"#15803d",fontWeight:600,fontFamily:"monospace"}}, "UNUSED");
        card.appendChild(badge);
      }
      if (c.sfwNsfw) {
        const sfwBadge = el("span",{style:{position:"absolute",top:"8px",left:"8px",fontSize:"9px",padding:"2px 6px",borderRadius:"20px",background:c.sfwNsfw==="SFW"?"#eff6ff":"#fef2f2",color:c.sfwNsfw==="SFW"?"#1d4ed8":"#b91c1c",fontWeight:600,fontFamily:"monospace"}}, c.sfwNsfw);
        card.appendChild(sfwBadge);
      }

      const thumb = div("", {width:"100%",aspectRatio:"4/3",borderRadius:"8px",background:"#f8f8f7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",color:"#9ca3af",marginBottom:"8px",fontWeight:500,overflow:"hidden",position:"relative"});
      const thumbColors = {f:"#fce7f3",s:"#eff6ff",c:"#f0fdf4"};
      const thumbLabels = {f:"Photo",s:"Slide",c:"Carousel"};
      thumb.style.background = thumbColors[c.icon]||"#f3f4f6";
      if (c.thumbnailUrl) {
        const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover",position:"absolute",top:0,left:0}});
        img.src = c.thumbnailUrl;
        img.onerror = ()=>{ img.style.display="none"; };
        thumb.appendChild(img);
      } else {
        thumb.appendChild(txt(thumbLabels[c.icon]||"File"));
      }
      card.appendChild(thumb);
      // No type/path label - just filename and badges
      card.appendChild(el("div", {style:{fontSize:"12px",fontWeight:500,lineHeight:1.3,marginBottom:"8px",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}, c.label));

      const pills = div("", {display:"flex",flexDirection:"column",gap:"3px"});
      if (igP.length) igP.forEach(p=>{const a=state.accounts.find(x=>x.id===p.accountId);pills.appendChild(el("div",{style:{fontSize:"10px",color:"#be185d",background:"#fce7f3",borderRadius:"5px",padding:"2px 7px",fontFamily:"monospace"}},"IG - "+(a?.sub||"")+" - "+p.date));});
      else pills.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",background:"#f9fafb",borderRadius:"5px",padding:"2px 7px",fontFamily:"monospace",border:"1px dashed #e5e7eb"}},"IG - not posted"));
      if (ttP.length) ttP.forEach(p=>{const a=state.accounts.find(x=>x.id===p.accountId);pills.appendChild(el("div",{style:{fontSize:"10px",color:"#374151",background:"#f3f4f6",borderRadius:"5px",padding:"2px 7px",fontFamily:"monospace"}},"TT - "+(a?.sub||"")+" - "+p.date));});
      else pills.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",background:"#f9fafb",borderRadius:"5px",padding:"2px 7px",fontFamily:"monospace",border:"1px dashed #e5e7eb"}},"TT - not posted"));
      card.appendChild(pills);
      grid.appendChild(card);
    });
    contentArea.appendChild(grid);
  }
  main.appendChild(contentArea);
  wrap.appendChild(main);

  // Detail panel
  const sel = state.selectedContent ? state.content.find(c=>c.id===state.selectedContent) : null;
  if (sel) {
    const panel = div("", {width:"260px",background:"#fff",borderLeft:"1px solid #f0f0f0",overflowY:"auto",flexShrink:0});
    const panelHeader = div("", {padding:"12px 14px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",justifyContent:"space-between"});
    panelHeader.appendChild(el("span", {style:{fontSize:"13px",fontWeight:500}}, "Detail"));
    const closeBtn = el("button", {style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"16px",color:"#9ca3af"}}, "x");
    closeBtn.addEventListener("click", () => setState({selectedContent:null}));
    panelHeader.appendChild(closeBtn);
    panel.appendChild(panelHeader);

    const panelBody = div("", {padding:"14px"});
    const thumbP = div("", {width:"100%",aspectRatio:"9/12",borderRadius:"10px",background:"#f8f8f7",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"13px",color:"#9ca3af",marginBottom:"12px",overflow:"hidden",position:"relative"});
    if (sel.thumbnailUrl) {
      const img = el("img",{style:{width:"100%",height:"100%",objectFit:"cover",position:"absolute",top:0,left:0}});
      img.src = sel.thumbnailUrl;
      img.onerror = ()=>{ img.style.display="none"; thumbP.appendChild(txt("Image")); };
      thumbP.appendChild(img);
    } else {
      thumbP.appendChild(txt("Image"));
    }
    panelBody.appendChild(thumbP);
    panelBody.appendChild(el("div", {style:{fontSize:"13px",fontWeight:500,marginBottom:"3px"}}, sel.label));
    panelBody.appendChild(el("div", {style:{fontSize:"11px",color:"#9ca3af",fontFamily:"monospace",marginBottom:"10px"}}, folderPath(sel.folderId,state.folders)+(sel.sfwNsfw?" - "+sel.sfwNsfw:"")));

    if (sel.driveUrl) {
      const driveLink = el("a", {style:{fontSize:"11px",color:"#3b82f6",display:"block",marginBottom:"10px",wordBreak:"break-all"}}, "View in Drive");
      driveLink.href = sel.driveUrl;
      driveLink.target = "_blank";
      panelBody.appendChild(driveLink);
    }

    const actionRow = div("", {display:"flex",gap:"5px",marginBottom:"12px"});
    const moveBtn = renderBtn("Move", false, () => {
      const opts = state.folders.map(f=>folderPath(f.id,state.folders)).join("\n");
      const dest = prompt("Move to folder:\n"+opts);
      if (!dest) return;
      const target = state.folders.find(f=>folderPath(f.id,state.folders).toLowerCase()===dest.toLowerCase());
      if (target) { setState({content:state.content.map(c=>c.id===sel.id?{...c,folderId:target.id}:c)}); }
    }, {fontSize:"11px",padding:"4px 10px"});
    const delBtn = el("button", {class:"btn-danger"}, "Delete");
    delBtn.addEventListener("click", () => setState({showConfirm:{message:"Delete this content?",onYes:()=>setState({content:state.content.filter(c=>c.id!==sel.id),selectedContent:null,showConfirm:null})}}));
    actionRow.appendChild(moveBtn);
    actionRow.appendChild(delBtn);
    panelBody.appendChild(actionRow);

    panelBody.appendChild(el("div", {class:"section-title"}, "POSTED ON"));
    if (!sel.posts.length) panelBody.appendChild(el("div",{style:{fontSize:"12px",color:"#9ca3af",marginBottom:"10px"}},"Not posted anywhere yet"));
    sel.posts.forEach(p => {
      const acc = state.accounts.find(a=>a.id===p.accountId);
      const pCard = div("", {background:"#f9fafb",borderRadius:"8px",padding:"8px 10px",marginBottom:"6px"});
      const pRow = div("", {display:"flex",alignItems:"center",gap:"6px",marginBottom:"5px"});
      pRow.appendChild(renderDot(acc?.color));
      pRow.appendChild(el("span",{style:{fontSize:"11px",fontWeight:500}},acc?.sub||""));
      pRow.appendChild(el("span",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginLeft:"auto"}},p.date));
      pCard.appendChild(pRow);
      pCard.appendChild(el("div",{style:{fontSize:"10px",color:"#6b7280",fontFamily:"monospace"}},"Views "+fmt(p.views)+" Likes "+fmt(p.likes)+" ER "+pct(p.likes+p.comments,acc?.followers)));
      panelBody.appendChild(pCard);
    });

    panelBody.appendChild(el("div", {class:"section-title",style:{marginTop:"12px"}}, "AVAILABLE FOR"));
    state.accounts.filter(a=>!sel.posts.some(p=>state.accounts.find(x=>x.id===p.accountId)?.platform===a.platform)).forEach(a => {
      const row = div("", {display:"flex",alignItems:"center",gap:"7px",padding:"6px 8px",border:"1px dashed #e5e7eb",borderRadius:"8px",marginBottom:"5px"});
      row.appendChild(renderDot(a.color));
      row.appendChild(el("span",{style:{fontSize:"11px"}},a.sub));
      row.appendChild(el("span",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginLeft:"auto"}},a.platform));
      panelBody.appendChild(row);
    });

    panel.appendChild(panelBody);
    wrap.appendChild(panel);
  }

  return wrap;
}

// ── UPLOAD MODAL ──────────────────────────────────────────────────────────────
function renderUploadModal() {
  let selectedFile = null;
  let selectedFolder = "";
  let selectedSFW = "SFW";
  let uploadStatus = "";

  const overlay = div("overlay", {});
  const modal = div("modal", {width:"420px"});

  const header = div("", {display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px"});
  header.appendChild(el("span",{style:{fontSize:"14px",fontWeight:600}},"Upload Content"));
  const closeBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"18px",color:"#9ca3af"}},"x");
  closeBtn.addEventListener("click", () => setState({showUpload:false}));
  header.appendChild(closeBtn);
  modal.appendChild(header);

  // Model
  const modelRow = div("",{marginBottom:"10px"});
  modelRow.appendChild(el("span",{class:"lbl"},"MODEL"));
  const modelSel = renderSel(state.model==="all"?(state.models[1]?.id||""):(state.model), state.models.filter(m=>m.id!=="all").map(m=>({value:m.id,label:m.label})), v=>{});
  modelRow.appendChild(modelSel);
  modal.appendChild(modelRow);

  // SFW/NSFW
  const sfwRow = div("",{marginBottom:"10px"});
  sfwRow.appendChild(el("span",{class:"lbl"},"CONTENT TYPE"));
  const sfwWrap = div("",{display:"flex",gap:"6px"});
  ["SFW","NSFW"].forEach(opt => {
    const btn = el("button",{style:{flex:1,padding:"7px",border:"1.5px solid",borderColor:selectedSFW===opt?"#1c1c1e":"#e5e7eb",borderRadius:"8px",background:selectedSFW===opt?"#1c1c1e":"transparent",color:selectedSFW===opt?"#fff":"#6b7280",cursor:"pointer",fontSize:"12px",fontWeight:500}},opt);
    btn.addEventListener("click", () => { selectedSFW=opt; sfwWrap.querySelectorAll("button").forEach((b,i)=>{ const o=["SFW","NSFW"][i]; Object.assign(b.style,{borderColor:o===opt?"#1c1c1e":"#e5e7eb",background:o===opt?"#1c1c1e":"transparent",color:o===opt?"#fff":"#6b7280"}); }); });
    sfwWrap.appendChild(btn);
  });
  sfwRow.appendChild(sfwWrap);
  modal.appendChild(sfwRow);

  // Folder
  const folderRow = div("",{marginBottom:"10px"});
  folderRow.appendChild(el("span",{class:"lbl"},"FOLDER"));
  const folderSel = renderSel("", state.folders.map(f=>({value:f.id,label:folderPath(f.id,state.folders)})), v=>{ selectedFolder=v; });
  folderRow.appendChild(folderSel);
  modal.appendChild(folderRow);

  // File picker
  const fileRow = div("",{marginBottom:"16px"});
  fileRow.appendChild(el("span",{class:"lbl"},"FILE"));
  const fileInp = el("input",{type:"file",class:"inp",style:{padding:"5px"}});
  fileInp.addEventListener("change", e=>{ selectedFile=e.target.files[0]; });
  fileRow.appendChild(fileInp);
  modal.appendChild(fileRow);

  // Status
  const statusEl = el("div",{style:{fontSize:"12px",color:"#6b7280",marginBottom:"10px",minHeight:"18px"}});
  modal.appendChild(statusEl);

  // Upload btn
  const upBtn = renderBtn("Upload to Drive", true, async () => {
    if (!selectedFile) { statusEl.textContent="Please select a file."; return; }
    if (!selectedFolder) { statusEl.textContent="Please select a folder."; return; }
    if (!isAuthenticated()) { statusEl.textContent="Please connect Google first."; return; }

    upBtn.textContent="Uploading...";
    upBtn.disabled=true;
    statusEl.textContent="Finding Drive folder...";

    try {
      const modelId = modelSel.value;
      const modelObj = state.models.find(m=>m.id===modelId);
      const modelName = modelObj?.label||"Model";

      // Find model folder in Drive
      const modelFiles = await driveListFolder(MODELS_FOLDER_ID);
      const modelDriveFolder = modelFiles.find(f=>f.name.toLowerCase().includes(modelName.toLowerCase()));

      if (!modelDriveFolder) { statusEl.textContent="Model folder not found in Drive. Create it first."; upBtn.textContent="Upload to Drive"; upBtn.disabled=false; return; }

      statusEl.textContent="Finding ready folder...";
      const readyFolderId = await syncDriveFolders(modelDriveFolder.id, selectedSFW);

      // Find subfolder in ready
      const folderObj = state.folders.find(f=>f.id===selectedFolder);
      const subfolderName = folderObj?.name||"";
      const readyContents = await driveListFolder(readyFolderId);
      let subDriveFolder = readyContents.find(f=>f.name.toLowerCase().includes(subfolderName.toLowerCase()));
      if (!subDriveFolder) {
        const newId = await driveCreateFolder(subfolderName, readyFolderId);
        subDriveFolder = {id:newId};
      }

      // Get parent folder name for naming
      const parentFolder = folderObj?.parentId ? state.folders.find(f=>f.id===folderObj.parentId) : null;
      const categoryName = parentFolder?.name||folderObj?.name||"content";

      statusEl.textContent="Uploading file...";
      const result = await uploadFile(selectedFile, subDriveFolder.id, modelName, categoryName, subfolderName, selectedSFW);

      if (result) {
        const newContent = {
          id:"c"+Date.now(), folderId:selectedFolder, type:"Story",
          label:result.name, uploaded:new Date().toISOString().slice(0,10),
          icon:"f", modelId:modelId, driveId:result.driveId, driveUrl:result.driveUrl, posts:[]
        };
        setState({content:[...state.content,newContent],showUpload:false});
        if (isAuthenticated()) saveToSheets();
      } else {
        statusEl.textContent="Upload failed. Try again.";
        upBtn.textContent="Upload to Drive"; upBtn.disabled=false;
      }
    } catch(e) {
      statusEl.textContent="Error: "+e.message;
      upBtn.textContent="Upload to Drive"; upBtn.disabled=false;
    }
  });
  modal.appendChild(upBtn);
  overlay.appendChild(modal);
  return overlay;
}

// ── DRAFT POST ────────────────────────────────────────────────────────────────
function renderDraft() {
  const f = state.draftForm;
  const isEdit = !!state.editingDraft;
  const wrap = div("",{display:"flex",height:"100%",overflow:"hidden"});
  const formArea = div("content-area",{maxWidth:"560px"});

  if (isEdit) {
    const editBanner = div("",{background:"#eff6ff",color:"#1d4ed8",borderRadius:"8px",padding:"8px 14px",marginBottom:"12px",fontSize:"12px",display:"flex",alignItems:"center",justifyContent:"space-between"});
    editBanner.appendChild(txt("Editing draft"));
    const cancelEdit = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",color:"#1d4ed8",fontSize:"12px"}},"Cancel");
    cancelEdit.addEventListener("click", () => setState({editingDraft:null, draftForm:{platform:"Instagram",accountId:"ig-main",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"}, draftNameOverridden:false}));
    editBanner.appendChild(cancelEdit);
    formArea.appendChild(editBanner);
  }

  // Post name
  const nameCard = div("card",{marginBottom:"12px"});
  nameCard.appendChild(el("span",{class:"lbl"},"POST NAME"));
  const nameRow = div("",{display:"flex",gap:"6px"});
  const nameInp = el("input",{class:"inp",style:{fontFamily:"monospace",fontSize:"11px"},value:f.name,placeholder:"Auto-generated..."});
  nameInp.addEventListener("input", e => { state.draftForm.name=e.target.value; state.draftNameOverridden=true; });
  const autoBtn = renderBtn("Auto", false, () => { state.draftNameOverridden=false; updateDraftName(); render(); }, {flexShrink:0,fontSize:"11px"});
  nameRow.appendChild(nameInp);
  nameRow.appendChild(autoBtn);
  nameCard.appendChild(nameRow);
  formArea.appendChild(nameCard);

  // Account settings
  const accCard = div("card",{marginBottom:"12px"});
  const accGrid = div("grid2",{marginBottom:"10px"});

  const platWrap = div("",{});
  platWrap.appendChild(el("span",{class:"lbl"},"PLATFORM"));
  const platSel = renderSel(f.platform, state.platforms.map(p=>({value:p.name,label:p.name})), v => {
    state.draftForm.platform=v;
    state.draftForm.accountId = state.accounts.find(a=>a.platform===v&&a.status==="active")?.id||"";
    if (!state.draftNameOverridden) updateDraftName();
    render();
  });
  platWrap.appendChild(platSel);
  accGrid.appendChild(platWrap);

  const accWrap2 = div("",{});
  accWrap2.appendChild(el("span",{class:"lbl"},"ACCOUNT"));
  const platAccs = state.accounts.filter(a=>a.platform===f.platform&&a.status==="active");
  const accSel2 = renderSel(f.accountId, platAccs.map(a=>({value:a.id,label:a.sub+" - "+a.handle})), v => { state.draftForm.accountId=v; if(!state.draftNameOverridden) updateDraftName(); render(); });
  accWrap2.appendChild(accSel2);
  accGrid.appendChild(accWrap2);
  accCard.appendChild(accGrid);

  const typeGrid = div("grid3",{});
  const typeWrap = div("",{});
  typeWrap.appendChild(el("span",{class:"lbl"},"TYPE"));
  const typeSel = renderSel(f.type, state.postTypes.map(t=>({value:t.id,label:t.name})), v => { state.draftForm.type=v; if(!state.draftNameOverridden) updateDraftName(); render(); });
  typeWrap.appendChild(typeSel);
  typeGrid.appendChild(typeWrap);

  const statWrap = div("",{});
  statWrap.appendChild(el("span",{class:"lbl"},"STATUS"));
  const statSel = renderSel(f.status, ["draft","scheduled","posted"].map(s=>({value:s,label:s})), v=>{ state.draftForm.status=v; });
  statWrap.appendChild(statSel);
  typeGrid.appendChild(statWrap);

  const schedWrap = div("",{});
  schedWrap.appendChild(el("span",{class:"lbl"},"SCHEDULE"));
  const schedInp = el("input",{type:"datetime-local",class:"inp",value:f.scheduledAt});
  schedInp.addEventListener("change", e=>{ state.draftForm.scheduledAt=e.target.value; if(!state.draftNameOverridden) updateDraftName(); });
  schedWrap.appendChild(schedInp);
  typeGrid.appendChild(schedWrap);
  accCard.appendChild(typeGrid);
  formArea.appendChild(accCard);

  // Content selection
  const contentCard = div("card",{marginBottom:"12px"});
  contentCard.appendChild(el("span",{class:"lbl"},"SELECT CONTENT - not used on "+f.platform));
  const modelContent = state.model==="all"?state.content:state.content.filter(c=>c.modelId===state.model);
  const available = modelContent.filter(c=>!c.posts.some(p=>state.accounts.find(a=>a.id===p.accountId)?.platform===f.platform));
  if (!available.length) {
    contentCard.appendChild(renderEmptyState("No available content","All content used on "+f.platform+".","",null));
  } else {
    available.forEach(c => {
      const isPicked = f.contentIds.includes(c.id);
      const row = div("",{display:"flex",alignItems:"center",gap:"8px",padding:"8px 10px",borderRadius:"8px",border:isPicked?"1.5px solid #1c1c1e":"1px solid #e5e7eb",background:isPicked?"#f9f9f9":"#fff",cursor:"pointer",marginBottom:"5px"});
      row.addEventListener("click", () => {
        state.draftForm.contentIds = isPicked ? f.contentIds.filter(x=>x!==c.id) : [...f.contentIds,c.id];
        render();
      });
      const thumb = div("",{width:"28px",height:"28px",borderRadius:"6px",background:"#f3f4f6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:"#9ca3af",flexShrink:0});
      thumb.appendChild(txt(c.type[0]));
      row.appendChild(thumb);
      const info = div("",{flex:1,minWidth:0});
      info.appendChild(el("div",{style:{fontSize:"12px",fontWeight:500,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},c.label));
      info.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace"}},c.type));
      row.appendChild(info);
      if (isPicked) row.appendChild(el("span",{style:{fontSize:"12px",color:"#1c1c1e"}},"OK"));
      contentCard.appendChild(row);
    });
  }
  formArea.appendChild(contentCard);

  // Overlays
  if (f.contentIds.length) {
    const overlayCard = div("card",{marginBottom:"12px"});
    overlayCard.appendChild(el("span",{class:"lbl"},"ORDER & OVERLAYS - drag to reorder"));
    f.contentIds.forEach((id,idx) => {
      const c = state.content.find(x=>x.id===id);
      const row = div("",{display:"flex",alignItems:"flex-start",gap:"8px",padding:"8px 10px",borderRadius:"8px",background:"#f9f9f9",marginBottom:"6px",border:"1px solid #f0f0f0"});
      row.appendChild(el("span",{style:{fontSize:"12px",color:"#9ca3af",marginTop:"4px",flexShrink:0}},"::"));
      const thumb2 = div("",{width:"26px",height:"26px",borderRadius:"6px",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",color:"#9ca3af",flexShrink:0,border:"1px solid #f0f0f0"});
      thumb2.appendChild(txt(c?.type[0]||""));
      row.appendChild(thumb2);
      const infoWrap = div("",{flex:1,minWidth:0});
      infoWrap.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,marginBottom:"4px",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},"Slide "+(idx+1)+" - "+(c?.label||"")));
      const ovInp = el("input",{class:"inp",placeholder:"Text overlay...",style:{fontSize:"11px"},value:f.overlays[id]||""});
      ovInp.addEventListener("input", e=>{ state.draftForm.overlays[id]=e.target.value; });
      infoWrap.appendChild(ovInp);
      row.appendChild(infoWrap);
      const remBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",color:"#9ca3af",fontSize:"14px",marginTop:"2px"}},"x");
      remBtn.addEventListener("click", () => { state.draftForm.contentIds=f.contentIds.filter(x=>x!==id); render(); });
      row.appendChild(remBtn);
      overlayCard.appendChild(row);
    });
    formArea.appendChild(overlayCard);
  }

  // Caption/hashtags
  const captionCard = div("card",{marginBottom:"12px"});
  captionCard.appendChild(el("span",{class:"lbl"},"CAPTION"));
  const capTA = el("textarea",{class:"inp",rows:3,placeholder:"Write your caption..."});
  capTA.value = f.caption;
  capTA.addEventListener("input", e=>{ state.draftForm.caption=e.target.value; });
  captionCard.appendChild(capTA);
  captionCard.appendChild(el("span",{class:"lbl",style:{marginTop:"10px"}},"HASHTAGS"));
  const hashInp = el("input",{class:"inp",placeholder:"#fyp #pickleball",value:f.hashtags});
  hashInp.addEventListener("input", e=>{ state.draftForm.hashtags=e.target.value; });
  captionCard.appendChild(hashInp);
  formArea.appendChild(captionCard);

  // Save buttons
  const btnRow = div("",{display:"flex",gap:"8px",marginBottom:"20px"});
  const saveBtn = renderBtn(isEdit?"Save Changes":"Save Draft", true, () => {
    const draft = {
      id:state.editingDraft?.id||"d"+Date.now(), name:f.name||autoName(f.platform,f.accountId,f.type,f.scheduledAt,1),
      accountId:f.accountId, platform:f.platform, type:f.type,
      contentIds:[...f.contentIds], overlays:f.contentIds.map(id=>f.overlays[id]||""),
      caption:f.caption, hashtags:f.hashtags, scheduledAt:f.scheduledAt, status:f.status, postOrder:1
    };
    const newDrafts = isEdit ? state.drafts.map(d=>d.id===draft.id?draft:d) : [...state.drafts,draft];
    setState({drafts:newDrafts, editingDraft:null, draftForm:{platform:"Instagram",accountId:"ig-main",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"}, draftNameOverridden:false});
    if (isAuthenticated()) saveToSheets();
  }, {flex:1,justifyContent:"center"});
  const clearBtn = renderBtn(isEdit?"Cancel":"Clear", false, () => {
    setState({editingDraft:null, draftForm:{platform:"Instagram",accountId:"ig-main",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"}, draftNameOverridden:false});
  }, {flex:1,justifyContent:"center"});
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(clearBtn);
  formArea.appendChild(btnRow);
  wrap.appendChild(formArea);

  // Preview
  const preview = div("",{width:"220px",background:"#fff",borderLeft:"1px solid #f0f0f0",overflowY:"auto",padding:"14px",flexShrink:0});
  preview.appendChild(el("div",{style:{fontSize:"10px",fontWeight:500,marginBottom:"12px",color:"#6b7280",fontFamily:"monospace",letterSpacing:"0.06em"}},"PREVIEW"));
  const prevCard = div("",{background:"#f9f9f9",borderRadius:"10px",padding:"12px",marginBottom:"10px"});
  const accInfo = state.accounts.find(a=>a.id===f.accountId);
  const accRow = div("",{display:"flex",alignItems:"center",gap:"7px",marginBottom:"10px"});
  accRow.appendChild(el("div",{style:{width:"24px",height:"24px",borderRadius:"50%",background:f.platform==="Instagram"?"#E1306C":"#444",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",color:"#fff"}},f.platform==="Instagram"?"IG":"TT"));
  const accInfoDiv = div("",{});
  accInfoDiv.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500}},accInfo?.handle||""));
  accInfoDiv.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace"}},accInfo?.sub||""));
  accRow.appendChild(accInfoDiv);
  prevCard.appendChild(accRow);
  if (f.contentIds.length) {
    f.contentIds.forEach((id,idx) => {
      const c = state.content.find(x=>x.id===id);
      const slide = div("",{background:"#fff",borderRadius:"8px",padding:"7px 9px",border:"1px solid #f0f0f0",marginBottom:"5px"});
      slide.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginBottom:f.overlays[id]?"4px":"0"}},"Slide "+(idx+1)));
      if (f.overlays[id]) slide.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500,background:"rgba(0,0,0,0.06)",borderRadius:"4px",padding:"2px 6px"}},f.overlays[id]));
      prevCard.appendChild(slide);
    });
  } else {
    const empty = div("",{background:"#f0f0f0",borderRadius:"8px",height:"70px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",color:"#9ca3af",marginBottom:"10px"});
    empty.appendChild(txt("No content"));
    prevCard.appendChild(empty);
  }
  if (f.caption) prevCard.appendChild(el("div",{style:{fontSize:"11px",color:"#1a1a1a",marginBottom:"4px",lineHeight:1.4}},f.caption));
  if (f.hashtags) prevCard.appendChild(el("div",{style:{fontSize:"10px",color:"#3b82f6",fontFamily:"monospace"}},f.hashtags));
  preview.appendChild(prevCard);
  preview.appendChild(renderBadge(f.status));
  if (f.scheduledAt) preview.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginTop:"5px"}},f.scheduledAt.replace("T"," ")));
  if (f.name) {
    const nameTag = el("div",{style:{fontSize:"9px",color:"#c4b5fd",fontFamily:"monospace",marginTop:"4px",wordBreak:"break-all",background:"#1c1c1e",borderRadius:"6px",padding:"4px 7px"}},f.name);
    preview.appendChild(nameTag);
  }
  wrap.appendChild(preview);
  return wrap;
}

function updateDraftName() {
  if (state.draftNameOverridden) return;
  const f = state.draftForm;
  const order = state.drafts.filter(d=>d.accountId===f.accountId&&d.scheduledAt?.slice(0,10)===f.scheduledAt?.slice(0,10)).length + (state.editingDraft?0:1);
  state.draftForm.name = autoName(f.platform,f.accountId,f.type,f.scheduledAt,order);
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function renderCalendar() {
  const wrap = div("",{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden"});

  const vDate = new Date(NOW.getFullYear(), NOW.getMonth()+state.calendarMonthOffset, 1);
  const mName = vDate.toLocaleString("default",{month:"long",year:"numeric"});
  const dim   = new Date(vDate.getFullYear(),vDate.getMonth()+1,0).getDate();
  const firstD= (new Date(vDate.getFullYear(),vDate.getMonth(),1).getDay()+6)%7;

  const cf = state.calendarFilters;
  const filtered = state.drafts.filter(d => {
    return (cf.platforms.length===0||cf.platforms.includes(d.platform)) &&
           (cf.accounts.length===0||cf.accounts.includes(d.accountId)) &&
           (cf.types.length===0||cf.types.includes(d.type));
  });

  const postsForDay = day => filtered.filter(d => {
    const dd = new Date(d.scheduledAt);
    return dd.getFullYear()===vDate.getFullYear()&&dd.getMonth()===vDate.getMonth()&&dd.getDate()===day;
  }).sort((a,b)=>new Date(a.scheduledAt)-new Date(b.scheduledAt));

  // Toolbar
  const toolbar = div("",{padding:"10px 16px",background:"#fff",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:"8px",flexShrink:0,flexWrap:"wrap"});
  const prevBtn = renderBtn("<", false, () => setState({calendarMonthOffset:state.calendarMonthOffset-1}), {padding:"5px 10px"});
  toolbar.appendChild(prevBtn);
  toolbar.appendChild(el("span",{style:{fontSize:"13px",fontWeight:500,minWidth:"130px",textAlign:"center"}},mName));
  const nextBtn = renderBtn(">", false, () => setState({calendarMonthOffset:state.calendarMonthOffset+1}), {padding:"5px 10px"});
  toolbar.appendChild(nextBtn);
  toolbar.appendChild(el("div",{style:{width:"1px",background:"#e5e7eb",height:"20px",margin:"0 4px"}}));
  toolbar.appendChild(renderMultiSelect("Platform", state.platforms.map(p=>({id:p.name,label:p.name,color:p.color})), cf.platforms, v=>setState({calendarFilters:{...cf,platforms:v}})));
  toolbar.appendChild(renderMultiSelect("Account", state.accounts.map(a=>({id:a.id,label:a.sub,color:a.color})), cf.accounts, v=>setState({calendarFilters:{...cf,accounts:v}})));
  toolbar.appendChild(renderMultiSelect("Type", state.postTypes.map(t=>({id:t.id,label:t.name})), cf.types, v=>setState({calendarFilters:{...cf,types:v}})));

  const legend = div("",{marginLeft:"auto",display:"flex",gap:"8px",fontSize:"10px"});
  Object.entries(SC).forEach(([s,c])=>{ const item=div("",{display:"flex",alignItems:"center",gap:"3px",color:"#6b7280"}); item.appendChild(el("span",{class:"dot",style:{width:"7px",height:"7px",background:c}})); item.appendChild(txt(s)); legend.appendChild(item); });
  toolbar.appendChild(legend);
  wrap.appendChild(toolbar);

  // Day headers
  const dayHeaders = div("",{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"4px",padding:"8px 16px 0",flexShrink:0});
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d => dayHeaders.appendChild(el("div",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",textAlign:"center",paddingBottom:"4px"}},d)));
  wrap.appendChild(dayHeaders);

  // Grid
  const calArea = div("content-area",{paddingTop:"0"});
  const grid = div("",{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"4px"});

  for (let i=0;i<firstD;i++) grid.appendChild(div("",{minHeight:"90px"}));

  for (let day=1;day<=dim;day++) {
    const posts = postsForDay(day);
    const isTod = day===NOW.getDate()&&vDate.getMonth()===NOW.getMonth()&&vDate.getFullYear()===NOW.getFullYear();
    const cell = div("",{background:"#fff",border:isTod?"1.5px solid #1c1c1e":"1px solid #f0f0f0",borderRadius:"10px",padding:"6px",minHeight:"90px"});

    cell.appendChild(el("div",{style:{fontSize:"10px",color:isTod?"#1c1c1e":"#9ca3af",fontFamily:"monospace",fontWeight:isTod?"600":"400",marginBottom:"4px"}},day+(isTod?" today":"")));

    posts.forEach((d,pi) => {
      const st  = getStatus(d);
      const acc = state.accounts.find(a=>a.id===d.accountId);
      const postEl = div("sc-"+st,{background:SBG[st],borderRadius:"4px",padding:"3px 5px",marginBottom:"3px",cursor:"pointer"});
      const postRow = div("",{display:"flex",alignItems:"center",gap:"3px",marginBottom:"1px"});
      postRow.appendChild(el("span",{class:"dot",style:{width:"5px",height:"5px",background:acc?.color||"#888"}}));
      postRow.appendChild(el("span",{style:{fontSize:"9px",color:STX[st],fontFamily:"monospace",fontWeight:500}},"#"+(pi+1)+" "+d.type));
      postEl.appendChild(postRow);
      postEl.appendChild(el("div",{style:{fontSize:"9px",color:"#6b7280",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}},acc?.sub||""));
      postEl.addEventListener("click", () => setState({showDraftModal:d}));
      cell.appendChild(postEl);
    });

    cell.addEventListener("dragover", e=>e.preventDefault());
    cell.addEventListener("drop", e=>{
      e.preventDefault();
      const draftId = e.dataTransfer.getData("draftId");
      if (!draftId) return;
      const nd = vDate.getFullYear()+"-"+String(vDate.getMonth()+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      const draft = state.drafts.find(x=>x.id===draftId);
      if (!draft) return;
      const ot = draft.scheduledAt?.slice(11)||"08:00";
      const ns = nd+"T"+ot;
      const newSt = draft.status==="posted"?"posted":(new Date(ns)>NOW?"scheduled":"missed");
      setState({drafts:state.drafts.map(x=>x.id===draftId?{...x,scheduledAt:ns,status:newSt}:x)});
    });

    grid.appendChild(cell);
  }
  calArea.appendChild(grid);
  wrap.appendChild(calArea);

  // Draft modal
  if (state.showDraftModal) {
    const d   = state.showDraftModal;
    const st  = getStatus(d);
    const acc = state.accounts.find(a=>a.id===d.accountId);
    const con = (d.contentIds||[]).map(id=>state.content.find(c=>c.id===id)).filter(Boolean);
    const past= isPast(d.scheduledAt);

    const overlay = div("overlay",{});
    overlay.addEventListener("click", () => setState({showDraftModal:null}));
    const modal = div("modal",{width:"380px",maxHeight:"85vh",overflowY:"auto"});
    modal.addEventListener("click", e=>e.stopPropagation());

    const mHeader = div("",{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"14px"});
    mHeader.appendChild(el("span",{style:{fontSize:"14px",fontWeight:600}},d.type+" - "+(acc?.sub||"")));
    const mClose = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"18px",color:"#9ca3af"}},"x");
    mClose.addEventListener("click", () => setState({showDraftModal:null}));
    mHeader.appendChild(mClose);
    modal.appendChild(mHeader);

    // Status buttons
    const statusSection = div("",{marginBottom:"14px"});
    statusSection.appendChild(el("div",{class:"lbl"},"STATUS"));
    const statusBtns = div("",{display:"flex",gap:"6px",flexWrap:"wrap"});
    const statusOptions = past ? ["posted","missed"] : ["draft","scheduled","posted"];
    statusOptions.forEach(s => {
      const isActive = st===s;
      const sBtn = el("button",{style:{padding:"5px 14px",borderRadius:"20px",border:"1.5px solid",borderColor:isActive?SC[s]:"#e5e7eb",background:isActive?SBG[s]:"transparent",color:isActive?STX[s]:"#9ca3af",fontSize:"11px",fontWeight:isActive?"600":"400",cursor:"pointer",fontFamily:"monospace"}},s);
      sBtn.addEventListener("click", () => {
        setState({drafts:state.drafts.map(x=>x.id===d.id?{...x,status:s}:x), showDraftModal:{...d,status:s}});
        if (isAuthenticated()) saveToSheets();
      });
      statusBtns.appendChild(sBtn);
    });
    statusSection.appendChild(statusBtns);
    modal.appendChild(statusSection);

    // Date/time
    const dtSection = div("",{marginBottom:"14px"});
    dtSection.appendChild(el("span",{class:"lbl"},"DATE AND TIME"));
    const dtInp = el("input",{type:"datetime-local",class:"inp",value:d.scheduledAt});
    dtInp.addEventListener("blur", e=>{
      const ns = e.target.value;
      if (!ns) return;
      const newSt = d.status==="posted"?"posted":(new Date(ns)>NOW?"scheduled":"missed");
      setState({drafts:state.drafts.map(x=>x.id===d.id?{...x,scheduledAt:ns,status:newSt}:x), showDraftModal:{...d,scheduledAt:ns,status:newSt}});
    });
    dtSection.appendChild(dtInp);
    modal.appendChild(dtSection);

    // Content
    modal.appendChild(el("div",{class:"section-title"},"CONTENT"));
    con.forEach((c,i) => {
      const cRow = div("",{display:"flex",alignItems:"center",gap:"8px",background:"#f9f9f9",borderRadius:"8px",padding:"7px 10px",marginBottom:"5px"});
      cRow.appendChild(el("span",{style:{fontSize:"14px"}},c.type[0]));
      const cInfo = div("",{flex:1});
      cInfo.appendChild(el("div",{style:{fontSize:"11px",fontWeight:500}},c.label));
      if (d.overlays[i]) cInfo.appendChild(el("div",{style:{fontSize:"10px",color:"#6b7280",fontFamily:"monospace",marginTop:"2px"}},'"'+d.overlays[i]+'"'));
      cRow.appendChild(cInfo);
      modal.appendChild(cRow);
    });

    if (d.caption) { modal.appendChild(el("div",{class:"section-title",style:{marginTop:"12px"}},"CAPTION")); modal.appendChild(el("div",{style:{fontSize:"12px",color:"#374151",lineHeight:1.4,marginBottom:"6px"}},d.caption)); }
    if (d.hashtags) modal.appendChild(el("div",{style:{fontSize:"11px",color:"#3b82f6",fontFamily:"monospace",marginBottom:"12px"}},d.hashtags));

    const mBtns = div("",{display:"flex",gap:"8px",marginTop:"16px"});
    const editBtn = renderBtn("Edit Draft", false, () => {
      const overlaysObj = {};
      (d.contentIds||[]).forEach((id,i)=>{ overlaysObj[id]=d.overlays[i]||""; });
      setState({editingDraft:d, draftForm:{platform:d.platform,accountId:d.accountId,type:d.type,contentIds:[...d.contentIds],overlays:overlaysObj,caption:d.caption,hashtags:d.hashtags,scheduledAt:d.scheduledAt,name:d.name,status:d.status}, draftNameOverridden:true, tab:"draft", showDraftModal:null});
    }, {flex:1,justifyContent:"center",fontSize:"11px"});
