<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;font-size:13px;background:#f8f8f7;overflow:hidden;height:100vh;}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:220px;background:#1c1c1e;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:10px 16px;background:#fff;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.card{background:#fff;border:1px solid #f0f0f0;border-radius:12px;padding:12px;}
button{cursor:pointer;font-family:system-ui;font-size:12px;}
input,select,textarea{font-family:system-ui;font-size:12px;color:#1a1a1a;}
.inp{width:100%;padding:7px 10px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;box-sizing:border-box;}
.sel{width:100%;padding:7px 10px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;}
.btn-primary{padding:7px 14px;border-radius:8px;border:none;background:#1c1c1e;color:#fff;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;}
.btn-secondary{padding:7px 14px;border-radius:8px;border:1px solid #e5e7eb;background:transparent;color:#6b7280;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;}
.btn-danger{padding:4px 10px;border-radius:6px;border:none;background:#fef2f2;color:#ef4444;cursor:pointer;font-size:11px;}
.lbl{font-size:10px;color:#9ca3af;font-family:monospace;letter-spacing:0.06em;margin-bottom:4px;display:block;}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;border-radius:8px;background:transparent;color:#9ca3af;font-size:12px;cursor:pointer;text-align:left;margin-bottom:2px;}
.nav-btn.active{background:rgba(255,255,255,0.1);color:#fff;font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;font-family:monospace;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.content-area{flex:1;overflow-y:auto;padding:16px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,0.15);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1.5px solid #e5e7eb;background:transparent;cursor:pointer;font-size:11px;color:#6b7280;}
.pill.active{font-weight:600;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;}
.section-title{font-size:10px;color:#6b7280;font-family:monospace;letter-spacing:0.06em;margin-bottom:8px;}
.status-draft{background:#f3f4f6;color:#6b7280;}
.status-scheduled{background:#eff6ff;color:#1d4ed8;}
.status-posted{background:#f0fdf4;color:#15803d;}
.status-missed{background:#fef2f2;color:#b91c1c;}
.sc-draft{border-left:2px solid #9ca3af;}
.sc-scheduled{border-left:2px solid #3b82f6;}
.sc-posted{border-left:2px solid #22c55e;}
.sc-missed{border-left:2px solid #ef4444;}
.google-btn{display:flex;align-items:center;gap:10px;padding:10px 20px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#374151;}
.google-btn:hover{background:#f9fafb;}
.sync-indicator{display:flex;align-items:center;gap:5px;font-size:11px;color:#22c55e;font-family:monospace;}
.sync-indicator.syncing{color:#3b82f6;}
.sync-indicator.error{color:#ef4444;}

/* Mobile responsive */
@media (max-width: 768px) {
  .app{flex-direction:column;height:100vh;}
  .sidebar{width:100%;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible;flex-shrink:0;}
  .sidebar-mobile-hidden{display:none;}

  .desktop-only{display:none!important;}

  .grid3{grid-template-columns:repeat(2,1fr)!important;}
  .grid2{grid-template-columns:1fr!important;}
  .topbar{padding:8px 12px!important;}
}
@media (min-width: 769px) {
  .mobile-nav{display:none!important;}
  .mobile-only{display:none!important;}
}

/* sidebar */

/* detail panel */
.dark [data-panel="detail"]{background:var(--dk-surface);border-color:var(--dk-border);color:var(--dk-text);}
/* toolbar/filter strips */

.dark .pill{border-color:var(--dk-border);color:var(--dk-muted);}

/* nav buttons */
.dark .nav-btn{color:var(--dk-muted);}
.dark .nav-btn.active{background:rgba(232,230,224,0.1);color:var(--dk-text);}

// ── THUMBNAIL HELPER ─────────────────────────────────────────────────────────
const thumbCache = {};
function setThumbCache(driveId, url) {
  const old = thumbCache[driveId];
  if (old && old.startsWith("blob:")) URL.revokeObjectURL(old);
  setThumbCache(driveId, url);
}
function setThumbSrc(img, driveId) {
  if (!driveId) return;
  // Always use authenticated fetch - most reliable across all devices/sessions
  if (thumbCache[driveId]) { img.src = thumbCache[driveId]; return; }
  img.src = ""; // clear while loading
  if (!isAuthenticated()) {
    img.src = "https://drive.google.com/thumbnail?id="+driveId+"&sz=w400";
    img.onerror = ()=>{ img.style.display="none"; };
    return;
  }
  fetch("https://www.googleapis.com/drive/v3/files/"+driveId+"?fields=thumbnailLink", {
    headers: {Authorization: "Bearer "+state.token}
  })
  .then(r=>r.json())
  .then(data=>{
    if (data.thumbnailLink) {
      const url = data.thumbnailLink.replace(/=s\d+$/,"=s400");
      setThumbCache(driveId, url);
      if (img.isConnected) img.src = url;
    } else {
      // Drive hasn't generated thumbnail yet (common for fresh uploads) — use public embed URL
      const publicUrl = "https://drive.google.com/thumbnail?id="+driveId+"&sz=w400";
      if (img.isConnected) {
        img.src = publicUrl;
        img.onerror = () => {
          // Last resort: fetch as blob
          fetch("https://www.googleapis.com/drive/v3/files/"+driveId+"?alt=media", {
            headers:{Authorization:"Bearer "+state.token}
          })
          .then(r=>r.blob())
          .then(blob=>{
            const url = URL.createObjectURL(blob);
            setThumbCache(driveId, url);
            if (img.isConnected) { img.onerror=null; img.src = url; }
          })
          .catch(()=>{ if(img.isConnected) img.style.display="none"; });
        };
      }
    }
  })
  .catch(()=>{ if(img.isConnected) img.style.display="none"; });
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
const NOW = new Date();
const fmt = n => n >= 1000 ? (n/1000).toFixed(1)+"k" : String(n||0);
const pct = (a,b) => b ? ((a/b)*100).toFixed(1)+"%" : "0%";
const SC  = {draft:"#9ca3af",scheduled:"#3b82f6",posted:"#22c55e",missed:"#ef4444"};
const SBG = {draft:"#f3f4f6",scheduled:"#eff6ff",posted:"#f0fdf4",missed:"#fef2f2"};
const STX = {draft:"#6b7280",scheduled:"#1d4ed8",posted:"#15803d",missed:"#b91c1c"};

function getStatus(d) {
  if (d.status === "posted") return "posted";
  if (new Date(d.scheduledAt) < NOW) return "missed";
  return d.status === "draft" ? "draft" : "scheduled";
}
function isPast(s) { return new Date(s) < NOW; }

function folderPath(folderId) {
  if (_folderPathCache && folderId in _folderPathCache) return _folderPathCache[folderId];
  const parts = [];
  let cur = state.folders.find(x => x.id === folderId);
  while (cur) { parts.unshift(cur.name); cur = cur.parentId ? state.folders.find(x => x.id === cur.parentId) : null; }
  return parts.join(" > ");
}

function autoName(platform, accountId, type, date, order) {
  if (!accountId || !state.accounts.length) return ""; // return empty if not ready
  const acc = state.accounts.find(a=>a.id===accountId);
  if (!acc) return ""; // return empty if account not found yet
  const accLabel = acc.sub.replace(/\s+/g,"-");
  const platCode = platform === "Instagram" ? "IG" : "TT";
  const d = date ? date.slice(0,10).replace(/-/g,"") : "00000000";
  return platCode+"_"+accLabel+"_"+type+"_"+String(order).padStart(3,"0")+"_"+d;
}

function setState(updates) {
  // Preserve picker state across renders
  const pickerSearch = state.draftPickerSearch;
  const pickerFolder = state.draftPickerFolder;
  const pickerSfw    = state.draftPickerSfw;
  Object.assign(state, updates);
  if (!("draftPickerSearch" in updates)) state.draftPickerSearch = pickerSearch;
  if (!("draftPickerFolder" in updates)) state.draftPickerFolder = pickerFolder;
  if (!("draftPickerSfw"    in updates)) state.draftPickerSfw    = pickerSfw;
  // Sync tab and mobileTab
  if ("tab" in updates && !("mobileTab" in updates)) state.mobileTab = updates.tab;
  if ("mobileTab" in updates && !("tab" in updates)) state.tab = updates.mobileTab;
  // Persist active tab
  if ("tab" in updates) localStorage.setItem("cs_active_tab", updates.tab);
  render();
}

// ── GOOGLE AUTH ───────────────────────────────────────────────────────────────
function isAuthenticated() {
  return state.token && state.tokenExpiry && new Date() < new Date(state.tokenExpiry);
}

function connectGoogle() {
  const redirectUri = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: redirectUri,
    response_type: "token",
    scope: SCOPES,
    include_granted_scopes: "true",
    prompt: "consent",
  });
  const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();

  // Store state so we can restore after redirect
  localStorage.setItem("cs_pre_auth_tab", state.tab);

  // Redirect in same window (more reliable than popup for GitHub Pages)
  window.location.href = authUrl;
}

function checkAuthCallback() {
  // Check if we are returning from OAuth redirect
  const hash = window.location.hash;
  if (hash && hash.includes("access_token")) {
    const params = new URLSearchParams(hash.slice(1));
    const token = params.get("access_token");
    const expiresIn = parseInt(params.get("expires_in") || "3600");
    const expiry = new Date(Date.now() + expiresIn * 1000).toISOString();
    // Clean URL
    history.replaceState(null, "", window.location.pathname);
    state.token = token;
    state.tokenExpiry = expiry;
    state.syncError = null;
    const savedTab = localStorage.getItem("cs_pre_auth_tab") || "library";
    state.tab = savedTab;
    localStorage.removeItem("cs_pre_auth_tab");
    render();
    loadFromSheets();
  }
}

function disconnectGoogle() {
  localStorage.removeItem("cs_token");
  localStorage.removeItem("cs_token_expiry");
  setState({token: null, tokenExpiry: null});
}

// ── SHEETS API ────────────────────────────────────────────────────────────────
async function sheetsGet(range) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`, {
    headers: {Authorization: "Bearer " + state.token}
  });
  if (!r.ok) throw new Error("Sheets read failed: " + r.status);
  const data = await r.json();
  return data.values || [];
}

async function sheetsSet(range, values) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`, {
    method: "PUT",
    headers: {Authorization: "Bearer " + state.token, "Content-Type": "application/json"},
    body: JSON.stringify({values})
  });
  if (!r.ok) { const t = await r.text(); throw new Error("sheetsSet "+range+": "+r.status+" "+t); }
}

async function sheetsClear(range) {
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:clear`, {
    method: "POST",
    headers: {Authorization: "Bearer " + state.token}
  });
}

async function ensureSheet(name) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}`, {
    headers: {Authorization: "Bearer " + state.token}
  });
  const data = await r.json();
  const exists = data.sheets?.some(s => s.properties.title === name);
  if (!exists) {
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}:batchUpdate`, {
      method: "POST",
      headers: {Authorization: "Bearer " + state.token, "Content-Type": "application/json"},
      body: JSON.stringify({requests:[{addSheet:{properties:{title:name}}}]})
    });
  }
}

// ── LOAD FROM SHEETS ──────────────────────────────────────────────────────────
async function loadFromSheets() {
  if (!isAuthenticated()) return;
  // Save picker state before load - never let Sheets overwrite it
  const _ps = state.draftPickerSearch;
  const _pf = state.draftPickerFolder;
  const _pw = state.draftPickerSfw;
  state.syncing = true; state.syncError = null; render();
  try {
    await Promise.all([
      ensureSheet("Models"), ensureSheet("Accounts"), ensureSheet("Platforms"),
      ensureSheet("PostTypes"), ensureSheet("Folders"), ensureSheet("Content"),
      ensureSheet("Drafts"), ensureSheet("Posts"),
      ensureSheet("SwipeAccounts"), ensureSheet("SwipeInspo"),
    ]);

    const [modelsData, accountsData, platformsData, postTypesData, foldersData, contentData, draftsData, postsData, swipeAccountsData, swipeInspoData] = await Promise.all([
      sheetsGet("Models!A2:C"), sheetsGet("Accounts!A2:J"), sheetsGet("Platforms!A2:C"),
      sheetsGet("PostTypes!A2:B"), sheetsGet("Folders!A2:D"), sheetsGet("Content!A2:K"),
      sheetsGet("Drafts!A2:P"), sheetsGet("Posts!A2:H"),
      sheetsGet("SwipeAccounts!A2:M"), sheetsGet("SwipeInspo!A2:M"),
    ]);

    const models = modelsData.length ? modelsData.map(r => ({id:r[0],label:r[1]})) : state.models;
    if (!models.find(m => m.id === "all")) models.unshift({id:"all",label:"All Models"});

    const platforms = platformsData.length ? platformsData.map(r => ({id:r[0],name:r[1],color:r[2]||"#888"})) : state.platforms;
    const postTypes = postTypesData.length ? postTypesData.map(r => ({id:r[0],name:r[1]})) : state.postTypes;
    const accounts  = accountsData.length  ? accountsData.map(r  => ({id:r[0],handle:r[1],platform:r[2],sub:r[3],color:r[4],followers:parseInt(r[5])||0,status:r[6],modelId:r[7]})) : state.accounts;
    const folders   = foldersData.length   ? foldersData.map(r   => ({id:r[0],name:r[1],parentId:r[2]||null,sfwNsfw:r[3]||null,driveId:r[4]||null,locked:r[5]==='true'})) : state.folders;

    const postsMap = {};

      modelIds: r[10] ? r[10].split("|") : ["all"],
      driveFileIds: r[11] ? r[11].split("|") : [],
      lastUpdated:r[12]||"",

    state.models=models; state.platforms=platforms; state.postTypes=postTypes;
    state.accounts=accounts; state.folders=folders; state.content=content; state.drafts=drafts;
    state.swipeAccounts=swipeAccounts; state.swipeInspo=swipeInspo;
    state.syncing=false; state.lastSynced=new Date().toLocaleTimeString();

    state.draftPickerSearch = _ps;
    state.draftPickerFolder = _pf;

// ── DRIVE API ─────────────────────────────────────────────────────────────────
async function driveListFolder(folderId) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&orderBy=name`, {
    headers: {Authorization: "Bearer " + state.token}
  });
  const data = await r.json();
  return data.files || [];
}

async function driveCreateFolder(name, parentId) {
  const r = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: {Authorization: "Bearer " + state.token, "Content-Type": "application/json"},
    body: JSON.stringify({name, mimeType:"application/vnd.google-apps.folder", parents:[parentId]})
  });
  const data = await r.json();
  return data.id;
}

async function driveUploadFile(file, name, parentId) {
  const meta = {name, parents:[parentId]};
  // Use resumable upload for files >10MB (videos etc), multipart for smaller files
  if (file.size > 10 * 1024 * 1024) {
    // Step 1: initiate resumable session
    const initR = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,webViewLink", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + state.token,
        "Content-Type": "application/json",
        "X-Upload-Content-Type": file.type || "application/octet-stream",
        "X-Upload-Content-Length": file.size,
      },
      body: JSON.stringify(meta)
    });
    const uploadUrl = initR.headers.get("Location");
    // Step 2: upload file in one PUT (chunk if needed for very large files)
    const upR = await fetch(uploadUrl, {
      method: "PUT",
      headers: {
        "Content-Type": file.type || "application/octet-stream",
        "Content-Length": file.size,
      },
      body: file
    });
    return await upR.json();
  } else {
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(meta)], {type:"application/json"}));
    form.append("file", file);
    const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
      method: "POST",
      headers: {Authorization: "Bearer " + state.token},
      body: form
    });
    return await r.json();
  }
}

async function driveCountFilesInFolder(folderId) {
  const files = await driveListFolder(folderId);
  return files.filter(f => f.mimeType !== "application/vnd.google-apps.folder").length;
}

// ── DRIVE FOLDER SYNC ─────────────────────────────────────────────────────────
async function syncDriveFolders(modelDriveId, sfwOrNsfw) {
  // Find or create 03 - Content > SFW/NSFW > 05 - Ready
  const modelContents = await driveListFolder(modelDriveId);
  let contentFolder = modelContents.find(f => f.name === "03 - Content");
  if (!contentFolder) { const id = await driveCreateFolder("03 - Content", modelDriveId); contentFolder = {id}; }

  const contentChildren = await driveListFolder(contentFolder.id);
  const sfwLabel = sfwOrNsfw === "SFW" ? "01 - SFW" : "02 - NSFW";
  let sfwFolder = contentChildren.find(f => f.name === sfwLabel);
  if (!sfwFolder) { const id = await driveCreateFolder(sfwLabel, contentFolder.id); sfwFolder = {id}; }

  const sfwChildren = await driveListFolder(sfwFolder.id);
  let readyFolder = sfwChildren.find(f => f.name === "05 - Ready");
  if (!readyFolder) { const id = await driveCreateFolder("05 - Ready", sfwFolder.id); readyFolder = {id}; }

  return readyFolder.id;
}

// ── GET SFW/NSFW FOR FOLDER ──────────────────────────────────────────────────
function getFolderSfwNsfw(folderId) {
  let f = state.folders.find(x=>x.id===folderId);
  while (f) {
    if (f.sfwNsfw) return f.sfwNsfw;
    if (!f.parentId) break;
    f = state.folders.find(x=>x.id===f.parentId);
  }
  return "SFW";
}

// ── SCAN DRIVE ────────────────────────────────────────────────────────────────
async function scanDrive(modelId) {
  if (!isAuthenticated()) { alert("Connect Google first."); return; }
  setState({syncing:true, syncError:null});
  try {
    const modelObj = state.models.find(m=>m.id===modelId);
    if (!modelObj || modelObj.id==="all") { setState({syncing:false,syncError:"Select a specific model to scan."}); return; }
    const modelName = modelObj.label;

    // Find model folder in Drive
    const modelFiles = await driveListFolder(MODELS_FOLDER_ID);
    const modelDriveFolder = modelFiles.find(f=>f.name.toLowerCase().includes(modelName.toLowerCase()));
    if (!modelDriveFolder) { setState({syncing:false,syncError:"Model folder not found in Drive: "+modelName}); return; }

    // Get existing drive IDs so we dont re-import
    const existingDriveIds = new Set(state.content.map(c=>c.driveId).filter(Boolean));
    const newContent = [];

    // Scan both SFW and NSFW
    for (const sfwNsfw of ["SFW","NSFW"]) {
      const sfwLabel = sfwNsfw==="SFW"?"01 - SFW":"02 - NSFW";
      try {
        // Navigate to 03 - Content > SFW/NSFW > 05 - Ready
        const contentChildren = await driveListFolder(modelDriveFolder.id);
        const contentFolder = contentChildren.find(f=>f.name==="03 - Content");
        if (!contentFolder) continue;

        const sfwChildren = await driveListFolder(contentFolder.id);
        const sfwFolder = sfwChildren.find(f=>f.name===sfwLabel);
        if (!sfwFolder) continue;

        const readyChildren = await driveListFolder(sfwFolder.id);
        const readyFolder = readyChildren.find(f=>f.name==="05 - Ready");
        if (!readyFolder) continue;

        // Get top-level folders in Ready (Selfie, Lifestyle, etc.)
        const categoryFolders = await driveListFolder(readyFolder.id);

        for (const catFolder of categoryFolders) {
          if (catFolder.mimeType !== "application/vnd.google-apps.folder") continue;

          // Find or create matching app folder
          const catFolderName = catFolder.name.replace(/^[0-9]+\s*-\s*/,"").trim().toLowerCase();
          // Match against SFW/NSFW children only
          const sfwNsfwFolder = state.folders.find(f=>f.id===sfwNsfw.toLowerCase());
          const sfwNsfwId = sfwNsfwFolder?.id || sfwNsfw.toLowerCase();
          let appCatFolder = state.folders.find(f=>f.parentId===sfwNsfwId&&f.name.toLowerCase()===catFolderName);
          if (!appCatFolder) {
            appCatFolder = state.folders.find(f=>f.parentId===sfwNsfwId&&(f.name.toLowerCase().includes(catFolderName)||catFolderName.includes(f.name.toLowerCase())));
          }
          if (!appCatFolder) {
            // Create it
            const newCatId = "f"+Date.now()+Math.random().toString(36).slice(2,4);
            appCatFolder = {id:newCatId,name:catFolderName,parentId:sfwNsfwId,sfwNsfw,driveId:catFolder.id};
            state.folders.push(appCatFolder);
          }

          // Get subfolders
          const subFolders = await driveListFolder(catFolder.id);
          const hasSubFolders = subFolders.some(f=>f.mimeType==="application/vnd.google-apps.folder");

          if (hasSubFolders) {
            for (const subFolder of subFolders) {
              if (subFolder.mimeType !== "application/vnd.google-apps.folder") continue;
              const subFolderName = subFolder.name.replace(/^\d+\s*-\s*/,"");

              // Find or create app subfolder
              let appSubFolder = state.folders.find(f=>f.name.toLowerCase()===subFolderName.toLowerCase()&&f.parentId===appCatFolder?.id);
              if (!appSubFolder && appCatFolder) {
                // Try partial match
                appSubFolder = state.folders.find(f=>f.parentId===appCatFolder?.id&&(f.name.toLowerCase().includes(subFolderName.toLowerCase())||subFolderName.toLowerCase().includes(f.name.toLowerCase())));
              }
              if (!appSubFolder && appCatFolder) {
                appSubFolder = {id:"f"+Date.now()+Math.random().toString(36).slice(2,6),name:subFolderName,parentId:appCatFolder.id,sfwNsfw,driveId:subFolder.id};
                state.folders.push(appSubFolder);
              }

              // Scan files in subfolder
              const files = await driveListFolder(subFolder.id);
              for (const file of files) {
                if (file.mimeType==="application/vnd.google-apps.folder") continue;
                if (existingDriveIds.has(file.id)) continue;
                const fileDetails = await fetch("https://www.googleapis.com/drive/v3/files/"+file.id+"?fields=id,name,webViewLink,thumbnailLink",{headers:{Authorization:"Bearer "+state.token}}).then(r=>r.json());
                // Parse filename: LillyRose_selfie_bathroom_0001 -> sub=bathroom
                const nameParts = file.name.replace(/\.[^.]+$/,"").split("_");
                let bestFolderId = appSubFolder?.id||appCatFolder?.id||"f1";
                if (nameParts.length >= 3) {
                  const subName = nameParts[2].toLowerCase();
                  const matchedSub = state.folders.find(f=>f.name.toLowerCase()===subName&&f.parentId===appCatFolder?.id);
                  if (matchedSub) bestFolderId = matchedSub.id;
                  else if (appSubFolder) bestFolderId = appSubFolder.id;
                }
                newContent.push({
                  id:"c"+Date.now()+Math.random().toString(36).slice(2,8),
                  folderId:bestFolderId,
                  type:"", label:file.name,
                  uploaded:new Date().toISOString().slice(0,10),
                  icon:"f", modelId, sfwNsfw,
                  driveId:file.id, driveUrl:fileDetails.webViewLink||"",
                  thumbnailUrl:fileDetails.thumbnailLink||"",
                  posts:[]
                });
                existingDriveIds.add(file.id);
              }
            }
          } else {
            // Files directly in category folder
            for (const file of subFolders) {
              if (file.mimeType==="application/vnd.google-apps.folder") continue;
              if (existingDriveIds.has(file.id)) continue;
              const fileDetails = await fetch("https://www.googleapis.com/drive/v3/files/"+file.id+"?fields=id,name,webViewLink,thumbnailLink",{headers:{Authorization:"Bearer "+state.token}}).then(r=>r.json());
              newContent.push({
                id:"c"+Date.now()+Math.random().toString(36).slice(2,8),
                folderId:appCatFolder?.id||"f1",
                type:"", label:file.name,
                uploaded:new Date().toISOString().slice(0,10),
                icon:"f", modelId, sfwNsfw,
                driveId:file.id, driveUrl:fileDetails.webViewLink||"",
                thumbnailUrl:fileDetails.thumbnailLink||"",
                posts:[]
              });
              existingDriveIds.add(file.id);
            }
          }
        }
      } catch(e) { console.warn("Scan error for "+sfwNsfw+":", e); }
    }

    const updatedContent = [...state.content, ...newContent];
    setState({content:updatedContent, syncing:false, lastSynced:new Date().toLocaleTimeString()});
    if (newContent.length) { await saveToSheets(); alert("Imported "+newContent.length+" new file(s)."); }
    else alert("No new files found.");
  } catch(e) {
    setState({syncing:false, syncError:e.message});
  }
}

// ── CREATE DRIVE FOLDER FOR APP FOLDER ───────────────────────────────────────
async function createDriveFolderForAppFolder(appFolder, modelId) {
  if (!isAuthenticated()) return null;
  try {
    const modelObj = state.models.find(m=>m.id===modelId);
    if (!modelObj || modelObj.id==="all") return null;
    const modelFiles = await driveListFolder(MODELS_FOLDER_ID);
    const modelDriveFolder = modelFiles.find(f=>f.name.toLowerCase().includes(modelObj.label.toLowerCase()));
    if (!modelDriveFolder) return null;

    const sfwNsfw = appFolder.sfwNsfw || getFolderSfwNsfw(appFolder.parentId);
    const readyFolderId = await syncDriveFolders(modelDriveFolder.id, sfwNsfw);

    // Find parent drive folder
    let parentDriveId = readyFolderId;
    if (appFolder.parentId && appFolder.parentId !== "sfw" && appFolder.parentId !== "nsfw") {
      const parentAppFolder = state.folders.find(f=>f.id===appFolder.parentId);
      if (parentAppFolder?.driveId) parentDriveId = parentAppFolder.driveId;
      else {
        // Try to find by name in ready folder
        const readyContents = await driveListFolder(readyFolderId);
        const match = readyContents.find(f=>f.name.toLowerCase().includes(parentAppFolder?.name.toLowerCase()||""));
        if (match) parentDriveId = match.id;
      }
    }

    const newDriveId = await driveCreateFolder(appFolder.name, parentDriveId);
    return newDriveId;
  } catch(e) { console.warn("createDriveFolderForAppFolder failed:", e); return null; }
}

// ── UPLOAD FILE ───────────────────────────────────────────────────────────────
async function uploadFile(file, folderId, modelName, category, subfolder, sfwNsfw) {
  if (!isAuthenticated()) return null;
  try {
    const folderFiles = await driveListFolder(folderId);
    const count = folderFiles.filter(f => f.mimeType !== "application/vnd.google-apps.folder").length;
    const nextNum = String(count + 1).padStart(4, "0");
    const ext = file.name.split(".").pop();
    const safeName = modelName.replace(/\s+/g,"");
    const safeCategory = category.toLowerCase().replace(/\s+/g,"-");
    const safeSubfolder = subfolder.toLowerCase().replace(/\s+/g,"-");
    const newName = safeName + "_" + safeCategory + "_" + safeSubfolder + "_" + nextNum + "." + ext;
    const result = await driveUploadFile(file, newName, folderId);
    return {name: newName, driveId: result.id, driveUrl: result.webViewLink};
  } catch(e) {
    console.error("Upload failed:", e);
    return null;
  }
}

      if (thumbUrl) {
        setThumbCache(c.driveId, thumbUrl);
        newContent = newContent.map(x => x.id===c.id ? {...x, thumbnailUrl:thumbUrl} : x);
        updated++;
      }
    } catch(e) {}
    await new Promise(res => setTimeout(res, 200));
  }
  setState({content:newContent, fetchingThumbnails:false, fetchThumbProgress:`Done — ${updated} of ${missing.length} updated.`});
  if (isAuthenticated()) saveToSheets();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
// ── RENDER-TIME LOOKUP CACHES (rebuilt once per render, used everywhere) ──────
let _accountMap = {};   // id → account
let _folderPathCache = {}; // folderId → path string
let _draftsByContentId = {}; // contentId → drafts[]

function buildRenderCaches() {
  _accountMap = {};
  state.accounts.forEach(a => { _accountMap[a.id] = a; });

  _folderPathCache = {};
  function getFolderPath(folderId) {
    if (folderId in _folderPathCache) return _folderPathCache[folderId];
    const parts = [];
    let cur = state.folders.find(x => x.id === folderId);
    while (cur) { parts.unshift(cur.name); cur = cur.parentId ? state.folders.find(x => x.id === cur.parentId) : null; }
    _folderPathCache[folderId] = parts.join(" > ");
    return _folderPathCache[folderId];
  }
  state.folders.forEach(f => getFolderPath(f.id));

  _draftsByContentId = {};
  state.drafts.forEach(d => {
    (d.contentIds || []).forEach(cid => {
      if (!_draftsByContentId[cid]) _draftsByContentId[cid] = [];
      _draftsByContentId[cid].push(d);
    });
  });
}

function render() {
  buildRenderCaches();
  const root = document.getElementById("root");
  root.innerHTML = "";
  const isMobile = window.innerWidth <= 768;
  root.appendChild(isMobile ? renderMobileApp() : renderApp());
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") e.className = v;
    else if (k === "checked" && tag === "input") e.checked = v;
    else if (k === "value" && (tag === "input" || tag === "select" || tag === "textarea")) { e.value = v || ""; }
    else if (k === "placeholder") e.placeholder = v;
    else if (k === "type") e.type = v;
    else if (k === "disabled") e.disabled = v;
    else if (k === "rows") e.rows = v;
    else e.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c === null || c === undefined) return;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Element) e.appendChild(c);
  });
  return e;
}

function txt(s) { return document.createTextNode(String(s||"")); }

function div(cls, style, ...children) {
  return el("div", {class:cls||"", style:style||{}}, ...children);
}

function renderDot(color, size) {
  return el("span", {class:"dot", style:{background:color||"#888",width:(size||7)+"px",height:(size||7)+"px"}});
}

function renderBadge(status) {
  return el("span", {class:"badge status-"+status}, status.toUpperCase());

function renderBtn(label, primary, onClick, extra) {
  const b = el("button", {class: primary?"btn-primary":"btn-secondary", onClick}, label);
  if (extra) Object.assign(b.style, extra);
  return b;
}

function renderInp(val, onChange, placeholder, type) {
  const i = el("input", {class:"inp", value:val, placeholder:placeholder||"", type:type||"text"});
  i.addEventListener("input", e => onChange(e.target.value));
  return i;
}

function renderSel(val, options, onChange) {
  const s = el("select", {class:"sel", value:val});
  options.forEach(o => {
    const opt = el("option", {value:o.value||o}, o.label||o);
    if ((o.value||o) === val) opt.selected = true;
    s.appendChild(opt);
  });
  s.addEventListener("change", e => onChange(e.target.value));
  return s;
}

function renderMultiSelect(label, options, selected, onChange) {
  const wrap = el("div", {style:{position:"relative",display:"inline-block",minWidth:"110px"}});

  const display = isAll ? label : selected.length <= 2 ? selected.map(s=>options.find(o=>o.id===s)?.label||s).join(", ") : selected.length+" selected";

  const btn = el("button", {style:{padding:"5px 10px",border:"1px solid #e5e7eb",borderRadius:"8px",background:"#fff",fontSize:"11px",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",color:"#374151",whiteSpace:"nowrap"}}, display+" v");
  const dropdown = el("div", {style:{display:"none",position:"absolute",top:"100%",left:0,zIndex:999,background:"#fff",border:"1px solid #e5e7eb",borderRadius:"10px",boxShadow:"0 4px 20px rgba(0,0,0,0.1)",minWidth:"160px",marginTop:"4px",padding:"4px"}});

  const allCheck = el("input", {type:"checkbox", style:{width:"12px",height:"12px",cursor:"pointer"}});

  dropdown.appendChild(allLabel);

  options.forEach(o => {
    const lbl = el("label", {style:{display:"flex",alignItems:"center",gap:"8px",padding:"6px 10px",cursor:"pointer",borderRadius:"6px",background:selected.includes(o.id)?"#f3f4f6":"transparent"}});

    chk.addEventListener("change", () => {
      const next = selected.includes(o.id) ? selected.filter(x=>x!==o.id) : [...selected,o.id];

    // Per-platform status sections in detail panel
    const statusSections = [
      {key:"available", label:"AVAILABLE ON",    bg:"transparent",  border:"1px dashed #e5e7eb", color:"#9ca3af",  textColor:"#9ca3af"},
      {key:"draft",     label:"DRAFTED ON",      bg:"#f3f4f6",      border:"1px solid #e5e7eb",  color:"#6b7280",  textColor:"#374151"},

    ];

        const overallSt = ps === null ? "available" : ps;

          ? getContentDraftsForPlatform(sel.id, plat.name, section.key)

        if (section.key==="available") {
          const row = div("",{display:"flex",alignItems:"center",gap:"7px",padding:"6px 8px",border:section.border,borderRadius:"8px",marginBottom:"5px"});

        } else {
          draftsForPlat.forEach(d => {
            const acc = state.accounts.find(a=>a.id===d.accountId);
            const pCard = div("",{background:section.bg,border:section.border,borderRadius:"8px",padding:"8px 10px",marginBottom:"5px"});
            const pRow = div("",{display:"flex",alignItems:"center",gap:"6px",marginBottom:d.name?"4px":"0"});
            pRow.appendChild(renderDot(acc?.color||plat.color||"#888"));

            pRow.appendChild(el("span",{style:{fontSize:"10px",color:"#9ca3af",fontFamily:"monospace",marginLeft:"auto"}},d.scheduledAt?.slice(0,10)||""));
            pCard.appendChild(pRow);

            panelBody.appendChild(pCard);

        }

    });

    panel.appendChild(panelBody);

// ── UPLOAD MODAL ──────────────────────────────────────────────────────────────
function renderUploadModal() {
  let selectedFile = null;
  let selectedFolder = "";
  let selectedSFW = "SFW";
  let uploadStatus = "";

  const overlay = div("overlay", {});
  const modal = div("modal", {width:"420px"});

  const header = div("", {display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px"});
  header.appendChild(el("span",{style:{fontSize:"14px",fontWeight:600}},"Upload Content"));
  const closeBtn = el("button",{style:{border:"none",background:"transparent",cursor:"pointer",fontSize:"18px",color:"#9ca3af"}},"x");
  closeBtn.addEventListener("click", () => setState({showUpload:false}));
  header.appendChild(closeBtn);
  modal.appendChild(header);

  // Model
  const modelRow = div("",{marginBottom:"10px"});
  modelRow.appendChild(el("span",{class:"lbl"},"MODEL"));
  const modelSel = renderSel(state.model==="all"?(state.models[1]?.id||""):(state.model), state.models.filter(m=>m.id!=="all").map(m=>({value:m.id,label:m.label})), v=>{});
  modelRow.appendChild(modelSel);
  modal.appendChild(modelRow);

  // SFW/NSFW
  const sfwRow = div("",{marginBottom:"10px"});
  sfwRow.appendChild(el("span",{class:"lbl"},"CONTENT TYPE"));
  const sfwWrap = div("",{display:"flex",gap:"6px"});
  ["SFW","NSFW"].forEach(opt => {
    const btn = el("button",{style:{flex:1,padding:"7px",border:"1.5px solid",borderColor:selectedSFW===opt?"#1c1c1e":"#e5e7eb",borderRadius:"8px",background:selectedSFW===opt?"#1c1c1e":"transparent",color:selectedSFW===opt?"#fff":"#6b7280",cursor:"pointer",fontSize:"12px",fontWeight:500}},opt);
    btn.addEventListener("click", () => { selectedSFW=opt; sfwWrap.querySelectorAll("button").forEach((b,i)=>{ const o=["SFW","NSFW"][i]; Object.assign(b.style,{borderColor:o===opt?"#1c1c1e":"#e5e7eb",background:o===opt?"#1c1c1e":"transparent",color:o===opt?"#fff":"#6b7280"}); }); });
    sfwWrap.appendChild(btn);
  });
  sfwRow.appendChild(sfwWrap);
  modal.appendChild(sfwRow);

  // Folder
  const folderRow = div("",{marginBottom:"10px"});
  folderRow.appendChild(el("span",{class:"lbl"},"FOLDER"));
  const folderSel = renderSel("", state.folders.map(f=>({value:f.id,label:folderPath(f.id)})), v=>{ selectedFolder=v; });
  folderRow.appendChild(folderSel);
  modal.appendChild(folderRow);

  // File picker
  const fileRow = div("",{marginBottom:"16px"});
  fileRow.appendChild(el("span",{class:"lbl"},"FILE"));
  const fileInp = el("input",{type:"file",class:"inp",style:{padding:"5px"},accept:"image/*,video/*"});
  fileInp.addEventListener("change", e=>{ selectedFile=e.target.files[0]; });
  fileRow.appendChild(fileInp);
  modal.appendChild(fileRow);

  // Status
  const statusEl = el("div",{style:{fontSize:"12px",color:"#6b7280",marginBottom:"10px",minHeight:"18px"}});
  modal.appendChild(statusEl);

  // Upload btn
  const upBtn = renderBtn("Upload to Drive", true, async () => {
    if (!selectedFile) { statusEl.textContent="Please select a file."; return; }
    if (!selectedFolder) { statusEl.textContent="Please select a folder."; return; }
    if (!isAuthenticated()) { statusEl.textContent="Please connect Google first."; return; }

    upBtn.textContent="Uploading...";
    upBtn.disabled=true;
    statusEl.textContent="Finding Drive folder...";

    try {
      const modelId = modelSel.value;
      const modelObj = state.models.find(m=>m.id===modelId);
      const modelName = modelObj?.label||"Model";

      // Find model folder in Drive
      const modelFiles = await driveListFolder(MODELS_FOLDER_ID);
      const modelDriveFolder = modelFiles.find(f=>f.name.toLowerCase().includes(modelName.toLowerCase()));

      if (!modelDriveFolder) { statusEl.textContent="Model folder not found in Drive. Create it first."; upBtn.textContent="Upload to Drive"; upBtn.disabled=false; return; }

      statusEl.textContent="Finding ready folder...";
      const readyFolderId = await syncDriveFolders(modelDriveFolder.id, selectedSFW);

      // Build the full folder path from app folder hierarchy
      // e.g. SFW > Selfie > gym -> 05-Ready > 01-Selfie > gym
      const folderObj = state.folders.find(f=>f.id===selectedFolder);

      // Get ancestry chain from selected folder up to sfw/nsfw root
      const ancestry = [];
      let cur = folderObj;
      while (cur && cur.id !== "sfw" && cur.id !== "nsfw") {
        ancestry.unshift(cur);
        cur = cur.parentId ? state.folders.find(f=>f.id===cur.parentId) : null;
      }
      // ancestry is now e.g. [Selfie, gym] or just [gym] or [Selfie]

      // Navigate Drive folder hierarchy starting from readyFolderId
      let currentDriveFolderId = readyFolderId;
      for (const appFolder of ancestry) {
        // Use stored driveId if available (set from Drive scan) — most reliable
        if (appFolder.driveId) {
          currentDriveFolderId = appFolder.driveId;
          continue;
        }
        const children = await driveListFolder(currentDriveFolderId);
        // Match by name — strip number prefixes from Drive folder names (e.g. "01 - Selfie" → "selfie")
        let match = children.find(f =>
          f.mimeType === "application/vnd.google-apps.folder" &&
          f.name.toLowerCase().replace(/^\d+\s*-\s*/,"") === appFolder.name.toLowerCase()
        );
        if (!match) {
          // Create the folder if it doesn't exist
          const newId = await driveCreateFolder(appFolder.name, currentDriveFolderId);
          match = {id: newId};
        }
        currentDriveFolderId = match.id;
      }

      // Get names for file naming convention
      const categoryName = ancestry.length > 1 ? ancestry[0].name : (folderObj?.name||"content");
      const subfolderName = ancestry.length > 1 ? ancestry[ancestry.length-1].name : (folderObj?.name||"content");

      const sizeMB = (selectedFile.size / 1024 / 1024).toFixed(1);
      statusEl.textContent="Uploading file ("+sizeMB+"MB)...";
      const result = await uploadFile(selectedFile, currentDriveFolderId, modelName, categoryName, subfolderName, selectedSFW);

      if (result) {
        // Fetch thumbnail link — Drive generates it async, retry up to 5x with 3s gaps
        statusEl.textContent="Processing thumbnail...";
        let thumbnailUrl = "";
        for (let attempt = 0; attempt < 5; attempt++) {
          try {
            const meta = await fetch("https://www.googleapis.com/drive/v3/files/"+result.driveId+"?fields=thumbnailLink",{headers:{Authorization:"Bearer "+state.token}}).then(r=>r.json());
            if (meta.thumbnailLink) { thumbnailUrl = meta.thumbnailLink; break; }
          } catch(e) {}
          if (attempt < 4) await new Promise(res => setTimeout(res, 3000));
        }
        const sfwTag = selectedSFW;
        const newContentId = "c"+Date.now();
        const newContent = {
          id:newContentId, folderId:selectedFolder, type:"",
          label:result.name, uploaded:new Date().toISOString().slice(0,10),
          icon:"f", modelId:modelId, sfwNsfw:sfwTag,
          driveId:result.driveId, driveUrl:result.driveUrl,
          thumbnailUrl, posts:[]
        };
        setState({content:[...state.content,newContent],showUpload:false});
        if (isAuthenticated()) saveToSheets();
        // If thumbnail still missing, keep retrying in background for up to 60s
        if (!thumbnailUrl) {
          (async () => {
            for (let i = 0; i < 8; i++) {
              await new Promise(res => setTimeout(res, 5000));
              try {
                const meta = await fetch("https://www.googleapis.com/drive/v3/files/"+result.driveId+"?fields=thumbnailLink",{headers:{Authorization:"Bearer "+state.token}}).then(r=>r.json());
                if (meta.thumbnailLink) {
                  setThumbCache(result.driveId, meta.thumbnailLink);
                  setState({content:state.content.map(c=>c.id===newContentId?{...c,thumbnailUrl:meta.thumbnailLink}:c)});
                  if (isAuthenticated()) saveToSheets();
                  break;
                }
              } catch(e) {}
            }
          })();
        }
      } else {
        statusEl.textContent="Upload failed. Try again.";
        upBtn.textContent="Upload to Drive"; upBtn.disabled=false;
      }
    } catch(e) {
      statusEl.textContent="Error: "+e.message;
      upBtn.textContent="Upload to Drive"; upBtn.disabled=false;
    }
  });
  modal.appendChild(upBtn);
  overlay.appendChild(modal);
  return overlay;
}

// ── DRAFT POST ────────────────────────────────────────────────────────────────
function renderDraft() {
  const f = state.draftForm;
  const isEdit = !!state.editingDraft;
  const wrap = div("",{display:"flex",height:"100%",overflow:"hidden"});
  const formArea = div("content-area",{maxWidth:"560px"});

  if (isEdit) {

    editBanner.appendChild(txt("Editing draft"));

    cancelEdit.addEventListener("click", () => setState({editingDraft:null, draftForm:{platform:"Instagram",accountId:"ig-main",type:"Story",contentIds:[],overlays:{},caption:"",hashtags:"",scheduledAt:"",name:"",status:"draft"}, draftNameOverridden:false}));

    formArea.appendChild(editBanner);
  }

  // Post name
  const nameCard = div("card",{marginBottom:"12px"});
  nameCard.appendChild(el("span",{class:"lbl"},"POST NAME"));
